# Reusable Open-Chat Issue Plan workflow.
#
# Caller repos use this like:
#
#   jobs:
#     open-chat-issue-plan:
#       uses: msgmate-io/open-chat-go/.github/workflows/reusable-open-chat-issue-plan.yaml@main
#       secrets: inherit   # or pass OPEN_CHAT_API_TOKEN (+ optional BOT_TOKEN) explicitly
#
# Configuration resolution order for every input:
#   caller repo variables (vars.OPEN_CHAT_*)  ->  inputs.<name>  ->  built-in default
#
# The Open-Chat server is expected to be pre-configured: the plan bot
# (with its agent/sandbox/playbook) and the git credentials it needs
# must exist on the server side.
name: Reusable Open-Chat Issue Plan

on:
  workflow_call:
    inputs:
      bot_user:
        description: GitHub login of the bot used for gh/git authentication on the server (falls back to vars.OPEN_CHAT_BOT_GITHUB_USER, then 'cur1ousdude')
        required: false
        type: string
        default: ""
      allowed_author:
        description: GitHub login whose assignment may trigger the plan agent (falls back to vars.OPEN_CHAT_ALLOWED_AUTHOR, then 'tbscode')
        required: false
        type: string
        default: ""
      allowed_authors:
        description: Comma-separated GitHub logins whose assignment may trigger the plan agent (falls back to vars.OPEN_CHAT_ALLOWED_AUTHORS, then to allowed_author)
        required: false
        type: string
        default: ""
      host:
        description: Open-Chat server base URL (falls back to vars.OPEN_CHAT_HOST, then 'https://ci.msgmate.io')
        required: false
        type: string
        default: ""
      plan_bot:
        description: Name of the Open-Chat bot to start the plan interaction with (falls back to vars.OPEN_CHAT_PLAN_BOT, then '<caller-repo>-plan-bot')
        required: false
        type: string
        default: ""
      auto_implement:
        description: Attach a server-side post-interaction action that posts the finished plan and dispatches the coding agent as a separate, confirmation-gated interaction
        required: false
        type: boolean
        default: true
      implement_bot:
        description: Name of the Open-Chat coding bot auto-dispatched after the plan (falls back to vars.OPEN_CHAT_IMPLEMENT_BOT, then vars.OPEN_CHAT_CODING_BOT, then '<caller-repo>-repl-bot')
        required: false
        type: string
        default: ""
      implement_require_confirmation:
        description: Require an explicit owner confirmation before the auto-dispatched implementation interaction starts (falls back to vars.OPEN_CHAT_IMPLEMENT_REQUIRE_CONFIRMATION, then true)
        required: false
        type: boolean
        default: true
      agent_context:
        description: Optional extra context block appended verbatim to the agent message header (repo-specific notes for cloned agents)
        required: false
        type: string
        default: ""
    secrets:
      OPEN_CHAT_API_TOKEN:
        description: Open-Chat API token used to create the interaction
        required: true
      BOT_TOKEN:
        description: GitHub token used to install the python client and post the badge comment (falls back to the caller's github.token)
        required: false

permissions:
  contents: read
  issues: write

env:
  OPEN_CHAT_BOT_USER: ${{ vars.OPEN_CHAT_BOT_GITHUB_USER || inputs.bot_user || 'cur1ousdude' }}
  # Security: only these authors may (have) assigned the plan bot (hard
  # filter). Comma-separated list; single-author configs (vars.OPEN_CHAT_
  # ALLOWED_AUTHOR / allowed_author) are kept as fallback for compatibility.
  OPEN_CHAT_ALLOWED_AUTHOR: ${{ vars.OPEN_CHAT_ALLOWED_AUTHOR || inputs.allowed_author || 'tbscode' }}
  OPEN_CHAT_ALLOWED_AUTHORS: ${{ vars.OPEN_CHAT_ALLOWED_AUTHORS || inputs.allowed_authors || (vars.OPEN_CHAT_ALLOWED_AUTHOR || inputs.allowed_author || 'tbscode') }}
  OPEN_CHAT_HOST: ${{ vars.OPEN_CHAT_HOST || inputs.host || 'https://ci.msgmate.io' }}
  OPEN_CHAT_PLAN_BOT: ${{ vars.OPEN_CHAT_PLAN_BOT || inputs.plan_bot || format('{0}-plan-bot', github.event.repository.name) }}
  OPEN_CHAT_IMPLEMENT_BOT: ${{ vars.OPEN_CHAT_IMPLEMENT_BOT || inputs.implement_bot || vars.OPEN_CHAT_CODING_BOT || format('{0}-repl-bot', github.event.repository.name) }}

concurrency:
  group: open-chat-issue-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  open-chat-issue-plan:
    name: Open-Chat Issue Plan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'assigned' &&
      github.event.assignee.login == (vars.OPEN_CHAT_BOT_GITHUB_USER || inputs.bot_user || 'cur1ousdude') &&
      contains(format(',{0},', (vars.OPEN_CHAT_ALLOWED_AUTHORS || inputs.allowed_authors || (vars.OPEN_CHAT_ALLOWED_AUTHOR || inputs.allowed_author || 'tbscode'))), format(',{0},', github.event.sender.login))
    steps:
      - name: Install Open-Chat python client
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          pip install "git+https://x-access-token:${GH_TOKEN}@github.com/msgmate-io/open-chat-go-python-client.git"

      - name: Trigger plan agent for assigned issue
        id: interaction
        env:
          OPEN_CHAT_API_TOKEN: ${{ secrets.OPEN_CHAT_API_TOKEN }}
          OPEN_CHAT_HOST: ${{ env.OPEN_CHAT_HOST }}
          OPEN_CHAT_PLAN_BOT: ${{ env.OPEN_CHAT_PLAN_BOT }}
          OPEN_CHAT_IMPLEMENT_BOT: ${{ env.OPEN_CHAT_IMPLEMENT_BOT }}
          IMPLEMENT_REQUIRE_CONFIRMATION: ${{ vars.OPEN_CHAT_IMPLEMENT_REQUIRE_CONFIRMATION || inputs.implement_require_confirmation || 'true' }}
          BOT_USER: ${{ env.OPEN_CHAT_BOT_USER }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          AGENT_CONTEXT: ${{ inputs.agent_context }}
          AUTO_IMPLEMENT: ${{ inputs.auto_implement }}
          REPO: ${{ github.repository }}
          ASSIGNED_BY: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if [ -z "$OPEN_CHAT_API_TOKEN" ]; then
            echo "::error::OPEN_CHAT_API_TOKEN secret is not set in this repository."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from client.client import OpenChatClient, TokenAuth

          header = (
              "You are a planning agent for a GitHub issue that the bot was assigned to.\n"
              "Your durable playbook is part of your agent definition (system_prompt); follow it.\n"
              "Investigate the issue below thoroughly in the repository (read code, search for\n"
              "related places, reproduce where possible) and produce a COMPLETE final plan.\n"
              "Your FINAL chat reply MUST be the full plan in markdown structured as:\n"
              "## Summary\n## Investigation findings\n## Proposed changes (file-by-file)\n"
              "## Verification / test plan\n## Risks & open questions\n"
              "Do NOT implement anything and do NOT post anything to GitHub yourself; planning only.\n"
              "When the interaction finishes, Open-Chat posts your final message (the plan) as a\n"
              "comment on the GitHub issue (Issue number below) and dispatches the implementation\n"
              "agent as a separate, confirmation-gated interaction; the issue owner must approve\n"
              "the posted implementation badge before the coding agent starts.\n"
              "You are authenticated on GitHub via the gh CLI (read-only usage) as the bot user \""
              + os.environ["BOT_USER"] + "\".\n"
              "\n"
              "Context:\n"
              + "- Repository: " + os.environ["REPO"] + "\n"
              + "- Kind: issue\n"
              + "- Issue number: " + os.environ["ISSUE_NUMBER"] + "\n"
              + "- Issue title: " + os.environ["ISSUE_TITLE"] + "\n"
              + "- Assigned by: " + os.environ["ASSIGNED_BY"] + "\n"
              + "\nIssue body (verbatim):\n```\n"
          )
          issue_body = (os.environ["ISSUE_BODY"] or "(empty)").strip()
          agent_context = (os.environ.get("AGENT_CONTEXT") or "").strip()
          message = header + "\n" + (agent_context + "\n\n" if agent_context else "") + issue_body + "\n```\n"

          client = OpenChatClient(
              base_url=os.environ.get("OPEN_CHAT_HOST", "https://ci.msgmate.io"),
              auth=TokenAuth(token=os.environ["OPEN_CHAT_API_TOKEN"]),
          )
          me = client.me()
          print("Authenticated as:", me.name)
          bot = client.get_bot(os.environ.get("OPEN_CHAT_PLAN_BOT", "issue-plan-bot"))
          auto_implement = os.environ.get("AUTO_IMPLEMENT", "true") in ("true", "True", "1")
          require_confirmation = os.environ.get("IMPLEMENT_REQUIRE_CONFIRMATION", "true").strip().lower() in ("true", "True", "1", "yes")
          overrides = None
          if auto_implement:
              # The server-side plan_auto_implement action posts the plan
              # comment and dispatches the implementation agent as a separate,
              # confirmation-gated interaction. It never re-enters the comment
              # REPL (no implement marker), so the coding agent cannot start
              # implicitly; the owner approves the posted badge first.
              post_action = {
                  "kind": "plan_auto_implement",
                  "repo": os.environ["REPO"],
                  "number": int(os.environ["ISSUE_NUMBER"]),
                  "bot": os.environ.get("OPEN_CHAT_IMPLEMENT_BOT", "issue-repl-bot"),
                  "require_confirmation": require_confirmation,
                  "post_badge": True,
                  "header": (
                      "<!-- open-chat-post-interaction -->\n"
                      "## Plan from `" + os.environ.get("OPEN_CHAT_PLAN_BOT", "issue-plan-bot") + "`"
                  ),
                  "footer": (
                      "*Posted automatically by Open-Chat when the planning interaction finished. "
                      "The implementation agent runs as a separate"
                      + (" confirmation-gated" if require_confirmation else "")
                      + " interaction; approve the posted implementation badge to start it.*"
                  ),
              }
              overrides = {"post_action": post_action}
          interaction = bot.create_interaction(message=message, overrides=overrides, share=True)
          print("Created interaction chat:", interaction.uuid)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"chat_uuid={interaction.uuid}\n")
              share_uuid = getattr(interaction, "_chat_share_uuid", None)
              if share_uuid:
                  out.write(f"chat_share_uuid={share_uuid}\n")
                  out.write(f"shared_url={interaction.shared_url()}\n")
          PY

      - name: Post reference badge comment on the issue
        if: steps.interaction.outputs.chat_uuid != ''
        env:
          COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          SHARED_URL: ${{ steps.interaction.outputs.shared_url }}
          CHAT_UUID: ${{ steps.interaction.outputs.chat_uuid }}
          SHARE_UUID: ${{ steps.interaction.outputs.chat_share_uuid }}
          OPEN_CHAT_HOST: ${{ env.OPEN_CHAT_HOST }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          INTERACTION_URL="${SHARED_URL:-${OPEN_CHAT_HOST}/interaction/${CHAT_UUID}}"
          SHARE_OR_CHAT_UUID="${SHARE_UUID:-${CHAT_UUID}}"
          BADGE_URL="${OPEN_CHAT_HOST%/}/api/interaction/${SHARE_OR_CHAT_UUID}/badge.svg"
          COMMENT_BODY="$(printf '%s\n' \
            "<!-- open-chat-issue-plan -->" \
            "[![open-chat planning session](%s)](%s)" \
            "*Plan agent started for this issue assignment; click the badge above to watch live progress on the Open-Chat server. When the agent finishes Open-Chat posts the plan as an issue comment and dispatches the implementation agent as a separate, confirmation-gated interaction; approve the implementation badge that follows to start it.*")"
          COMMENT_BODY="$(printf "$COMMENT_BODY" "$BADGE_URL" "$INTERACTION_URL")"
          payload="$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${COMMENT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$payload"
