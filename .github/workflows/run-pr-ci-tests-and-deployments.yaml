name: Run PR CI Tests and Deployments

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: Deployment name used by the CI deploy workflow
        required: false
        type: choice
        options:
          - msgmate-io-staging
          - msgmate-io-ci
          - msgmate-io-pr-deployment
          - msgmate-io-production
        default: msgmate-io-staging
      target_ref:
        description: Target ref or SHA to deploy (pick a common ref, or 'custom' to type one below)
        required: false
        type: choice
        options:
          - main
          - production
          - custom
        default: main
      target_ref_custom:
        description: Custom ref or SHA (used only when target_ref is 'custom')
        required: false
        default: ""
      ci_repository:
        description: CI repository that contains the deploy workflow
        required: false
        default: msgmate-io/open-chat-go-ci
      BOT_USER:
        description: GitHub username that owns the bot comments
        required: false
        default: cur1ousdude
      callback_action:
        description: Optional callback mode for post-release comment updates
        required: false
        default: ""
      source_repository:
        description: Source repository for callback operations
        required: false
        default: msgmate-io/open-chat-go
      source_pr_number:
        description: Source PR number for callback operations
        required: false
        default: ""
      release_tag:
        description: Release tag emitted by build workflow
        required: false
        default: ""
      release_version:
        description: Release version emitted by build workflow
        required: false
        default: ""
      client_repository:
        description: Python client repository used in install instructions
        required: false
        default: msgmate-io/open-chat-go-python-client
      binary_name:
        description: Binary asset filename used in install instructions
        required: false
        default: ""
      deploy_url:
        description: Deployment URL for release comment links
        required: false
        default: ""
      DRY_RUN:
        description: ci#734 - dry-run the CI-failure relay (no comment, no lead message)
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      pr_number:
        description: ci#734 - PR number used by the relay dry-run
        required: false
        default: ""
      pr_branch:
        description: ci#734 - PR head branch used by the relay dry-run (chore/consolidate-*)
        required: false
        default: ""
      pr_sha:
        description: ci#734 - PR head SHA used by the relay dry-run
        required: false
        default: ""
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - closed

concurrency:
  # Key pull-request runs by PR number *and* head SHA. A run that is parked
  # waiting on a protected deployment environment is not cancelled by
  # `cancel-in-progress` (GitHub does not cancel environment-gated runs), so a
  # plain `pr-ci-<number>` group lets one stale, unapproved run block every
  # later run for the same PR. Scoping to the head SHA lets a fresh push start
  # immediately; the per-environment `pr-deploy-<number>` job concurrency still
  # serialises/cancels the actual deploys.
  #
  # The same reasoning applies to the post-merge flow: a stalled merged-deploy
  # run guarded by a protected environment cannot be cancelled with
  # `cancel-in-progress`, so keying merged runs only by `base.ref` let one stale
  # merge block every later merge (`merged-deploy-main` starvation). Keying them
  # by the merge commit lets a fresh merge start immediately;
  # `cancel-superseded-merged-deployment` then cancels the stale run and the
  # per-environment dispatch job concurrency serialises the actual deploys.
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('manual-deploy-{0}', github.run_id)
        || github.event.action == 'closed'
        && format('merged-deploy-{0}-{1}', github.event.pull_request.base.ref, github.event.pull_request.merge_commit_sha)
        || format('pr-ci-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  packages: write

env:
  CI_REPOSITORY_DEFAULT: msgmate-io/open-chat-go-ci
  CI_REF: ${{ vars.CI_REF || 'main' }}
  BOT_USER: ${{ github.event.inputs.BOT_USER || 'cur1ousdude' }}
  DEPLOYMENT_PR: msgmate-io-pr-deployment
  DEPLOYMENT_STAGING: msgmate-io-staging
  DEPLOYMENT_CI: msgmate-io-ci
  DEPLOYMENT_PRODUCTION: msgmate-io-production
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TPL_STEP_ANDROID_RELEASE: '- [ ] ~~`(6) android release` `skipped`~~'

jobs:
  update-pr-comment-after-release:
    name: Update PR Comment After Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.callback_action == 'release_comment' && github.event.inputs.source_pr_number != ''
    env:
      COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      BOT_USER: ${{ github.event.inputs.BOT_USER || 'cur1ousdude' }}
    steps:
      - name: Checkout source repository for templates
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Update PR progress comment with release details
        run: |
          set -euo pipefail
          SOURCE_REPOSITORY="${{ github.event.inputs.source_repository || github.repository }}"
          SOURCE_PR_NUMBER="${{ github.event.inputs.source_pr_number }}"
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          CLIENT_REPOSITORY="${{ github.event.inputs.client_repository || 'msgmate-io/open-chat-go-python-client' }}"
          BINARY_NAME="${{ github.event.inputs.binary_name }}"

          if [ -z "$BINARY_NAME" ] && [ -n "$RELEASE_VERSION" ]; then
            BINARY_NAME="open-chat-${RELEASE_VERSION}-linux-amd64"
          fi

          TPL_RUN_URL="${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}"
          TPL_RELEASE_TAG="$RELEASE_TAG"
          TPL_CLIENT_REPOSITORY="$CLIENT_REPOSITORY"
          TPL_SOURCE_REPOSITORY="$SOURCE_REPOSITORY"
          TPL_BINARY_NAME="$BINARY_NAME"
          DEPLOY_URL="${{ github.event.inputs.deploy_url || '' }}"
          comments_json="$({
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/${SOURCE_PR_NUMBER}/comments"
          })"
          comment_id="$(jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].id // ""' <<< "$comments_json")"
          if [ -z "$comment_id" ]; then
            echo "::error::Could not find existing progress comment to update."
            exit 1
          fi
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="$(jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].body // ""' <<< "$comments_json" | sed -n 's/.*`(3) deploy` \[`url=[^`]*`\](\(https:[^)]*\)).*/\1/p')"
          fi
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::deploy_url is required to generate the dynamic Go tests docs link."
            exit 1
          fi
          TPL_DEPLOY_STEP="- [x] \`(3) deploy\` [\`url=${DEPLOY_URL}\`](${DEPLOY_URL})"
          existing_step_test="$(jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].body // "" | split("\n") | map(select(startswith("- [") and contains("`(4) test`"))) | .[0] // ""' <<< "$comments_json")"
          if [ -n "$existing_step_test" ]; then
            TPL_STEP_TEST="$existing_step_test"
          else
            TPL_STEP_TEST="- [x] \`(4) test\` \`passed\`"
          fi

          existing_step_build="$(jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].body // "" | split("\n") | map(select(startswith("- [") and contains("`(2) build`"))) | .[0] // ""' <<< "$comments_json")"
          if [ -n "$existing_step_build" ]; then
            TPL_STEP_BUILD="$existing_step_build"
          else
            TPL_STEP_BUILD='- [x] `(2) build`'
          fi

          existing_step_android_release="$(jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].body // "" | split("\n") | map(select(startswith("- [") and contains("`(6) android release`"))) | .[0] // ""' <<< "$comments_json")"
          if [ -n "$existing_step_android_release" ]; then
            TPL_STEP_ANDROID_RELEASE="$existing_step_android_release"
          else
            TPL_STEP_ANDROID_RELEASE='- [ ] ~~`(6) android release` `skipped`~~'
          fi

          export TPL_RUN_URL TPL_RELEASE_TAG TPL_CLIENT_REPOSITORY TPL_SOURCE_REPOSITORY TPL_BINARY_NAME TPL_DEPLOY_STEP TPL_STEP_TEST TPL_STEP_BUILD TPL_STEP_ANDROID_RELEASE
          body="$(python3 development/scripts/render_comment_template.py development/ci/bot_message_templates/007-release-complete.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${COMMENT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/comments/${comment_id}" \
            -d "$payload" >/dev/null

  no_labels_guidance:
    name: Label Guidance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(github.event.pull_request.labels.*.name, 'deploy') && !contains(github.event.pull_request.labels.*.name, 'test') && !contains(github.event.pull_request.labels.*.name, 'build') && !contains(github.event.pull_request.labels.*.name, 'ai-test-mock') && !contains(github.event.pull_request.labels.*.name, 'ai-test-real') && !contains(github.event.pull_request.labels.*.name, 'test-core-only') && !contains(github.event.pull_request.labels.*.name, 'release-android') && !contains(github.event.pull_request.labels.*.name, 'test-e2e') && !contains(github.event.pull_request.labels.*.name, 'e2e') && !contains(github.event.pull_request.labels.*.name, 'sandbox-test') && !contains(join(github.event.pull_request.labels.*.name, ','), 'sandbox-test') && !contains(github.event.pull_request.labels.*.name, 'slow-android-build-test')
    steps:
      - name: Checkout source repository for templates
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Delete previous workflow comments
        env:
          COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          BOT_USER: ${{ env.BOT_USER }}
        run: |
          set -euo pipefail
          comments="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '.[] | select(.user.login == $bot_user) | select((.body | contains("<!-- open-chat-pr-ci-progress -->")) or (.body | contains("<!-- open-chat-pr-ci-no-label-guidance -->")) or (.body | contains("<!-- open-chat-ci-deploy-comment -->"))) | .id'
          )"
          for comment in $comments; do
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment}"
          done

      - name: Post no-label guidance comment
        env:
          COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          BOT_USER: ${{ env.BOT_USER }}
        run: |
          set -euo pipefail
          body="$(cat development/ci/bot_message_templates/001-no-label-guidance.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          comment_id="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-no-label-guidance -->")))][0].id // ""'
          )"
          if [ -n "$comment_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -d "$payload"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d "$payload"
          fi

      - name: Add default test label
        env:
          LABEL_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${LABEL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -d '{"labels":["test"]}'

  run-pr-ci-tests-and-deployments:
    name: Run PR CI Tests and Deployments
    runs-on: ubuntu-latest
    # ci#734: a relay dry-run dispatch must stay lightweight - it only inspects
    # the relay routing and never starts the test/deploy pipeline.
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.callback_action == '' && github.event.inputs.DRY_RUN != 'true') || (github.event_name == 'pull_request' && github.event.action != 'closed' && (contains(github.event.pull_request.labels.*.name, 'deploy') || contains(github.event.pull_request.labels.*.name, 'test') || contains(github.event.pull_request.labels.*.name, 'build') || contains(github.event.pull_request.labels.*.name, 'ai-test-mock') || contains(github.event.pull_request.labels.*.name, 'ai-test-real') || contains(github.event.pull_request.labels.*.name, 'test-core-only') || contains(github.event.pull_request.labels.*.name, 'release-android') || contains(github.event.pull_request.labels.*.name, 'test-e2e') || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'sandbox-test') || contains(join(github.event.pull_request.labels.*.name, ','), 'sandbox-test') || contains(github.event.pull_request.labels.*.name, 'slow-android-build-test')))
    outputs:
      ci_repository: ${{ steps.context.outputs.ci_repository }}
      deployment_name: ${{ steps.context.outputs.deployment_name }}
      # GitHub environment that gates the deploy/post-deploy suites. Same-repo
      # PRs targeting `main` use the unprotected `msgmate-io-ci` environment (no
      # admin confirmation); every other PR keeps the protected
      # `msgmate-io-pr-deployment` environment. See DEVELOPMENT.md
      # "Pull-request CI labels and deployment policy".
      approval_environment: ${{ steps.context.outputs.approval_environment }}
      target_ref: ${{ steps.context.outputs.target_ref }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      source_repository: ${{ steps.context.outputs.source_repository }}
      pr_deploy_host: ${{ steps.context.outputs.pr_deploy_host }}
      pr_deploy_url: ${{ steps.context.outputs.pr_deploy_url }}
      pr_namespace: ${{ steps.context.outputs.pr_namespace }}
      pr_helm_release: ${{ steps.context.outputs.pr_helm_release }}
      should_deploy: ${{ steps.context.outputs.should_deploy }}
      should_test: ${{ steps.context.outputs.should_test }}
      should_e2e_test: ${{ steps.context.outputs.should_e2e_test }}
      should_sandbox_test: ${{ steps.context.outputs.should_sandbox_test }}
      should_sandbox_tags: ${{ steps.context.outputs.should_sandbox_tags }}
      should_build: ${{ steps.context.outputs.should_build }}
      should_release_android: ${{ steps.context.outputs.should_release_android }}
      should_ai_test_mock: ${{ steps.context.outputs.should_ai_test_mock }}
      should_ai_test_real: ${{ steps.context.outputs.should_ai_test_real }}
      should_test_core_only: ${{ steps.context.outputs.should_test_core_only }}
      image_url: ${{ steps.image.outputs.image_url }}
      android_release_run_url: ${{ steps.android_release_dispatch.outputs.android_release_run_url }}
      dispatch_ref: ${{ steps.context.outputs.dispatch_ref }}
      is_same_repo_pr: ${{ steps.context.outputs.is_same_repo_pr }}
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      CI_REPOSITORY_INPUT: ${{ github.event.inputs.ci_repository }}
      DEPLOYMENT_NAME_INPUT: ${{ github.event.inputs.deployment_name }}
      TARGET_REF_INPUT: ${{ github.event.inputs.target_ref }}
      TARGET_REF_CUSTOM_INPUT: ${{ github.event.inputs.target_ref_custom }}
      AI_TEST_API_HOST: ${{ secrets.AI_TEST_API_HOST }}
      AI_TEST_API_KEY: ${{ secrets.AI_TEST_API_KEY }}
    steps:
      - name: Cancel superseded workflow runs for this PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          CANCEL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer ${CANCEL_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-pr-ci-tests-and-deployments.yaml/runs?status=${status}&per_page=30")"
            jq -r --arg current "$CURRENT_RUN_ID" --arg head_ref "$PR_HEAD_REF" \
              '.workflow_runs[]
              | select(.id != ($current | tonumber))
              | select(.head_branch == $head_ref)
              | .id' <<< "$runs_json" | while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Cancelling superseded workflow run ${run_id} (${status})."
                curl -fsSL -X POST \
                  -H "Authorization: Bearer ${CANCEL_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/cancel" \
                  >/dev/null || true
              fi
            done
          done

      # ci#659: the labels must be read from the API, not from
      # `$GITHUB_EVENT_PATH`. `gh pr create -l ...` (and any burst of label
      # edits) applies the labels in a second API call, so the `opened` event
      # payload carries an EMPTY label set; a label-driven decision made from
      # that snapshot is wrong for exactly the PRs the checks exist to gate.
      - name: Resolve the pull request's live labels
        id: live_labels
        env:
          LABEL_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Not a pull request event; no labels to resolve."
            : > "${RUNNER_TEMP}/pr-labels.txt"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${LABEL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels?per_page=100" \
            | jq -r '.[].name' > "${RUNNER_TEMP}/pr-labels.txt"
          echo "Live PR labels: $(tr '\n' ' ' < "${RUNNER_TEMP}/pr-labels.txt")"

      - name: Resolve context and label actions
        id: context
        run: |
          set -euo pipefail
          CI_REPOSITORY="${CI_REPOSITORY_INPUT:-$CI_REPOSITORY_DEFAULT}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_REF="${{ github.event.pull_request.head.sha }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            SOURCE_REPOSITORY="${{ github.repository }}"
            DEPLOYMENT_NAME="${{ env.DEPLOYMENT_PR }}"
            SHOULD_DEPLOY="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'deploy' || true)"
            SHOULD_TEST="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'test' || true)"
            # E2E has several accepted label aliases (e2e/test-e2e/test); when
            # more than one alias label is present the grep would return
            # multiple lines and a multi-line GITHUB_OUTPUT value breaks the
            # job ("Invalid format"). Keep alias support, emit one token only.
            SHOULD_E2E_TEST="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -E -x '(e2e|test-e2e|test)' | head -n1 || true)"
            # Sandbox suite trigger: plain `sandbox-test` runs all tests, while
            # `sandbox-test:<tag>` labels run only tests carrying that tag
            # (multiple labels are unioned). Any matching label triggers the
            # suite.
            SHOULD_SANDBOX_TEST="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -E -x 'sandbox-test(:.*)?' | head -n1 || true)"
            SHOULD_SANDBOX_TAGS="$(cat "${RUNNER_TEMP}/pr-labels.txt" \
              | sed -n 's/^sandbox-test://p' \
              | tr '\n' ',' | sed 's/,\+/,/g; s/^,//; s/,$//' || true)"
            # A plain `sandbox-test` label means "run the whole suite"; it must
            # win over any `sandbox-test:<tag>` selectors so adding the tag
            # labels alongside it never narrows the public run to zero tests.
            if cat "${RUNNER_TEMP}/pr-labels.txt" | grep -qx 'sandbox-test'; then
              SHOULD_SANDBOX_TAGS=""
            fi
            SHOULD_BUILD="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'build' || true)"
            SHOULD_RELEASE_ANDROID="$(grep -i -x 'release-android' "${RUNNER_TEMP}/pr-labels.txt" \
              | head -n1 | tr '[:upper:]' '[:lower:]' || true)"
            SHOULD_AI_TEST_MOCK="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'ai-test-mock' || true)"
            SHOULD_AI_TEST_REAL="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'ai-test-real' || true)"
            SHOULD_TEST_CORE_ONLY="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'test-core-only' || true)"
            # Production promotion PRs (base.ref == 'production') always run the
            # full suite. Their labels are added in one burst right after the PR
            # is opened, so each per-label event payload carries only a partial
            # label snapshot - deriving the flags from the event payload races
            # with cancel-in-progress and can skip every suite (all-suite gate
            # then fails). The flags below are authoritative instead; the
            # promotion PR must never deploy (production deploy happens after
            # this PR merges via the merged-deployment flow).
            if [ "${{ github.event.pull_request.base.ref }}" = "production" ]; then
              echo "Production promotion PR: forcing full test suite, deploy disabled."
              SHOULD_DEPLOY=""
              SHOULD_TEST="test"
              SHOULD_E2E_TEST="e2e"
              SHOULD_SANDBOX_TEST="sandbox-test"
              SHOULD_SANDBOX_TAGS=""
              SHOULD_BUILD="build"
              SHOULD_RELEASE_ANDROID="release-android"
              SHOULD_AI_TEST_MOCK="ai-test-mock"
              SHOULD_AI_TEST_REAL="ai-test-real"
              SHOULD_TEST_CORE_ONLY="test-core-only"
            fi
            RAW_PR_NAME="$(jq -r '.pull_request.head.ref // .pull_request.title // "pr"' "$GITHUB_EVENT_PATH")"
            DISPATCH_REF="${{ github.event.pull_request.head.ref }}"
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              IS_SAME_REPO_PR="true"
            else
              IS_SAME_REPO_PR="false"
            fi
          else
            DEPLOYMENT_NAME="${DEPLOYMENT_NAME_INPUT:-${{ env.DEPLOYMENT_STAGING }}}"
            if [ "${TARGET_REF_INPUT:-main}" = "custom" ]; then
              TARGET_REF="${TARGET_REF_CUSTOM_INPUT:-main}"
            else
              TARGET_REF="${TARGET_REF_INPUT:-main}"
            fi
            PR_NUMBER=""
            SOURCE_REPOSITORY="${{ github.repository }}"
            SHOULD_DEPLOY="deploy"
            SHOULD_TEST=""
            SHOULD_E2E_TEST=""
            SHOULD_SANDBOX_TEST=""
            SHOULD_SANDBOX_TAGS=""
            SHOULD_BUILD=""
            SHOULD_RELEASE_ANDROID=""
            SHOULD_AI_TEST_MOCK=""
            SHOULD_AI_TEST_REAL=""
            SHOULD_TEST_CORE_ONLY=""
            RAW_PR_NAME="$DEPLOYMENT_NAME"
            DISPATCH_REF="$TARGET_REF"
            IS_SAME_REPO_PR="true"
          fi
          PR_SLUG="$(printf '%s' "$RAW_PR_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9.-]/-/g' \
            | sed 's/-\+/-/g; s/\.\+/./g' \
            | sed 's/^[.-]\+//; s/[.-]\+$//')"
          if [ -z "$PR_SLUG" ]; then
            PR_SLUG="pr"
          fi
          if ! printf '%s' "$PR_SLUG" | grep -q '^[a-z0-9]'; then
            PR_SLUG="p${PR_SLUG}"
          fi
          if ! printf '%s' "$PR_SLUG" | grep -q '[a-z0-9]$'; then
            PR_SLUG="${PR_SLUG}p"
          fi
          if [ -n "$PR_NUMBER" ]; then
            UNIQUE_SUFFIX="pr-${PR_NUMBER}"
            MAX_SLUG_LENGTH=$((63 - ${#UNIQUE_SUFFIX} - 1))
            if [ "$MAX_SLUG_LENGTH" -lt 1 ]; then
              MAX_SLUG_LENGTH=1
            fi
            PR_SLUG="$(printf '%s' "$PR_SLUG" | cut -c1-"$MAX_SLUG_LENGTH" | sed 's/[.-]\+$//')"
            if [ -z "$PR_SLUG" ]; then
              PR_SLUG="pr"
            fi
            PR_DEPLOY_HOST="${PR_SLUG}-${UNIQUE_SUFFIX}.pr-env.msgmate.io"
            PR_NAMESPACE="open-chat-pr-${PR_NUMBER}"
            PR_HELM_RELEASE="backend-pr-${PR_NUMBER}"
          else
            PR_DEPLOY_HOST=""
            PR_NAMESPACE=""
            PR_HELM_RELEASE=""
          fi
          # Approval gate environment. A same-repo PR targeting `main` is the
          # consolidation / CI-environment case and uses the unprotected
          # `msgmate-io-ci` environment, so the full suite (including the
          # post-deploy sandbox and real-AI suites) runs without an admin
          # confirmation. Every other PR keeps the protected
          # `msgmate-io-pr-deployment` environment. See DEVELOPMENT.md
          # "Pull-request CI labels and deployment policy".
          APPROVAL_ENVIRONMENT="$DEPLOYMENT_NAME"
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.event.pull_request.base.ref }}" = "main" ] \
            && [ "$IS_SAME_REPO_PR" = "true" ]; then
            APPROVAL_ENVIRONMENT="${{ env.DEPLOYMENT_CI }}"
          fi
          echo "ci_repository=$CI_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "deployment_name=$DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "approval_environment=$APPROVAL_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "source_repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "pr_deploy_host=$PR_DEPLOY_HOST" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_DEPLOY_HOST" ]; then
            echo "pr_deploy_url=https://$PR_DEPLOY_HOST" >> "$GITHUB_OUTPUT"
          else
            echo "pr_deploy_url=" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_namespace=$PR_NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "pr_helm_release=$PR_HELM_RELEASE" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "should_test=$SHOULD_TEST" >> "$GITHUB_OUTPUT"
          echo "should_e2e_test=$SHOULD_E2E_TEST" >> "$GITHUB_OUTPUT"
          echo "should_sandbox_test=$SHOULD_SANDBOX_TEST" >> "$GITHUB_OUTPUT"
          echo "should_sandbox_tags=$SHOULD_SANDBOX_TAGS" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "should_release_android=$SHOULD_RELEASE_ANDROID" >> "$GITHUB_OUTPUT"
          echo "should_ai_test_mock=$SHOULD_AI_TEST_MOCK" >> "$GITHUB_OUTPUT"
          echo "should_ai_test_real=$SHOULD_AI_TEST_REAL" >> "$GITHUB_OUTPUT"
          echo "should_test_core_only=$SHOULD_TEST_CORE_ONLY" >> "$GITHUB_OUTPUT"
          echo "dispatch_ref=$DISPATCH_REF" >> "$GITHUB_OUTPUT"
          echo "is_same_repo_pr=$IS_SAME_REPO_PR" >> "$GITHUB_OUTPUT"
          echo "Detected labels: deploy=${SHOULD_DEPLOY:-false} test=${SHOULD_TEST:-false} e2e=${SHOULD_E2E_TEST:-false} sandbox=${SHOULD_SANDBOX_TEST:-false} sandbox-tags=${SHOULD_SANDBOX_TAGS:-<all>} build=${SHOULD_BUILD:-false} release-android=${SHOULD_RELEASE_ANDROID:-false} ai-test-mock=${SHOULD_AI_TEST_MOCK:-false} ai-test-real=${SHOULD_AI_TEST_REAL:-false} test-core-only=${SHOULD_TEST_CORE_ONLY:-false}"

      # The `release-android` label builds the APK from `open-chat-go-mobile@main`
      # (see the `ref`/`commit_ref` inputs below) against this PR's target ref as
      # `backend_ref`. It therefore only reflects fixes already merged to the
      # mobile `main` branch; cross-repo dispatch is skipped for fork PRs.
      #
      # Issue #52: the obsolete "verify required integration submodules" failure
      # was fixed by open-chat-go-mobile#3 (merge 5e3e33d). The remaining `full`
      # profile failure was runner disk exhaustion during the gomobile bind
      # ("no space left on device"), fixed by the disk reclamation in
      # open-chat-go-mobile#5/#6. Those fixes are on mobile `main`.
      #
      # The `full` profile now also declares `stats_and_usage` (merged in
      # open-chat-go-ci#54), so the matching local `replace` in
      # `clients/gomobile/go.mod` is required again: open-chat-go-mobile#4 added
      # it, #7 reverted it while the integration was still manifest-only, and the
      # re-land PR (open-chat-go-mobile#8, merged to main) restores it. Verified
      # with the Android sandbox image (`android_build passed
      # aar,apk,unit-tests`); the release now completes and publishes both APKs.
      - name: Dispatch Android release workflow in open-chat-go-mobile
        id: android_release_dispatch
        if: steps.context.outputs.should_release_android != '' && steps.context.outputs.is_same_repo_pr == 'true'
        env:
          MOBILE_RELEASE_REPO: msgmate-io/open-chat-go-mobile
          MOBILE_RELEASE_WORKFLOW: release-apk.yml
        run: |
          set -euo pipefail
          payload="$({
            jq -n \
              --arg ref "main" \
              --arg commitRef "main" \
              --arg backendRef "${{ steps.context.outputs.target_ref }}" \
              '{
                ref: $ref,
                inputs: {
                  commit_ref: $commitRef,
                  backend_ref: $backendRef
                }
              }'
          })"

          status_code="$(curl -s -o /tmp/android_release_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${MOBILE_RELEASE_REPO}/actions/workflows/${MOBILE_RELEASE_WORKFLOW}/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch Android release workflow (status $status_code)."
            cat /tmp/android_release_dispatch.json || true
            exit 1
          fi

          run_url="https://github.com/${MOBILE_RELEASE_REPO}/actions/workflows/${MOBILE_RELEASE_WORKFLOW}"

          echo "android_release_run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Dispatched Android release workflow: $run_url"

      - name: Skip Android release dispatch for fork PRs
        if: steps.context.outputs.should_release_android != '' && steps.context.outputs.is_same_repo_pr != 'true'
        run: |
          set -euo pipefail
          echo "release-android label present, but this is a fork PR and cross-repo dispatch is skipped."

      - name: Checkout source repository (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Delete previous workflow comments
        if: github.event_name == 'pull_request'
        env:
          COMMENT_TOKEN: ${{ env.COMMENT_TOKEN }}
          BOT_USER: ${{ env.BOT_USER }}
        run: |
          set -euo pipefail
          comments="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '.[] | select(.user.login == $bot_user) | select((.body | contains("<!-- open-chat-pr-ci-progress -->")) or (.body | contains("<!-- open-chat-pr-ci-no-label-guidance -->")) or (.body | contains("<!-- open-chat-ci-deploy-comment -->"))) | .id'
          )"
          for comment in $comments; do
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment}"
          done

      - name: Create initial progress comment
        if: github.event_name == 'pull_request'
        env:
          COMMENT_TOKEN: ${{ env.COMMENT_TOKEN }}
          BOT_USER: ${{ env.BOT_USER }}
        run: |
          set -euo pipefail
          TPL_RUN_URL="${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}"
          TPL_STEP_BUILD='${{ steps.context.outputs.should_deploy != '' && '- [ ] `(2) build` `running`' || '- [ ] ~~`(2) build` `skipped`~~' }}'
          TPL_STEP_DEPLOY='${{ steps.context.outputs.should_deploy != '' && format('- [ ] `(3) deploy` [`url={0}`]({0}) [`approve here`]({1})', steps.context.outputs.pr_deploy_url, format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id)) || '- [ ] ~~`(3) deploy` `skipped`~~' }}'
          TPL_STEP_TEST='${{ (steps.context.outputs.should_test != '' || steps.context.outputs.should_ai_test_mock != '' || steps.context.outputs.should_ai_test_real != '' || steps.context.outputs.should_e2e_test != '') && format('- [ ] `(4) test` `go={3}` `ai-mock={4}` `ai-real={5}`', steps.context.outputs.pr_deploy_url, github.run_id, steps.context.outputs.pr_number, steps.context.outputs.should_test != '' && 'running' || 'skipped', steps.context.outputs.should_ai_test_mock != '' && 'running' || 'skipped', steps.context.outputs.should_ai_test_real != '' && 'running' || 'skipped') || '- [ ] ~~`(4) test` `skipped`~~' }}'
          TPL_STEP_RELEASE_BUILD='${{ steps.context.outputs.should_build != '' && '- [ ] `(5) release build`' || '- [ ] ~~`(5) release build` `skipped`~~' }}'
          TPL_STEP_ANDROID_RELEASE='${{ steps.context.outputs.should_release_android != '' && '- [ ] `(6) android release` `queued`' || '- [ ] ~~`(6) android release` `skipped`~~' }}'
          export TPL_RUN_URL TPL_STEP_BUILD TPL_STEP_DEPLOY TPL_STEP_TEST TPL_STEP_RELEASE_BUILD TPL_STEP_ANDROID_RELEASE
          body="$(python3 development/scripts/render_comment_template.py development/ci/bot_message_templates/002-progress-initial.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          comment_id="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].id // ""'
          )"
          if [ -n "$comment_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -d "$payload"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              -d "$payload"
          fi

      - name: Resolve build image metadata
        if: steps.context.outputs.should_deploy != '' || steps.context.outputs.should_ai_test_mock != '' || steps.context.outputs.should_ai_test_real != '' || steps.context.outputs.should_e2e_test != '' || steps.context.outputs.should_sandbox_test != ''
        id: image
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${{ steps.context.outputs.pr_number }}" ]; then
            IMAGE_TAG="pr-${{ steps.context.outputs.pr_number }}-${SHORT_SHA}"
          else
            IMAGE_TAG="${{ steps.context.outputs.deployment_name }}-${SHORT_SHA}"
          fi
          IMAGE_URL="ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Tests run in parallel job
        run: echo "Go, mocked-AI and E2E suites run as separate parallel jobs."

      - name: Update progress comment after build
        if: github.event_name == 'pull_request'
        env:
          COMMENT_TOKEN: ${{ env.COMMENT_TOKEN }}
          BOT_USER: ${{ env.BOT_USER }}
        run: |
          set -euo pipefail
          TPL_RUN_URL="${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}"
          TPL_STEP_BUILD='${{ steps.context.outputs.should_deploy != '' && format('- [x] `(2) build` `image={0}`', steps.image.outputs.image_url) || '- [ ] ~~`(2) build` `skipped`~~' }}'
          TPL_STEP_DEPLOY='${{ steps.context.outputs.should_deploy != '' && format('- [ ] `(3) deploy` [`url={0}`]({0}) [`approve here`]({1})', steps.context.outputs.pr_deploy_url, format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id)) || '- [ ] ~~`(3) deploy` `skipped`~~' }}'
          TPL_STEP_TEST='${{ (steps.context.outputs.should_test != '' || steps.context.outputs.should_ai_test_mock != '' || steps.context.outputs.should_ai_test_real != '' || steps.context.outputs.should_e2e_test != '') && format('- [ ] `(4) test` `go={3}` `ai-mock={4}` `ai-real={5}`', steps.context.outputs.pr_deploy_url, github.run_id, steps.context.outputs.pr_number, steps.context.outputs.should_test != '' && 'running' || 'skipped', steps.context.outputs.should_ai_test_mock != '' && 'running' || 'skipped', steps.context.outputs.should_ai_test_real != '' && 'running' || 'skipped') || '- [ ] ~~`(4) test` `skipped`~~' }}'
          TPL_STEP_RELEASE_BUILD='${{ steps.context.outputs.should_build != '' && '- [ ] `(5) release build`' || '- [ ] ~~`(5) release build` `skipped`~~' }}'
          TPL_STEP_ANDROID_RELEASE='${{ steps.context.outputs.should_release_android != '' && '- [ ] `(6) android release` `queued`' || '- [ ] ~~`(6) android release` `skipped`~~' }}'
          export TPL_RUN_URL TPL_STEP_BUILD TPL_STEP_DEPLOY TPL_STEP_TEST TPL_STEP_RELEASE_BUILD TPL_STEP_ANDROID_RELEASE
          body="$(python3 development/scripts/render_comment_template.py development/ci/bot_message_templates/003-progress-after-build.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          comment_id="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].id // ""'
          )"
          if [ -n "$comment_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -d "$payload"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              -d "$payload"
          fi

      - name: Skip deploy dispatch when deploy label is missing
        if: steps.context.outputs.should_deploy == ''
        run: echo "Deploy label not present; skipping deploy dispatch."

      - name: Update progress comment after dispatch
        if: github.event_name == 'pull_request'
        env:
          COMMENT_TOKEN: ${{ env.COMMENT_TOKEN }}
          BOT_USER: ${{ env.BOT_USER }}
        run: |
          set -euo pipefail
          TPL_RUN_URL="${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}"
          TPL_STEP_BUILD='${{ steps.context.outputs.should_deploy != '' && format('- [x] `(2) build` `image={0}`', steps.image.outputs.image_url) || '- [ ] ~~`(2) build` `skipped`~~' }}'
          TPL_STEP_DEPLOY='${{ steps.context.outputs.should_deploy != '' && format('- [ ] `(3) deploy` [`url={0}`]({0}) [`approve here`]({1})', steps.context.outputs.pr_deploy_url, format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id)) || '- [ ] ~~`(3) deploy` `skipped`~~' }}'
          TPL_STEP_TEST='${{ (steps.context.outputs.should_test != '' || steps.context.outputs.should_ai_test_mock != '' || steps.context.outputs.should_ai_test_real != '' || steps.context.outputs.should_e2e_test != '') && format('- [ ] `(4) test` `go={3}` `ai-mock={4}` `ai-real={5}`', steps.context.outputs.pr_deploy_url, github.run_id, steps.context.outputs.pr_number, steps.context.outputs.should_test != '' && 'running' || 'skipped', steps.context.outputs.should_ai_test_mock != '' && 'running' || 'skipped', steps.context.outputs.should_ai_test_real != '' && 'running' || 'skipped') || '- [ ] ~~`(4) test` `skipped`~~' }}'
          TPL_STEP_RELEASE_BUILD='${{ steps.context.outputs.should_build != '' && '- [ ] `(5) release build`' || '- [ ] ~~`(5) release build` `skipped`~~' }}'
          TPL_STEP_ANDROID_RELEASE='${{ steps.context.outputs.should_release_android != '' && format('- [x] `(6) android release` [`dispatched`]({0})', steps.android_release_dispatch.outputs.android_release_run_url) || '- [ ] ~~`(6) android release` `skipped`~~' }}'
          export TPL_RUN_URL TPL_STEP_BUILD TPL_STEP_DEPLOY TPL_STEP_TEST TPL_STEP_RELEASE_BUILD TPL_STEP_ANDROID_RELEASE
          body="$(python3 development/scripts/render_comment_template.py development/ci/bot_message_templates/004-progress-after-dispatch.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          comment_id="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].id // ""'
          )"
          if [ -n "$comment_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -d "$payload"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.context.outputs.pr_number }}/comments" \
              -d "$payload"
          fi

  build-backend-image-once:
    name: Build Backend Image Once
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      (needs.run-pr-ci-tests-and-deployments.outputs.should_deploy != '' ||
       needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_mock != '' ||
       needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_real != '' ||
       needs.run-pr-ci-tests-and-deployments.outputs.should_e2e_test != '' ||
       needs.run-pr-ci-tests-and-deployments.outputs.should_sandbox_test != '')
    outputs:
      image_url: ${{ steps.image.outputs.image_url }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      # Per-integration checkout cache. `sync --frozen` re-validates the pinned
      # commits and only clones what is missing, so restoring the checkouts turns
      # the ~49s clone of ~29 repos into a few seconds.
      #
      # Security note (CodeQL actions/cache-poisoning/direct-cache): this workflow
      # is also triggered by workflow_dispatch, which runs in the default-branch
      # cache scope while checking out untrusted PR code. Caching a path *inside*
      # the checkout would let that code write to (and poison) the default-branch
      # cache, so the cached copy is kept in $RUNNER_TEMP - outside
      # GITHUB_WORKSPACE - and copied in/out around the materialization step.
      - name: Cache integration checkouts
        id: integrations-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openchat-integrations
          key: integrations-staged-${{ runner.os }}-${{ hashFiles('integrations.lock.json', 'profile_setup.yaml') }}
          restore-keys: |
            integrations-staged-${{ runner.os }}-

      - name: Seed integration checkouts from cache
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/openchat-integrations"
          if [ ! -d "$CACHE_DIR" ]; then
            echo "No cached integration checkouts; sync will clone them."
            exit 0
          fi
          mkdir -p clients/integrations .integrations
          if [ -d "$CACHE_DIR/clients/integrations" ]; then
            cp -a "$CACHE_DIR/clients/integrations/." clients/integrations/
          fi
          if [ -d "$CACHE_DIR/.integrations" ]; then
            cp -a "$CACHE_DIR/.integrations/." .integrations/
          fi

      - name: Materialize full integrations
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          BUILD_TOOLS="$(bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          "$BUILD_TOOLS" sync --frozen --profile full

      - name: Stage integration checkouts for the cache
        if: always() && steps.integrations-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TEMP/openchat-integrations"
          mkdir -p "$CACHE_DIR/clients/integrations" "$CACHE_DIR/.integrations"
          if [ -d clients/integrations ]; then
            cp -a clients/integrations/. "$CACHE_DIR/clients/integrations/"
          fi
          if [ -d .integrations ]; then
            cp -a .integrations/. "$CACHE_DIR/.integrations/"
          fi

      - name: Resolve image metadata
        id: image
        run: |
          set -euo pipefail
          IMAGE_URL="${{ needs.run-pr-ci-tests-and-deployments.outputs.image_url }}"
          if [ -z "$IMAGE_URL" ]; then
            echo "::error::image_url output is empty."
            exit 1
          fi
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "cache_ref=ghcr.io/${IMAGE_REPO}:buildcache-full" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Persist the container's Go build cache between runs and inject it into
      # the build through the `gobuildcache` build context (see Dockerfile). The
      # Dockerfile's type=cache mount is intentionally NOT exported by
      # cache-to=type=registry, so this actions/cache directory is the only
      # durable compiler cache for the image build.
      #
      # Security note (CodeQL actions/cache-poisoning/direct-cache): keep the
      # cache outside GITHUB_WORKSPACE. workflow_dispatch runs in the
      # default-branch cache scope while checking out untrusted PR code, so an
      # in-workspace path (e.g. .ci-cache/go-build) would let that code poison the
      # default-branch cache. $RUNNER_TEMP is not under the checkout.
      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/open-chat-go-build-cache
          key: docker-go-build-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'integrations.lock.json') }}-${{ github.sha }}
          restore-keys: |
            docker-go-build-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'integrations.lock.json') }}-
            docker-go-build-${{ runner.os }}-

      - name: Ensure Go build cache directory exists
        run: mkdir -p "$RUNNER_TEMP/open-chat-go-build-cache"

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod-alpine
          push: true
          tags: ${{ steps.image.outputs.image_url }}
          build-args: |
            INTEGRATION_PROFILE=full
          # Bind the restored host-side Go build cache into the builder as the
          # `gobuildcache` named context (the Dockerfile defines an empty scratch
          # stage with the same name as the local-build fallback).
          build-contexts: |
            gobuildcache=${{ runner.temp }}/open-chat-go-build-cache
          # Registry layer cache (mode=max also caches intermediate stages).
          # Measured: adding a second type=gha,mode=max exporter pushed the
          # "Build Backend Image Once" job from ~5m21s to ~6m10s - the GHA cache
          # export alone took ~92s, so the durable GHCR cache is the only
          # backend worth keeping here.
          cache-from: type=registry,ref=${{ steps.image.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache_ref }},mode=max

      - name: Print built image provenance
        run: |
          set -euo pipefail
          echo "Built image: ${{ steps.image.outputs.image_url }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  run-pr-ci-core-only:
    name: Run PR CI Core-Only
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments]
    continue-on-error: true
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_test_core_only != ''
    steps:
      - name: Checkout source repository (public submodules only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN }}
          submodules: true

      - name: Materialize core-only integrations
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          BUILD_TOOLS="$(bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          "$BUILD_TOOLS" sync --frozen --profile core-only

      - name: Resolve core-only image metadata
        id: image
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="pr-${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}-${SHORT_SHA}-core-only"
          IMAGE_URL="ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "cache_ref=ghcr.io/${IMAGE_REPO}:buildcache-core-only" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push core-only backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod-alpine
          push: true
          tags: ${{ steps.image.outputs.image_url }}
          build-args: |
            INTEGRATION_PROFILE=core-only
            # core-only smoke build: no integration frontend pages are linked,
            # so an empty frontend stage is enough.
            FRONTEND_STAGE=frontend_empty
          cache-from: type=registry,ref=${{ steps.image.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cache_ref }},mode=max

      - name: Start backend from core-only image for smoke test
        env:
          BACKEND_IMAGE: ${{ steps.image.outputs.image_url }}
        run: |
          set -euo pipefail
          echo "Using core-only image: ${BACKEND_IMAGE}"
          docker pull "${BACKEND_IMAGE}"

          cat > .ci-test.env <<EOF
          BACKEND_IMAGE=${BACKEND_IMAGE}
          LITELLM_API_HOST=
          LITELLM_API_KEY=
          EOF

          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml up -d redis
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml up -d --no-deps backend

          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1984/ || true)"
            if [ "$code" != "000" ]; then
              echo "Core-only backend is reachable (HTTP $code)."
              exit 0
            fi
            sleep 2
          done

          echo "::error::Timed out waiting for core-only backend on http://127.0.0.1:1984"
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs backend || true
          exit 1

      - name: Stop backend after core-only smoke test
        if: always()
        run: |
          set -euo pipefail
          if [ -f .ci-test.env ]; then
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs backend || true
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml down -v || true
          else
            docker compose -f docker-compose.ci.yaml logs backend || true
            docker compose -f docker-compose.ci.yaml down -v || true
          fi

  run-pr-ci-go-tests:
    name: Run PR CI Go Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Go unit tests run natively and do not consume the backend image, so they
    # must not wait for the (slow) image build. Running them right after the
    # context job lets all shards overlap with build-backend-image-once
    # instead of starting only after it finishes.
    needs: [run-pr-ci-tests-and-deployments]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.callback_action == '') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      (github.event.pull_request.base.ref == 'production' ||
      contains(github.event.pull_request.labels.*.name, 'test'))))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      should_test: ${{ steps.context.outputs.should_test }}
    steps:
      - name: Resolve the pull request's live labels
        id: live_labels
        env:
          LABEL_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Not a pull request event; no labels to resolve."
            : > "${RUNNER_TEMP}/pr-labels.txt"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${LABEL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels?per_page=100" \
            | jq -r '.[].name' > "${RUNNER_TEMP}/pr-labels.txt"
          echo "Live PR labels: $(tr '\n' ' ' < "${RUNNER_TEMP}/pr-labels.txt")"

      - name: Resolve context and label actions
        id: context
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHOULD_TEST="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'test' || true)"
          else
            SHOULD_TEST="test"
          fi
          echo "should_test=$SHOULD_TEST" >> "$GITHUB_OUTPUT"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Set up Go for tests
        if: steps.context.outputs.should_test != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # setup-go only saves its cache while backend/go.sum is unchanged, so its
      # Go build cache is effectively frozen and every run recompiles the whole
      # dependency tree (the dominant cost of this job). Keep an additional
      # per-commit build cache with restore-keys so the cache is refreshed every
      # run and each shard can reuse the compiled packages.
      - name: Restore Go build cache
        if: steps.context.outputs.should_test != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'integrations.lock.json') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'integrations.lock.json') }}-
            go-build-${{ runner.os }}-

      - name: Cache integration checkouts
        if: steps.context.outputs.should_test != ''
        uses: actions/cache@v4
        with:
          path: |
            clients/integrations
            .integrations
          key: integrations-${{ runner.os }}-${{ hashFiles('integrations.lock.json', 'profile_setup.yaml') }}
          restore-keys: |
            integrations-${{ runner.os }}-

      - name: Materialize full integration test module set
        if: steps.context.outputs.should_test != ''
        run: |
          set -euo pipefail
          # Private integration repos require auth for git clone.
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          # This step runs on all four Go-test shards (plus the image build)
          # concurrently, so a transient pip/git/module-proxy hiccup on one
          # runner must not fail that shard before tests even start. Every
          # command below is idempotent, so retry a bounded number of times
          # before surfacing a genuine error (mirrors backend/full_build.sh).
          retry() {
            local attempt=1 max=3 delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::'$*' failed after $max attempts"
                return 1
              fi
              echo "'$*' failed (attempt ${attempt}/${max}); retrying in ${delay}s..." >&2
              attempt=$((attempt + 1))
              sleep "$delay"
            done
          }
          download_modules() { (cd backend && go mod download); }
          BUILD_TOOLS="$(retry bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          retry "$BUILD_TOOLS" sync --frozen --profile full
          retry "$BUILD_TOOLS" resolve --profile full
          echo "GOWORK=${GITHUB_WORKSPACE}/backend/go.work" >> "$GITHUB_ENV"
          TAGS="$(cat backend/.generated/build_tags 2>/dev/null || true)"
          if [ -n "$TAGS" ]; then
            echo "GOFLAGS=-tags=${TAGS}" >> "$GITHUB_ENV"
          fi
          # Populate the module cache used by the workspace before tests run.
          # Network hiccups (e.g. module proxy stream errors mid-download) can
          # abort the fetch after minutes of transfer; retry instead of
          # failing the shard (mirrors backend/full_build.sh).
          retry download_modules

      - name: Start Redis for Go tests
        if: steps.context.outputs.should_test != ''
        run: |
          set -euo pipefail
          # docker.io occasionally answers manifest pulls with a transient 502;
          # retry the pull a few times so a registry hiccup does not fail the
          # whole Go test shard.
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.ci.yaml pull redis; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to pull the Redis image after ${attempt} attempts."
              exit 1
            fi
            echo "Redis image pull failed (attempt ${attempt}); retrying in 10s..."
            sleep 10
          done
          docker compose -f docker-compose.ci.yaml up -d redis
          for i in $(seq 1 45); do
            if docker compose -f docker-compose.ci.yaml exec -T redis redis-cli ping >/dev/null 2>&1; then
              echo "Redis is ready for Go tests."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Timed out waiting for Redis service used by Go tests."
          docker compose -f docker-compose.ci.yaml logs redis || true
          exit 1

      - name: Run Go tests
        id: go_tests
        if: steps.context.outputs.should_test != ''
        continue-on-error: true
        working-directory: backend
        env:
          ASYNQ_REDIS_ADDR: 127.0.0.1:6380
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          packages="$(
            go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... \
              | grep -v '^$' \
              | awk -v s="${SHARD_INDEX}" -v n="${SHARD_TOTAL}" 'NR % n == (s - 1)'
          )"
          if [ -z "${packages}" ]; then
            echo "::error::No test packages resolved for shard ${SHARD_INDEX}/${SHARD_TOTAL}."
            exit 1
          fi
          echo "Shard ${SHARD_INDEX}/${SHARD_TOTAL} test packages:"
          printf '  %s\n' ${packages}
          # -count=1 disables the test-result cache so a re-run of the same
          # commit always executes the tests (the build cache still applies).
          go test -count=1 ${packages}

      - name: Stop Redis for Go tests
        if: steps.context.outputs.should_test != '' && always()
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yaml logs redis || true
          docker compose -f docker-compose.ci.yaml down -v || true

      - name: Finalize Go test status
        id: finalize
        run: |
          set -euo pipefail
          if [ "${{ steps.context.outputs.should_test }}" != "" ]; then
            if [ "${{ steps.go_tests.outcome }}" != "success" ]; then
              echo "::error::Go tests failed on shard ${{ matrix.shard }}/${{ strategy.job-total }}."
              exit 1
            fi
            echo "Go suite shard ${{ matrix.shard }}/${{ strategy.job-total }}: passed."
          else
            echo "Go suite shard ${{ matrix.shard }}/${{ strategy.job-total }}: skipped."
          fi

  run-pr-ci-ai-mock-tests:
    name: Run PR CI AI Mock Tests
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      needs.build-backend-image-once.result == 'success' &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      (github.event.pull_request.base.ref == 'production' ||
      contains(github.event.pull_request.labels.*.name, 'ai-test-mock'))
    outputs:
      should_deploy: ${{ steps.context.outputs.should_deploy }}
      ai_mock_status: ${{ steps.finalize.outputs.ai_mock_status }}
    env:
      AI_TEST_API_HOST: ${{ secrets.AI_TEST_API_HOST }}
      AI_TEST_API_KEY: ${{ secrets.AI_TEST_API_KEY }}
    steps:
      - name: Resolve the pull request's live labels
        id: live_labels
        env:
          LABEL_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Not a pull request event; no labels to resolve."
            : > "${RUNNER_TEMP}/pr-labels.txt"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${LABEL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels?per_page=100" \
            | jq -r '.[].name' > "${RUNNER_TEMP}/pr-labels.txt"
          echo "Live PR labels: $(tr '\n' ' ' < "${RUNNER_TEMP}/pr-labels.txt")"

      - name: Resolve context and label actions
        id: context
        run: |
          set -euo pipefail
          SHOULD_AI_TEST_MOCK="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'ai-test-mock' || true)"
          SHOULD_DEPLOY="$(cat "${RUNNER_TEMP}/pr-labels.txt" | grep -x 'deploy' || true)"
          echo "should_ai_test_mock=$SHOULD_AI_TEST_MOCK" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Set up Python for AI process tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python AI process test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r development/ci/ai_process_tests/requirements.txt
          python -m pip install -e ./clients/oc_python_client

      - name: Login to GHCR for backend image pull
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start backend for AI process tests
        env:
          BACKEND_IMAGE: ${{ needs.build-backend-image-once.outputs.image_url }}
          LITELLM_API_HOST: ${{ env.AI_TEST_API_HOST }}
          LITELLM_API_KEY: ${{ env.AI_TEST_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_IMAGE:-}" ]; then
            echo "::error::BACKEND_IMAGE output is empty for AI process tests."
            exit 1
          fi
          echo "Using prebuilt backend image: ${BACKEND_IMAGE}"
          docker pull "${BACKEND_IMAGE}"

          cat > .ci-test.env <<EOF
          BACKEND_IMAGE=${BACKEND_IMAGE}
          LITELLM_API_HOST=${LITELLM_API_HOST}
          LITELLM_API_KEY=${LITELLM_API_KEY}
          EOF

          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml up -d redis
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml up -d --no-deps backend

          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1984/ || true)"
            if [ "$code" != "000" ]; then
              echo "AI test backend is reachable (HTTP $code)."
              exit 0
            fi
            sleep 2
          done

          echo "::error::Timed out waiting for local backend on http://127.0.0.1:1984"
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs backend || true
          exit 1

      - name: Run mocked AI process tests
        id: ai_mock_tests
        continue-on-error: true
        env:
          OPEN_CHAT_HOST: http://127.0.0.1:1984
          OPEN_CHAT_USERNAME: admin
          OPEN_CHAT_PASSWORD: password
          AI_PROCESS_TESTS_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          ./development/ci/ai_process_tests/run_suite.sh mocked

      - name: Stop backend for AI process tests
        if: always()
        run: |
          set -euo pipefail
          if [ -f .ci-test.env ]; then
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs backend || true
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml down -v || true
          else
            docker compose -f docker-compose.ci.yaml logs backend || true
            docker compose -f docker-compose.ci.yaml down -v || true
          fi

      - name: Finalize AI mock test status
        id: finalize
        run: |
          set -euo pipefail
          ai_mock_status="skipped"
          failed=0

          if [ "${{ steps.ai_mock_tests.outcome }}" = "success" ]; then
            ai_mock_status="passed"
          else
            ai_mock_status="failed"
            failed=1
          fi

          echo "ai_mock_status=$ai_mock_status" >> "$GITHUB_OUTPUT"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Mocked AI process tests failed."
            exit 1
          fi

  run-pr-ci-e2e-plan:
    name: Plan PR CI E2E Shards
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments]
    # Always run (even when the E2E suite is skipped) so the shard matrix is
    # never empty - `fromJson(needs...outputs.matrix)` in the matrix job would
    # otherwise fail on an undefined/empty output.
    if: always()
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Cheap planning job (no checkout/profile/backend): translates the
      # E2E_SHARD_COUNT repo variable into a shard matrix. Unset defaults to 4
      # parallel runner jobs; set the variable (1-8) to override. Each shard runs
      # with --pass-with-no-tests, so over-splitting can never fail on an empty
      # shard.
      - name: Compute E2E shard matrix
        id: plan
        env:
          REQUESTED_SHARDS: ${{ vars.E2E_SHARD_COUNT }}
        run: |
          set -euo pipefail
          raw="${REQUESTED_SHARDS:-4}"
          if ! printf '%s' "$raw" | grep -Eq '^[0-9]+$'; then
            echo "::warning::E2E_SHARD_COUNT='${raw}' is not a non-negative integer; defaulting to 4."
            raw=4
          fi
          shards="$raw"
          if [ "$shards" -lt 1 ]; then shards=1; fi
          if [ "$shards" -gt 8 ]; then
            echo "::warning::E2E_SHARD_COUNT=${shards} is capped at 8."
            shards=8
          fi
          matrix="$(jq -cn --argjson n "$shards" '[range(1; $n + 1)]')"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "E2E shard plan: ${shards} job(s) ${matrix}"

  run-pr-ci-e2e-tests:
    name: Run PR CI E2E Tests (${{ matrix.shard }}/${{ needs.run-pr-ci-e2e-plan.outputs.shards }})
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once, run-pr-ci-e2e-plan]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      needs.build-backend-image-once.result == 'success' &&
      needs.run-pr-ci-e2e-plan.result == 'success' &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_e2e_test != ''
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.run-pr-ci-e2e-plan.outputs.matrix) }}
    steps:
      # No disk-reclamation step here: the E2E shard only installs Playwright
      # and pulls one prebuilt backend image (<5 GB), which comfortably fits the
      # runner's default free space. The `jlumbroso/free-disk-space` action
      # spent ~2.5-4 min removing Android/.NET/Haskell for no benefit (its slow
      # phases are the rm -rf of Android/.NET, not just the apt/prune phases).

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Set up Node.js for E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: development/ci/e2e/package.json

      - name: Install npm dependencies for E2E
        working-directory: development/ci/e2e
        run: |
          set -euo pipefail
          # A transient npm registry hiccup should not fail the whole E2E job;
          # mirror the bounded retry used for the Redis image pull.
          for attempt in 1 2 3; do
            if npm ci || npm install; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Failed to install E2E npm dependencies after ${attempt} attempts."
              exit 1
            fi
            echo "npm dependency install failed (attempt ${attempt}); retrying in 10s..."
            sleep 10
          done

      - name: Get Playwright version
        id: playwright-version
        working-directory: development/ci/e2e
        run: |
          set -euo pipefail
          echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers with deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: development/ci/e2e
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: development/ci/e2e
        run: |
          set -euo pipefail
          npx playwright install-deps chromium

      - name: Login to GHCR for backend image pull
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start backend for E2E tests
        env:
          BACKEND_IMAGE: ${{ needs.build-backend-image-once.outputs.image_url }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_IMAGE:-}" ]; then
            echo "::error::BACKEND_IMAGE output is empty for E2E tests."
            exit 1
          fi
          echo "Using prebuilt backend image: ${BACKEND_IMAGE}"
          docker pull "${BACKEND_IMAGE}"

          cat > .ci-e2e.env <<EOF
          BACKEND_IMAGE=${BACKEND_IMAGE}
          ROOT_CREDENTIALS=admin:password
          LITELLM_API_HOST=
          LITELLM_API_KEY=
          EOF

          docker compose --env-file .ci-e2e.env -f docker-compose.ci.yaml up -d redis
          docker compose --env-file .ci-e2e.env -f docker-compose.ci.yaml up -d --no-deps backend

          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1984/ || true)"
            if [ "$code" != "000" ]; then
              echo "E2E test backend is reachable (HTTP $code)."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Timed out waiting for local backend on http://127.0.0.1:1984"
          docker compose --env-file .ci-e2e.env -f docker-compose.ci.yaml logs backend || true
          exit 1

      - name: Run Playwright E2E tests
        id: playwright_tests
        continue-on-error: true
        working-directory: development/ci/e2e
        env:
          OPEN_CHAT_BASE_URL: http://127.0.0.1:1984
          OPEN_CHAT_USERNAME: admin
          OPEN_CHAT_PASSWORD: password
          CI: "true"
          E2E_WORKERS: ${{ vars.E2E_WORKERS || '4' }}
        run: |
          set -euo pipefail
          # Run the selected shard with concurrent workers. Playwright's built-in
          # --shard/--workers flags make the suite split-able and parallelisable;
          # --pass-with-no-tests keeps an empty shard (over-split) green.
          echo "Running E2E shard ${{ matrix.shard }}/${{ needs.run-pr-ci-e2e-plan.outputs.shards }} with ${E2E_WORKERS} worker(s)."
          npx playwright test \
            --workers="${E2E_WORKERS}" \
            --shard="${{ matrix.shard }}/${{ needs.run-pr-ci-e2e-plan.outputs.shards }}" \
            --pass-with-no-tests

      - name: Stop backend for E2E tests
        if: always()
        run: |
          set -euo pipefail
          if [ -f .ci-e2e.env ]; then
            docker compose --env-file .ci-e2e.env -f docker-compose.ci.yaml logs backend || true
            docker compose --env-file .ci-e2e.env -f docker-compose.ci.yaml down -v || true
          else
            docker compose -f docker-compose.ci.yaml logs backend || true
            docker compose -f docker-compose.ci.yaml down -v || true
          fi

      - name: Upload Playwright report
        if: always() && steps.playwright_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-shard-${{ matrix.shard }}
          path: development/ci/e2e/playwright-report/
          retention-days: 7

      - name: Finalize E2E test status
        id: finalize
        run: |
          set -euo pipefail
          if [ "${{ steps.playwright_tests.outcome }}" = "success" ]; then
            echo "Playwright E2E tests passed (shard ${{ matrix.shard }}/${{ needs.run-pr-ci-e2e-plan.outputs.shards }})."
          else
            echo "::error::Playwright E2E tests failed (shard ${{ matrix.shard }}/${{ needs.run-pr-ci-e2e-plan.outputs.shards }})."
            exit 1
          fi

  sandbox-android-image-ensure:
    name: Ensure Android Sandbox Image
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.callback_action == '') ||
       (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        (contains(github.event.pull_request.labels.*.name, 'slow-android-build-test'))))
    outputs:
      image_url: ${{ steps.image.outputs.image_url }}
    steps:
      # The Android SDK + NDK + emulator + system image is multi-GB; reclaim
      # the runner's preinstalled toolchains before pulling/building it.
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout sandbox-integration submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Materialize integrations
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          BUILD_TOOLS="$(bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          "$BUILD_TOOLS" sync --frozen --profile full

      - name: Resolve android sandbox image tag from content hash
        id: image
        run: |
          set -euo pipefail
          HASH="$(find clients/integrations/docker_sandbox_integration/sandboxes/android -type f \
            -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_url=ghcr.io/${IMAGE_REPO}:sandbox-android-${HASH}" >> "$GITHUB_OUTPUT"
          echo "android sandbox image content hash: ${HASH}"

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether android sandbox image already exists
        id: probe
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE_URL" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Android sandbox image ${IMAGE_URL} already in registry; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh android sandbox-latest alias for existing image
        if: steps.probe.outputs.exists == 'true'
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
        run: |
          set -euo pipefail
          LATEST_URL="$(echo "$IMAGE_URL" | sed 's/:sandbox-android-.*/:sandbox-android-latest/')"
          docker buildx imagetools create -t "$LATEST_URL" "$IMAGE_URL"

      - name: Set up Docker Buildx
        if: steps.probe.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push android sandbox image (with retries)
        if: steps.probe.outputs.exists != 'true'
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
        run: |
          set -euo pipefail
          LATEST_URL="$(echo "$IMAGE_URL" | sed 's/:sandbox-android-.*/:sandbox-android-latest/')"
          attempt=0
          until docker buildx build \
            --push \
            -f clients/integrations/docker_sandbox_integration/sandboxes/android/Dockerfile \
            -t "$IMAGE_URL" \
            -t "$LATEST_URL" \
            clients/integrations/docker_sandbox_integration/sandboxes/android; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::android sandbox image build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "android sandbox image build failed (attempt ${attempt}/3); retrying in 15s..." >&2
            sleep 15
          done

  run-pr-ci-android-build:
    name: Run PR CI Android Build
    runs-on: ubuntu-latest
    # AAR + debug APK build; the image is prebuilt in a sibling job so this is
    # dominated by the gomobile/Gradle compile.
    timeout-minutes: 45
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once, sandbox-android-image-ensure]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      (needs.build-backend-image-once.result == 'success' || needs.build-backend-image-once.result == 'skipped') &&
      (needs.sandbox-android-image-ensure.result == 'success' || needs.sandbox-android-image-ensure.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.callback_action == '') ||
       (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        (contains(github.event.pull_request.labels.*.name, 'slow-android-build-test'))))
    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Materialize integrations
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          BUILD_TOOLS="$(bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          # The sandbox build runs with OPENCHAT_SKIP_INTEGRATION_PREPARE=1, so
          # resolve here: this writes backend/go.work, imports_gen.go and
          # build_tags that full_build.sh/GOWORK then consume.
          "$BUILD_TOOLS" prepare --frozen --profile full-android

      - name: Login to GHCR for sandbox image pull
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Android AAR + debug APK
        env:
          SANDBOX_IMAGE_URL: ${{ needs.sandbox-android-image-ensure.outputs.image_url }}
        run: |
          set -euo pipefail
          if [ -z "${SANDBOX_IMAGE_URL}" ]; then
            echo "::error::android sandbox image URL is empty; image-ensure job did not publish an image." >&2
            exit 1
          fi
          rm -rf .android-ci-results
          mkdir -p .android-ci-results
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e SANDBOX_RESULTS_DIR=/workspace/.android-ci-results \
            -e OPENCHAT_SKIP_INTEGRATION_PREPARE=1 \
            "$SANDBOX_IMAGE_URL" \
            bash -lc 'bash development/ci/android/run_android_build.sh'

      - name: Dump android build logs on failure
        if: failure()
        run: |
          set -euo pipefail
          if [ -f .android-ci-results/android_build.out ]; then
            echo "=== android_build.out (tail) ==="
            tail -n 200 .android-ci-results/android_build.out || true
          fi

      - name: Upload Android build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            clients/gomobile/dist/openchatmobile.aar
            clients/gomobile/android-host/app/build/outputs/apk/debug/app-debug.apk
            .android-ci-results/android_build.out
            .android-ci-results/android_build.tsv
          if-no-files-found: warn

  run-pr-ci-sandbox-tests-after-deploy:
    name: Sandbox Benchmark (after deploy)
    # Reusable sandbox benchmark suite: tag-filtered discovery, sandbox/backend
    # image resolution, the per-test matrix and summary posting all live in
    # reusable-sandbox-benchmark.yaml.
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once, approve-and-dispatch-deploy]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      (needs.build-backend-image-once.result == 'success' || needs.build-backend-image-once.result == 'skipped') &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_sandbox_test != '' &&
      (needs.approve-and-dispatch-deploy.result == 'success' ||
       (needs.approve-and-dispatch-deploy.result == 'skipped' && github.event.pull_request.base.ref == 'production'))
    uses: ./.github/workflows/reusable-sandbox-benchmark.yaml
    with:
      target_ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
      backend_image: ${{ needs.build-backend-image-once.outputs.image_url }}
      # Plain `sandbox-test` runs all tests; `sandbox-test:<tag>` labels narrow
      # the suite to matching tests (union of all such labels).
      tags: ${{ needs.run-pr-ci-tests-and-deployments.outputs.should_sandbox_tags }}
      opencode_provider: openrouter
      opencode_model: deepseek/deepseek-v4-flash
      sandbox_interaction_timeout: "720"
      upload_artifacts: true
      post_results: true
      results_target: pr
      pr_number: ${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}
      source_repo: ${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}
      bot_user: ${{ github.event.inputs.BOT_USER || 'cur1ousdude' }}
      gh_pr_repo: ${{ github.repository }}
      gh_pr_number: ${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}
    secrets: inherit

  dispatch-private-sandbox-tests:
    name: Dispatch Private Sandbox Tests
    runs-on: ubuntu-latest
    # Second sandbox layer: the private CI repository runs the extended suite
    # (LITTLE WORLD + rest_api_tool, etc.) in parallel with the public sandbox
    # benchmark above. Results are kept privately in the CI repo; the private
    # workflow links the report from a PR comment (and, on a `main` run, from a
    # commit status -- never on a PR head, so an informational status can never
    # make GitHub report `mergeable_state: blocked`, ci#683).
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once, approve-and-dispatch-deploy]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      (needs.build-backend-image-once.result == 'success' || needs.build-backend-image-once.result == 'skipped') &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_sandbox_test != '' &&
      (needs.approve-and-dispatch-deploy.result == 'success' ||
       (needs.approve-and-dispatch-deploy.result == 'skipped' && github.event.pull_request.base.ref == 'production'))
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      CI_REF: ${{ vars.CI_REF || 'main' }}
    steps:
      - name: Dispatch private sandbox workflow in CI repository
        env:
          CI_REPO: ${{ needs.run-pr-ci-tests-and-deployments.outputs.ci_repository }}
          TARGET_REF: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
          IMAGE_URL: ${{ needs.build-backend-image-once.outputs.image_url }}
          SOURCE_REPO: ${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}
          PR_NUMBER: ${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BOT_USER: ${{ github.event.inputs.BOT_USER || 'cur1ousdude' }}
          PRIVATE_SANDBOX_TAGS: ${{ vars.PRIVATE_SANDBOX_TAGS || 'lw' }}
          LW_REF: ${{ vars.LITTLE_WORLD_REF || 'main' }}
        run: |
          set -euo pipefail
          if [ -z "${CI_REPO:-}" ]; then
            echo "::warning::ci_repository output is empty; skipping private sandbox dispatch."
            exit 0
          fi
          if [ -z "${IMAGE_URL:-}" ]; then
            echo "::warning::No backend image available; skipping private sandbox dispatch."
            exit 0
          fi
          payload="$(
            jq -n \
              --arg ref "$CI_REF" \
              --arg targetRef "$TARGET_REF" \
              --arg imageUrl "$IMAGE_URL" \
              --arg tags "$PRIVATE_SANDBOX_TAGS" \
              --arg sourceRepo "$SOURCE_REPO" \
              --arg prNumber "$PR_NUMBER" \
              --arg sourceSha "$SOURCE_SHA" \
              --arg botUser "$BOT_USER" \
              --arg lwRef "$LW_REF" \
              '{
                ref: $ref,
                inputs: {
                  target_ref: $targetRef,
                  backend_image: $imageUrl,
                  tags: $tags,
                  source_repo: $sourceRepo,
                  pr_number: $prNumber,
                  source_sha: $sourceSha,
                  bot_user: $botUser,
                  lw_ref: $lwRef
                }
              }'
          )"
          if ! curl -fsSL -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CI_REPO}/actions/workflows/private-sandbox-tests.yaml/dispatches" \
            -d "$payload"; then
            echo "::warning::Could not dispatch private sandbox tests (is private-sandbox-tests.yaml on ${CI_REF}?)."
            exit 0
          fi
          echo "Dispatched private sandbox tests in ${CI_REPO} (tags=${PRIVATE_SANDBOX_TAGS:-<all>})."

  update-progress-comment-after-tests:
    name: Update Progress Comment After Tests
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments]
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    env:
      COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      BOT_USER: ${{ github.event.inputs.BOT_USER || 'cur1ousdude' }}
    steps:
      - name: Checkout source repository for templates
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Render test-complete progress comment
        env:
          # ci#745: thread the comment target explicitly. The sibling steps read
          # the workflow outputs, but when the upstream job is skipped those
          # outputs are empty and the URLs collapse to
          # `repos//issues//comments` (HTTP 404, curl exit 22). Fall back to the
          # event context so repository/PR number are always populated.
          SOURCE_REPOSITORY: ${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository || github.repository }}
          PR_NUMBER: ${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # ci#745 fail-safe: never 404-loop on an empty comment target.
          if [ -z "${SOURCE_REPOSITORY:-}" ] || [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::Skipping test-complete progress comment: repository='${SOURCE_REPOSITORY:-}' pr_number='${PR_NUMBER:-}' are empty."
            exit 0
          fi
          TPL_RUN_URL="${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}"
          TPL_STEP_BUILD='${{ needs.run-pr-ci-tests-and-deployments.outputs.should_deploy != '' && format('- [x] `(2) build` `image={0}`', needs.run-pr-ci-tests-and-deployments.outputs.image_url) || '- [ ] ~~`(2) build` `skipped`~~' }}'
          TPL_STEP_DEPLOY='${{ needs.run-pr-ci-tests-and-deployments.outputs.should_deploy != '' && format('- [ ] `(3) deploy` [`url={0}`]({0}) [`approve here`]({1})', needs.run-pr-ci-tests-and-deployments.outputs.pr_deploy_url, format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id)) || '- [ ] ~~`(3) deploy` `skipped`~~' }}'
          TPL_STEP_TEST='${{ (needs.run-pr-ci-tests-and-deployments.outputs.should_test != '' || needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_mock != '' || needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_real != '' || needs.run-pr-ci-tests-and-deployments.outputs.should_e2e_test != '') && format('- [ ] `(4) test` `go={3}` `ai-mock={4}` `ai-real={5}`', needs.run-pr-ci-tests-and-deployments.outputs.pr_deploy_url, github.run_id, needs.run-pr-ci-tests-and-deployments.outputs.pr_number, needs.run-pr-ci-tests-and-deployments.outputs.should_test != '' && 'running' || 'skipped', needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_mock != '' && 'running' || 'skipped', needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_real != '' && 'running' || 'skipped') || '- [ ] ~~`(4) test` `skipped`~~' }}'
          TPL_STEP_RELEASE_BUILD='${{ needs.run-pr-ci-tests-and-deployments.outputs.should_build != '' && '- [ ] `(5) release build`' || '- [ ] ~~`(5) release build` `skipped`~~' }}'
          TPL_STEP_ANDROID_RELEASE='${{ needs.run-pr-ci-tests-and-deployments.outputs.should_release_android != '' && format('- [x] `(6) android release` [`dispatched`]({0})', needs.run-pr-ci-tests-and-deployments.outputs.android_release_run_url) || '- [ ] ~~`(6) android release` `skipped`~~' }}'
          export TPL_RUN_URL TPL_STEP_BUILD TPL_STEP_DEPLOY TPL_STEP_TEST TPL_STEP_RELEASE_BUILD TPL_STEP_ANDROID_RELEASE
          body="$(python3 development/scripts/render_comment_template.py development/ci/bot_message_templates/004-progress-after-dispatch.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          comment_id="$({
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-pr-ci-progress -->")))][0].id // ""'
          })"
          if [ -n "$comment_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/comments/${comment_id}" \
              -d "$payload"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d "$payload"
          fi

  # ci#734: the planner no longer creates fix-plan sessions on every failed PR.
  # A failed CI run is relayed - quietly - to the open-chat-go development lead,
  # and only for consolidation PRs (`chore/consolidate-*` -> `main`). Feature and
  # bugfix PRs get no comment and no interaction at all. The job id/name are kept
  # unchanged so any required status check keeps reporting.
  ci-failure-planner:
    name: CI Failure Planner (Open-Chat)
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments, run-pr-ci-go-tests, run-pr-ci-ai-mock-tests, run-pr-ci-e2e-tests, build-backend-image-once]
    # Security trigger scope: same-repo PR events only, and only when the head
    # branch is a consolidation branch targeting main. Everything else is
    # intentionally silent: no comment, no interaction, no plan session.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      (needs.run-pr-ci-tests-and-deployments.outputs.is_same_repo_pr == 'true') &&
      (contains(needs.*.result, 'failure')) &&
      github.base_ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'chore/consolidate-')
    env:
      COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect failing job details
        id: failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_JOBS_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100")"
          # ci#606: the relayed `ci_failure` payload also carries a short excerpt
          # of each failed job's tail, so the development lead has an error line
          # to triage on instead of job names only (the `failure_logs` field of
          # the ci#607/#608 contract). The excerpt is truncated, never echoed to
          # the log, and read with the repo-scoped token; no secret is emitted.
          FAILURE_LOGS=""
          while read -r job_id job_name; do
            [ -n "${job_id:-}" ] || continue
            job_tail="$(curl -fsSL -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${job_id}/logs" 2>/dev/null \
              | tail -c 1200 | tr -cd '\11\12\15\40-\176' || true)"
            if [ -n "$job_tail" ]; then
              FAILURE_LOGS="${FAILURE_LOGS}${job_name}: ${job_tail}"$'\n'
            fi
          done < <(jq -r '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name)"' <<< "$RUN_JOBS_JSON")
          # keep the payload printable ASCII so jq never chokes on raw log bytes
          FAILURE_LOGS="$(printf '%s' "$FAILURE_LOGS" | tr -cd '\11\12\15\40-\176')"
          FAILURE_LOGS="${FAILURE_LOGS:0:3800}"
          jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson pr_number "${{ github.event.pull_request.number }}" \
            --arg pr_branch "${{ github.event.pull_request.head.ref }}" \
            --arg pr_sha "${{ github.event.pull_request.head.sha }}" \
            --arg base_ref "${{ github.base_ref }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg failure_logs "$FAILURE_LOGS" \
            --argjson failed_jobs "$(jq -c '[.jobs[] | select(.conclusion == "failure") | {name, html_url}]' <<< "$RUN_JOBS_JSON")" \
            '{repo: $repo, pr_number: $pr_number, pr_branch: $pr_branch, pr_sha: $pr_sha, base_ref: $base_ref, run_url: $run_url, failed_jobs: $failed_jobs, failure_logs: $failure_logs}' \
            > "$RUNNER_TEMP/ci-failure-event.json"

      - name: Relay the failure to the development lead
        env:
          OPEN_CHAT_API_TOKEN: ${{ secrets.OPEN_CHAT_API_TOKEN }}
          OPEN_CHAT_HOST: ${{ vars.OPEN_CHAT_HOST || 'https://ci.msgmate.io' }}
          OPEN_CHAT_LEAD_BOT: ${{ vars.OPEN_CHAT_LEAD_BOT || 'msgmate-coder-development-lead' }}
          OPEN_CHAT_LEAD_CHAT_UUID: ${{ vars.OPEN_CHAT_LEAD_CHAT_UUID || '' }}
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_FIX_MAX_ATTEMPTS: ${{ vars.CI_FIX_MAX_ATTEMPTS || '3' }}
          DRY_RUN: ${{ github.event.inputs.DRY_RUN || '' }}
        run: |
          set -euo pipefail
          python3 development/scripts/ci_failure_relay.py relay --event "$RUNNER_TEMP/ci-failure-event.json"

  # ci#734: dry-run the consolidation-PR relay from the Actions UI. This job
  # performs **no** API call at all - no PR comment and no lead message - and
  # only prints the message and comment body the real relay would produce, so
  # the routing can be inspected without touching a live lead interaction.
  ci-failure-relay-dry-run:
    name: CI Failure Relay Dry Run (Open-Chat)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.DRY_RUN == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the synthetic CI-failure event
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_BRANCH: ${{ github.event.inputs.pr_branch }}
          PR_SHA: ${{ github.event.inputs.pr_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repo "$REPO" \
            --arg pr_branch "$PR_BRANCH" \
            --arg pr_sha "$PR_SHA" \
            --argjson pr_number "${PR_NUMBER:-0}" \
            '{repo: $repo, pr_number: $pr_number, pr_branch: $pr_branch, pr_sha: $pr_sha, base_ref: "main", run_url: "", failed_jobs: []}' \
            > "$RUNNER_TEMP/ci-failure-event.json"

      - name: Dry-run the relay to the development lead
        env:
          OPEN_CHAT_LEAD_BOT: ${{ vars.OPEN_CHAT_LEAD_BOT || 'msgmate-coder-development-lead' }}
          OPEN_CHAT_LEAD_CHAT_UUID: ${{ vars.OPEN_CHAT_LEAD_CHAT_UUID || '' }}
          CI_FIX_MAX_ATTEMPTS: ${{ vars.CI_FIX_MAX_ATTEMPTS || '3' }}
          DRY_RUN: "true"
        run: |
          set -euo pipefail
          python3 development/scripts/ci_failure_relay.py relay \
            --event "$RUNNER_TEMP/ci-failure-event.json" --dry-run

  pr-test-merge-requirement:
    name: PR Test Merge Requirement
    runs-on: ubuntu-latest
    # ci#659: this job is a label-driven gate, so it must never decide from the
    # event payload snapshot (`gh pr create -l ...` labels the PR in a second
    # API call, leaving the `opened` payload label-free). Every label read below
    # consumes the live label list fetched in the first step.
    needs: [run-pr-ci-go-tests, run-pr-ci-ai-mock-tests, run-pr-ci-e2e-tests, run-pr-ci-sandbox-tests-after-deploy]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    steps:
      # ci#659: the superseded-run reconciliation below executes a repository
      # script, so the workspace must be checked out first. Without this the step
      # failed with "python3: can't open file .../pr_ci_superseded_reconcile.py"
      # and, being continue-on-error, silently reported accepted=false (observed
      # on run 39261844509, PR #844): the gate stayed red for a genuinely
      # superseded run. Pin the PR head so the reconciler that runs is the one
      # from the commit being gated.
      - name: Checkout source repository for the superseded-run reconciler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Resolve the pull request's live labels
        id: live_labels
        env:
          LABEL_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "Not a pull request event; no labels to resolve."
            : > "${RUNNER_TEMP}/pr-labels.txt"
            exit 0
          fi
          curl -fsSL \
            -H "Authorization: Bearer ${LABEL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels?per_page=100" \
            | jq -r '.[].name' > "${RUNNER_TEMP}/pr-labels.txt"
          echo "Live PR labels: $(tr '\n' ' ' < "${RUNNER_TEMP}/pr-labels.txt")"

      # ci#659: a cancelled CI run is not a test failure . The workflow concurrency
      # group is keyed by PR number *and* head SHA with `cancel-in-progress: true`,
      # and the later job "Cancel superseded workflow runs for this PR" cancels
      # same-branch runs as well. A burst of `labeled`/`unlabeled` events therefore
      # cancels the in-flight run for the *identical* commit, while this always()
      # gated job still executes inside that cancelled run with every
      # `needs.*.result` equal to `cancelled` - which reported the required check
      # `PR Test Merge Requirement` as failed for a commit whose tests never ran
      # (run 39245536652 on PR #835, whose replacement run then starved in queue).
      #
      # Blanket-passing the cancelled case would make an untested tree look
      # mergeable, so the cancellation is reconciled instead:
      # development/scripts/pr_ci_superseded_reconcile.py accepts only when the
      # commit no longer needs gating (PR closed, or a newer commit is the live PR
      # head) or when a *replacement* run for the exact same commit reached this
      # same gate job with a real verdict, whose conclusion is adopted. Everything
      # else (no replacement, replacement still running, unknown/cancelled job
      # state, API failure) fails closed. Output: accepted=true|false.
      - name: Reconcile a superseded (cancelled) CI run
        id: superseded-reconcile
        continue-on-error: true
        if: >-
          needs.run-pr-ci-go-tests.result == 'cancelled' ||
          needs.run-pr-ci-ai-mock-tests.result == 'cancelled' ||
          needs.run-pr-ci-e2e-tests.result == 'cancelled' ||
          needs.run-pr-ci-sandbox-tests-after-deploy.result == 'cancelled'
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_CI_SUPERSEDED_WAIT_SECONDS: ${{ vars.PR_CI_SUPERSEDED_WAIT_SECONDS || '3600' }}
        run: |
          set -uo pipefail
          set +e
          # The reconciler lives in the checkout above. Fail closed *and loudly*
          # if it is missing: the original "can't open file" was invisible behind
          # `continue-on-error`, which is how the missing checkout went unnoticed.
          if [ ! -f development/scripts/pr_ci_superseded_reconcile.py ]; then
            echo "::error::pr_ci_superseded_reconcile.py is missing from the checkout; the gate stays red."
            echo "accepted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 development/scripts/pr_ci_superseded_reconcile.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --run-id "${{ github.run_id }}"
          reconcile_status=$?
          set -e
          if [ "${reconcile_status}" -eq 0 ]; then
            accepted=true
          else
            accepted=false
          fi
          # Never fail here; the gate step below decides and prints the reason
          # next to the existing label and result checks.
          echo "accepted=${accepted}" >> "${GITHUB_OUTPUT}"

      - name: Enforce test label and passing tests
        run: |
          # ci#659: outcome of the superseded-run reconciliation step above
          # (empty when it did not run, i.e. no upstream suite was cancelled).
          superseded_accepted="${{ steps.superseded-reconcile.outputs.accepted }}"
          # A cancelled gate is only acceptable when this run was superseded: the
          # commit no longer needs gating (PR closed, or a newer commit is the live
          # PR head) or a replacement run for the exact same commit reached this same
          # gate job and produced a real verdict, which is adopted here. Everything
          # else keeps the gate red, so an untested tree can never look mergeable.
          accept_superseded() {
            if [ "${superseded_accepted}" = "true" ]; then
              echo "::notice::$1 were superseded on this commit; adopting the verdict of the replacement run instead of failing the gate."
              return 0
            fi
            echo "::error::$1 were cancelled and this run was not accepted as superseded, so the gate stays red."
            return 1
          }
          set -euo pipefail
          # Production promotion PRs run the full suite without relying on
          # labels (burst label-adds race with the event payload snapshot).
          if [ "${{ github.event.pull_request.base.ref }}" != "production" ] &&
             ! cat "${RUNNER_TEMP}/pr-labels.txt" | grep -E -qx '(test|test-e2e|e2e|sandbox-test(:.*)?)'; then
            echo "::error::PR is missing the required test label."
            exit 1
          fi
          case "${{ needs.run-pr-ci-go-tests.result }}" in
            success) ;;
            skipped)
              if cat "${RUNNER_TEMP}/pr-labels.txt" | grep -qx 'test'; then
                echo "::error::PR CI did not run for this commit with the test label."
                exit 1
              fi
              ;;
            failure)
              echo "::error::PR CI tests failed."
              exit 1
              ;;
            cancelled)
              accept_superseded "PR CI" || exit 1
              ;;
            *)
              echo "::error::PR CI ended with unexpected result: ${{ needs.run-pr-ci-go-tests.result }}"
              exit 1
              ;;
          esac
          if cat "${RUNNER_TEMP}/pr-labels.txt" | grep -qx 'test' && [ -z "${{ needs.run-pr-ci-go-tests.outputs.should_test }}" ]; then
            echo "::error::Tests were not executed despite the test label."
            exit 1
          fi

          case "${{ needs.run-pr-ci-ai-mock-tests.result }}" in
            success) ;;
            skipped) ;;
            failure)
              echo "::error::PR CI mocked AI process tests failed."
              exit 1
              ;;
            cancelled)
              accept_superseded "PR CI mocked AI process tests" || exit 1
              ;;
            *)
              echo "::error::PR CI mocked AI process tests ended with unexpected result: ${{ needs.run-pr-ci-ai-mock-tests.result }}"
              exit 1
               ;;
           esac
           if cat "${RUNNER_TEMP}/pr-labels.txt" | grep -qx 'test' && [ -z "${{ needs.run-pr-ci-go-tests.outputs.should_test }}" ]; then
             echo "::error::Tests were not executed despite the test label."
             exit 1
           fi

          case "${{ needs.run-pr-ci-e2e-tests.result }}" in
            success) ;;
            skipped)
              if cat "${RUNNER_TEMP}/pr-labels.txt" | grep -E -qx '(test|test-e2e|e2e)'; then
                echo "::error::PR CI E2E tests did not run for this commit."
                exit 1
              fi
              ;;
            failure)
              echo "::error::PR CI E2E tests failed."
              exit 1
              ;;
            cancelled)
              accept_superseded "PR CI E2E tests" || exit 1
              ;;
            *)
              echo "::error::PR CI E2E tests ended with unexpected result: ${{ needs.run-pr-ci-e2e-tests.result }}"
              exit 1
              ;;
          esac

          case "${{ needs.run-pr-ci-sandbox-tests-after-deploy.result }}" in
            success) ;;
            skipped)
              if cat "${RUNNER_TEMP}/pr-labels.txt" | grep -E -qx 'sandbox-test(:.*)?'; then
                echo "::error::PR CI sandbox tests did not run for this commit."
                exit 1
              fi
              ;;
            failure)
              echo "::error::PR CI sandbox tests failed."
              exit 1
              ;;
            cancelled)
              accept_superseded "PR CI sandbox tests" || exit 1
              ;;
             *)
              echo "::error::PR CI sandbox tests ended with unexpected result: ${{ needs.run-pr-ci-sandbox-tests-after-deploy.result }}"
              exit 1
              ;;
          esac
          echo "PR test merge requirement satisfied."

  full-suite-gate:
    name: Full Suite Gate
    runs-on: ubuntu-latest
    needs:
      - run-pr-ci-go-tests
      - run-pr-ci-ai-mock-tests
      - run-pr-ci-e2e-tests
      - run-pr-ci-core-only
      - run-pr-ci-sandbox-tests-after-deploy
      - run-pr-ci-ai-real-after-deploy
      - run-pr-ci-android-build
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'production'
    steps:
      - name: Require all requested suites to pass
        run: |
          set -euo pipefail
          echo "Full suite gate: go=${{ needs.run-pr-ci-go-tests.result }} ai-mock=${{ needs.run-pr-ci-ai-mock-tests.result }} e2e=${{ needs.run-pr-ci-e2e-tests.result }} core-only=${{ needs.run-pr-ci-core-only.result }} sandbox=${{ needs.run-pr-ci-sandbox-tests-after-deploy.result }} ai-real=${{ needs.run-pr-ci-ai-real-after-deploy.result }} android=${{ needs.run-pr-ci-android-build.result }}"

          require_suite() {
            local name="$1" result="$2"
            case "$result" in
             success)
               echo "✓ $name passed."
               ;;
             *)
               echo "::error::Production promotion gate: suite '$name' ended with result '$result'."
               exit 1
               ;;
            esac
          }

          require_suite "go tests" "${{ needs.run-pr-ci-go-tests.result }}"
          require_suite "mocked AI process tests" "${{ needs.run-pr-ci-ai-mock-tests.result }}"
          require_suite "E2E tests" "${{ needs.run-pr-ci-e2e-tests.result }}"
          require_suite "core-only image" "${{ needs.run-pr-ci-core-only.result }}"
          require_suite "sandbox tests" "${{ needs.run-pr-ci-sandbox-tests-after-deploy.result }}"
          require_suite "real AI process tests" "${{ needs.run-pr-ci-ai-real-after-deploy.result }}"
          require_suite "android build" "${{ needs.run-pr-ci-android-build.result }}"

          echo "Full suite gate satisfied."

  # Final, additive gate. It runs after every existing suite/merge gate (the
  # deploy-gated sandbox and real-AI suites flow through
  # `pr-test-merge-requirement` / `full-suite-gate`) and fails the run when any
  # tracked component is not pinned to the latest upstream `main`:
  #
  #   * public submodules  - the gitlink SHA recorded in the commit tree;
  #   * public integrations - `integrations.lock.json`;
  #   * private integrations - the private lock mirrored from the `ci` checkout;
  #   * private repos       - the ref-following repos in `profile_setup.yaml`.
  #
  # Escape hatches for deliberate lag (both keep the drift visible in the
  # check output): the tracked `pin-policy.yaml` allow-list and the
  # `pin-drift-allowed` pull-request label. The check fails closed with an
  # itemised report whenever a pin cannot be determined, so it never passes
  # silently. See `development/scripts/check_pin_freshness.py`.
  pin-freshness-gate:
    name: Pin Freshness Gate
    runs-on: ubuntu-latest
    needs:
      - run-pr-ci-tests-and-deployments
      - pr-test-merge-requirement
      - full-suite-gate
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.run-pr-ci-tests-and-deployments.result != 'skipped'
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          # Submodule contents are not needed: the gate reads the gitlink SHAs
          # recorded in the commit tree and compares them with `git ls-remote`.
          submodules: false

      # ci#734: unit-test the CI-failure relay so the quiet-by-default policy
      # (comments/interactions only for consolidation PRs) and the
      # one-comment/one-message behaviour cannot silently regress.
      - name: CI failure relay unit tests
        run: |
          set -euo pipefail
          python3 -m unittest development/scripts/test_ci_failure_relay.py -v

      # ci#659: the superseded-run reconciliation decides whether a cancelled
      # `PR Test Merge Requirement` gate may pass, so pin its acceptance criteria
      # (accept only for a closed PR / moved head / a replacement run with a real
      # verdict, fail closed otherwise) with stdlib-only unit tests.
      - name: Superseded PR CI run reconciliation unit tests
        run: |
          set -euo pipefail
          python3 -m unittest development/scripts/test_pr_ci_superseded_reconcile.py -v

      # ci#740: unit-test the sandbox provider-failure classifier so the
      # "account failure (never retry)" vs "provider unreachable (transient
      # infrastructure)" decision the sandbox benchmark workflow relies on
      # cannot silently regress.
      - name: Sandbox provider failure classifier unit tests
        run: |
          set -euo pipefail
          bash development/scripts/tests/test_sandbox_provider_failure.sh

      # ci#745: the PR-CI progress-comment step must thread its repository/PR
      # context explicitly and must skip (instead of 404-looping) when that
      # context is empty. Pin the contract so the empty-URL red job cannot
      # come back.
      - name: PR CI progress-comment target unit tests
        run: |
          set -euo pipefail
          python3 -m unittest development/scripts/test_pr_ci_progress_comment_target.py -v

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Check every tracked pin against its upstream ref
        env:
          PIN_DRIFT_ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'pin-drift-allowed') }}
        run: |
          set -euo pipefail
          # The build-tools venv (created by profile-setup) ships PyYAML, used to
          # read profile_setup.yaml and pin-policy.yaml; fall back to system
          # python3 when it is already available.
          PYTHON="python3"
          if [ -x ".venv/bin/python" ]; then
            PYTHON=".venv/bin/python"
          fi
          "$PYTHON" development/scripts/check_pin_freshness.py --root .

      - name: Set up Go for the frozen-workspace build
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      # A pin can be perfectly fresh and still not satisfy its consumers
      # (ci#600/#601): materialise the pinned tree and build it, so a lock bump
      # cannot merge a workspace that does not compile.
      - name: Check the pinned workspace still builds
        run: |
          set -euo pipefail
          PYTHON="python3"
          if [ -x ".venv/bin/python" ]; then
            PYTHON=".venv/bin/python"
          fi
          "$PYTHON" development/scripts/check_frozen_workspace.py --root .

  approve-and-dispatch-deploy:
    name: Dispatch Approved Deploy
    runs-on: ubuntu-latest
    # The progress comment (including the `approve here` link) is already posted
    # and kept up to date by `run-pr-ci-tests-and-deployments` /
    # `update-progress-comment-after-tests`; the former separate
    # `post-deploy-approval-link` job only re-rendered the identical comment.
    # Wait for the test jobs here so the approval gate still opens after tests.
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once, run-pr-ci-go-tests, run-pr-ci-ai-mock-tests, run-pr-ci-e2e-tests]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.result == 'success' &&
      needs.build-backend-image-once.result == 'success' &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_deploy != ''
    concurrency:
      group: pr-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: ${{ needs.run-pr-ci-tests-and-deployments.outputs.approval_environment }}
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      CI_REF: ${{ vars.CI_REF || 'main' }}
      DISPATCH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source repository for templates
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Cancel superseded CI deployment runs for this PR
        env:
          CI_REPO: ${{ needs.run-pr-ci-tests-and-deployments.outputs.ci_repository }}
          PR_NUMBER: ${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${CI_REPO}/actions/workflows/test-api-deploy.yaml/runs?status=${status}&per_page=30")"
            jq -r --arg pr "$PR_NUMBER" \
              '.workflow_runs[]
              | select((.display_title // "") | contains("PR#" + $pr))
              | .id' <<< "$runs_json" | while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Cancelling superseded CI deployment run ${run_id} (${status})."
                curl -fsSL -X POST \
                  -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${CI_REPO}/actions/runs/${run_id}/cancel" \
                  >/dev/null || true
              fi
            done
          done

      - name: Dispatch deployment workflow in CI repository
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg ref "$CI_REF" \
              --arg deploymentName "${{ needs.run-pr-ci-tests-and-deployments.outputs.deployment_name }}" \
              --arg targetRef "${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}" \
              --arg imageUrl "${{ needs.run-pr-ci-tests-and-deployments.outputs.image_url }}" \
              --arg sourceRepository "${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}" \
              --arg sourcePrNumber "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}" \
              --arg deployHost "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_deploy_host }}" \
              --arg namespace "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_namespace }}" \
              --arg helmRelease "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_helm_release }}" \
              --arg botUser "$BOT_USER" \
              --arg dispatchRunId "$DISPATCH_RUN_ID" \
              '{
                ref: $ref,
                inputs: {
                  DEPLOYMENT_NAME: $deploymentName,
                  TARGET_REF: $targetRef,
                  BUILT_IMAGE_URL: $imageUrl,
                  SOURCE_REPOSITORY: $sourceRepository,
                  SOURCE_PR_NUMBER: $sourcePrNumber,
                  DEPLOY_HOST_OVERRIDE: $deployHost,
                  NAMESPACE_OVERRIDE: $namespace,
                  HELM_RELEASE_OVERRIDE: $helmRelease,
                  BOT_USER: $botUser,
                  DISPATCH_RUN_ID: $dispatchRunId
                }
              }'
          )"
          status_code="$(curl -s -o /tmp/ci_deploy_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ needs.run-pr-ci-tests-and-deployments.outputs.ci_repository }}/actions/workflows/test-api-deploy.yaml/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch CI deploy workflow (status $status_code)."
            cat /tmp/ci_deploy_dispatch.json || true
            exit 1
          fi

      - name: Dispatch build and release workflow in source repository
        if: needs.run-pr-ci-tests-and-deployments.outputs.should_build != '' && needs.run-pr-ci-tests-and-deployments.outputs.is_same_repo_pr == 'true'
        run: |
          set -euo pipefail
          SOURCE_REPO="${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}"
          BUILD_DISPATCH_REF="$CI_REF"
          TARGET_BUILD_REF="${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}"
          SOURCE_BRANCH_REF="${{ needs.run-pr-ci-tests-and-deployments.outputs.dispatch_ref }}"

          check_build_workflow_inputs() {
            local ref_name="$1"
            local status_code
            status_code="$(curl -s -o /tmp/build_workflow_content.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/contents/.github/workflows/build.yaml?ref=${ref_name}")"
            if [ "$status_code" != "200" ]; then
              return 1
            fi
            content="$(jq -r '.content' < /tmp/build_workflow_content.json | tr -d '\n' | base64 -d)"
            grep -q 'workflow_dispatch:' <<< "$content" || return 1
            grep -q 'target_ref:' <<< "$content" || return 1
            grep -q 'release_kind:' <<< "$content" || return 1
            grep -q 'source_pr_number:' <<< "$content" || return 1
            grep -q 'source_branch:' <<< "$content" || return 1
            grep -q 'source_run_url:' <<< "$content" || return 1
            grep -q 'deploy_url:' <<< "$content" || return 1
            grep -q 'bot_user:' <<< "$content" || return 1
            grep -q 'prerelease:' <<< "$content" || return 1
            return 0
          }

          if ! check_build_workflow_inputs "$BUILD_DISPATCH_REF"; then
            echo "::error::build.yaml on ref '${BUILD_DISPATCH_REF}' does not expose required workflow_dispatch inputs."
            exit 1
          fi

          payload="$(
            jq -n \
              --arg ref "$BUILD_DISPATCH_REF" \
              --arg targetRef "$TARGET_BUILD_REF" \
              --arg sourcePrNumber "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}" \
              --arg sourceBranch "$SOURCE_BRANCH_REF" \
              --arg sourceRunUrl "${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}" \
              --arg deployUrl "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_deploy_url }}" \
              --arg botUser "$BOT_USER" \
              '{
                ref: $ref,
                inputs: {
                  target_ref: $targetRef,
                  release_kind: "pr-alpha",
                  source_pr_number: $sourcePrNumber,
                  source_branch: $sourceBranch,
                  source_run_url: $sourceRunUrl,
                  deploy_url: $deployUrl,
                  bot_user: $botUser,
                  prerelease: "true"
                }
              }'
          )"
          status_code="$(curl -s -o /tmp/build_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}/actions/workflows/build.yaml/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch build workflow (status $status_code)."
            cat /tmp/build_dispatch.json || true
            exit 1
          fi

      - name: Dispatch python client tagging workflow
        if: needs.run-pr-ci-tests-and-deployments.outputs.should_build != '' && needs.run-pr-ci-tests-and-deployments.outputs.is_same_repo_pr == 'true'
        run: |
          set -euo pipefail
          SOURCE_REPO="${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}"
          PRIMARY_REF="$CI_REF"
          SECONDARY_REF="${{ needs.run-pr-ci-tests-and-deployments.outputs.dispatch_ref }}"

          check_py_tag_workflow_inputs() {
            local ref_name="$1"
            local status_code
            status_code="$(curl -s -o /tmp/python_tag_workflow_content.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/contents/.github/workflows/tag-python-client-release.yaml?ref=${ref_name}")"
            if [ "$status_code" != "200" ]; then
              return 1
            fi
            content="$(jq -r '.content' < /tmp/python_tag_workflow_content.json | tr -d '\n' | base64 -d)"
            grep -q 'workflow_dispatch:' <<< "$content" || return 1
            grep -q 'release_kind:' <<< "$content" || return 1
            grep -q 'source_repository:' <<< "$content" || return 1
            grep -q 'source_pr_number:' <<< "$content" || return 1
            grep -q 'source_target_ref:' <<< "$content" || return 1
            grep -q 'source_branch:' <<< "$content" || return 1
            grep -q 'bot_user:' <<< "$content" || return 1
            return 0
          }

          PY_TAG_DISPATCH_REF=""
          for candidate_ref in "$PRIMARY_REF" "$SECONDARY_REF"; do
            if [ -z "$candidate_ref" ]; then
              continue
            fi
            if [ "$candidate_ref" = "$PY_TAG_DISPATCH_REF" ]; then
              continue
            fi
            if check_py_tag_workflow_inputs "$candidate_ref"; then
              PY_TAG_DISPATCH_REF="$candidate_ref"
              break
            fi
          done

          if [ -z "$PY_TAG_DISPATCH_REF" ]; then
            echo "::notice::Workflow tag-python-client-release.yaml with required inputs is not available yet; skipping python client tag dispatch."
            exit 0
          fi

          payload="$(
            jq -n \
              --arg ref "$PY_TAG_DISPATCH_REF" \
              --arg sourceRepository "${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}" \
              --arg sourcePrNumber "${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}" \
              --arg sourceTargetRef "${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}" \
              --arg sourceBranch "${{ needs.run-pr-ci-tests-and-deployments.outputs.dispatch_ref }}" \
              --arg botUser "$BOT_USER" \
              '{
                ref: $ref,
                inputs: {
                  release_kind: "pr-alpha",
                  source_repository: $sourceRepository,
                  source_pr_number: $sourcePrNumber,
                  source_target_ref: $sourceTargetRef,
                  source_branch: $sourceBranch,
                  bot_user: $botUser
                }
              }'
          )"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ needs.run-pr-ci-tests-and-deployments.outputs.source_repository }}/actions/workflows/tag-python-client-release.yaml/dispatches" \
            -d "$payload"

  wait-for-approved-deploy:
    name: Wait For Approved Deploy
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments, approve-and-dispatch-deploy]
    if: |
      always() &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_deploy != '' &&
      needs.approve-and-dispatch-deploy.result == 'success'
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      DISPATCH_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Wait for dispatched CI deployment workflow
        timeout-minutes: 30
        env:
          DEPLOYMENT_NAME: ${{ needs.run-pr-ci-tests-and-deployments.outputs.deployment_name }}
          PR_NUMBER: ${{ needs.run-pr-ci-tests-and-deployments.outputs.pr_number }}
          CI_WAIT_MAX_SECONDS: "1500"
        run: |
          set -euo pipefail
          trap 'echo "::notice::Cancelled — exiting CI wait loop."; exit 130' INT TERM

          interruptible_sleep() {
            local remaining="$1"
            while [ "$remaining" -gt 0 ]; do
              sleep 1
              remaining=$((remaining - 1))
            done
          }

          github_api_get() {
            curl -fsSL --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          ci_repo="${{ needs.run-pr-ci-tests-and-deployments.outputs.ci_repository }}"
          run_id=""
          run_url=""
          poll_interval=15
          # Cover a full 12-25 minute deploy instead of the old ~5 minute bound,
          # which falsely failed while the dispatched deploy was still running.
          deadline=$(( $(date +%s) + CI_WAIT_MAX_SECONDS ))
          attempt=0

          while :; do
            attempt=$((attempt + 1))
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after ${CI_WAIT_MAX_SECONDS}s waiting for the dispatched CI deployment workflow."
              break
            fi

            if ! runs_json="$(github_api_get "https://api.github.com/repos/${ci_repo}/actions/workflows/test-api-deploy.yaml/runs?event=workflow_dispatch&per_page=30")"; then
              echo "Attempt ${attempt}: GitHub API request failed; retrying."
              interruptible_sleep "$poll_interval"
              continue
            fi

            run_line="$(jq -r --arg dispatch_id "$DISPATCH_RUN_ID" --arg deployment "$DEPLOYMENT_NAME" --arg pr "$PR_NUMBER" '
              def candidates:
                [.workflow_runs[]
                | select((.display_title // "") | endswith($dispatch_id))
                | select((.display_title // "") | startswith("Deploy " + $deployment))];
              (if $pr != "" then
                [candidates[] | select((.display_title // "") | contains("PR#" + $pr))][0]
                // candidates[0]
              else
                [candidates[] | select((.display_title // "") | contains("PR#") | not)][0]
                // candidates[0]
              end)
              | if . == null then "" else [.id, .status, (.conclusion // ""), .html_url] | @tsv end
            ' <<< "$runs_json")"

            if [ -z "$run_line" ]; then
              echo "Attempt ${attempt}: waiting for CI workflow run ending with '${DISPATCH_RUN_ID}' (Deploy ${DEPLOYMENT_NAME}...)."
              interruptible_sleep "$poll_interval"
              continue
            fi

            IFS=$'\t' read -r run_id run_status run_conclusion run_url <<< "$run_line"
            echo "Attempt ${attempt}: CI run $run_id status=$run_status conclusion=${run_conclusion:-none}"

            if [ "$run_status" != "completed" ]; then
              interruptible_sleep "$poll_interval"
              continue
            fi

            if [ "$run_conclusion" = "success" ]; then
              exit 0
            fi

            if [ "$run_conclusion" = "cancelled" ]; then
              # A superseded dispatched deploy (cancel-in-progress in the CI
              # repo's per-deployment concurrency, e.g. after a rapid re-push) is
              # not a failure: a newer run owns that deploy. Treating it as a
              # hard failure turned the whole PR run red while the newer deploy
              # was still running.
              echo "Dispatched CI deployment workflow was superseded (cancelled); not a failure."
              exit 0
            fi
            echo "Dispatched CI deployment workflow failed with conclusion: $run_conclusion"
            exit 1
          done

          exit 1

  run-pr-ci-ai-real-after-deploy:
    name: Run AI Real Tests After Deploy Approval
    runs-on: ubuntu-latest
    needs: [run-pr-ci-tests-and-deployments, build-backend-image-once, approve-and-dispatch-deploy]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.build-backend-image-once.result == 'success' &&
      needs.run-pr-ci-tests-and-deployments.outputs.should_ai_test_real != '' &&
      (needs.approve-and-dispatch-deploy.result == 'success' ||
       (needs.approve-and-dispatch-deploy.result == 'skipped' && github.event.pull_request.base.ref == 'production'))
    outputs:
      ai_real_status: ${{ steps.finalize.outputs.ai_real_status }}
    env:
      AI_TEST_API_HOST: ${{ secrets.AI_TEST_API_HOST }}
      AI_TEST_API_KEY: ${{ secrets.AI_TEST_API_KEY }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Set up Python for AI real tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Print checked-out revisions
        run: |
          set -euo pipefail
          echo "Workflow target ref: ${{ needs.run-pr-ci-tests-and-deployments.outputs.target_ref }}"
          echo "Repository HEAD: $(git rev-parse HEAD)"
          echo "Submodule revisions:"
          git submodule status --recursive || true

      - name: Install Python AI process test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r development/ci/ai_process_tests/requirements.txt
          python -m pip install -e ./clients/oc_python_client

      - name: Login to GHCR for backend image pull
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start backend for real AI process tests
        env:
          BACKEND_IMAGE: ${{ needs.build-backend-image-once.outputs.image_url }}
          LITELLM_API_HOST: ${{ env.AI_TEST_API_HOST }}
          LITELLM_API_KEY: ${{ env.AI_TEST_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.SANDBOX_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY || secrets.AI_TEST_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_IMAGE:-}" ]; then
            echo "::error::BACKEND_IMAGE output is empty for real AI tests."
            exit 1
          fi
          if [ -z "${LITELLM_API_HOST:-}" ]; then
            echo "::error::AI_TEST_API_HOST/LITELLM_API_HOST is empty for real AI tests."
            exit 1
          fi
          if [ -z "${LITELLM_API_KEY:-}" ]; then
            echo "::error::AI_TEST_API_KEY/LITELLM_API_KEY is empty for real AI tests."
            exit 1
          fi

          echo "Real AI provider host (runner): ${LITELLM_API_HOST}"
          provider_models_url="${LITELLM_API_HOST%/}/models"
          provider_http_code="$(curl -sS -o /tmp/provider_models.json -w '%{http_code}' \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 30 \
            "${provider_models_url}" || true)"
          echo "Provider probe from runner: GET ${provider_models_url} -> HTTP ${provider_http_code}"

          echo "Using prebuilt backend image: ${BACKEND_IMAGE}"
          docker pull "${BACKEND_IMAGE}"

          cat > .ci-test.env <<EOF
          BACKEND_IMAGE=${BACKEND_IMAGE}
          LITELLM_API_HOST=${LITELLM_API_HOST}
          LITELLM_API_KEY=${LITELLM_API_KEY}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          EOF

          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml up -d redis
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml up -d --no-deps backend

          backend_ready="0"
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1984/ || true)"
            if [ "$code" != "000" ]; then
              echo "Real test backend is reachable (HTTP $code)."
              backend_ready="1"
              break
            fi
            sleep 2
          done

          if [ "$backend_ready" != "1" ]; then
            echo "::error::Timed out waiting for local backend on http://127.0.0.1:1984"
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs backend || true
            exit 1
          fi

          echo "Verifying provider env inside backend container..."
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml exec -T backend sh -lc '
            set -eu
            if [ -z "${LITELLM_API_HOST:-}" ]; then
              echo "::error::backend container missing LITELLM_API_HOST"
              exit 1
            fi
            if [ -z "${LITELLM_API_KEY:-}" ]; then
              echo "::error::backend container missing LITELLM_API_KEY"
              exit 1
            fi
            echo "backend LITELLM_API_HOST=${LITELLM_API_HOST}"
            echo "backend LITELLM_API_KEY length=${#LITELLM_API_KEY}"
          '

      - name: Run real AI process tests
        id: ai_real_tests
        continue-on-error: true
        env:
          OPEN_CHAT_HOST: http://127.0.0.1:1984
          OPEN_CHAT_USERNAME: admin
          OPEN_CHAT_PASSWORD: password
          AI_TEST_API_HOST: ${{ env.AI_TEST_API_HOST }}
          AI_TEST_API_KEY: ${{ env.AI_TEST_API_KEY }}
          LITELLM_API_HOST: ${{ env.AI_TEST_API_HOST }}
          LITELLM_API_KEY: ${{ env.AI_TEST_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.SANDBOX_OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY || secrets.AI_TEST_API_KEY }}
          AI_TEST_BASELINE_BACKEND: openrouter
          AI_TEST_BASELINE_MODEL: deepseek/deepseek-v4-flash
          AI_PROCESS_TESTS_SKIP_INSTALL: "1"
          AI_PROCESS_TESTS_VERBOSE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs -f backend &
          BACKEND_LOG_PID=$!
          cleanup() {
            kill "$BACKEND_LOG_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ./development/ci/ai_process_tests/run_suite.sh real

      - name: Stop backend for real AI process tests
        if: always()
        run: |
          set -euo pipefail
          if [ -f .ci-test.env ]; then
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml logs backend || true
            docker compose --env-file .ci-test.env -f docker-compose.ci.yaml down -v || true
          else
            docker compose -f docker-compose.ci.yaml logs backend || true
            docker compose -f docker-compose.ci.yaml down -v || true
          fi

      - name: Finalize AI real status
        id: finalize
        run: |
          set -euo pipefail
          if [ "${{ steps.ai_real_tests.outcome }}" = "success" ]; then
            echo "ai_real_status=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ai_real_status=failed" >> "$GITHUB_OUTPUT"
          echo "::error::ai-test-real failed after deployment approval."
          exit 1

