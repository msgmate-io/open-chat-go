  cancel-superseded-merged-deployment:
    name: Cancel Superseded Merged Deployments
    runs-on: ubuntu-latest
    # The per-merge-scoped top-level concurrency group (see the workflow-level
    # `concurrency`) lets a fresh merge start immediately instead of queueing
    # behind a stale merged-deployment run. A stale run can be parked on a
    # protected deployment environment, and GitHub refuses to auto-cancel
    # environment-gated runs with `cancel-in-progress`; that stale run then also
    # holds the per-branch job concurrency group and starves the fresh dispatch.
    # This job explicitly cancels every superseded merged-deployment run for this
    # repository so the fresh dispatch can proceed.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'production')
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
    steps:
      - name: Cancel superseded merged-deployment runs
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          workflow="run-pr-ci-tests-and-deployments.yaml"
          current_run="${{ github.run_id }}"
          now_epoch="$(date +%s)"

          for status in queued in_progress waiting requested pending; do
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?event=pull_request&status=${status}&per_page=50")"

            # A merged/closed PR run no longer carries a `pull_requests` entry,
            # whereas an open-PR run does. Guard with a short age threshold so a
            # just-created open-PR run is never cancelled in the brief window
            # before GitHub attaches its pull request.
            mapfile -t run_ids < <(jq -r \
              --arg current "$current_run" \
              --argjson now "$now_epoch" '
              .workflow_runs[]
              | select(.id != ($current | tonumber))
              | select((.pull_requests // []) | length == 0)
              | select(((.created_at | fromdateiso8601) // $now) < ($now - 120))
              | .id' <<< "$runs_json")

            for run_id in "${run_ids[@]:-}"; do
              [ -n "$run_id" ] || continue
              echo "Cancelling superseded merged-deployment run ${run_id} (status ${status})."
              curl -fsSL -X POST \
                -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${repo}/actions/runs/${run_id}/cancel" \
                >/dev/null || echo "::warning::Failed to cancel run ${run_id}; continuing."
            done
          done

  resolve-merged-deployment:
    name: Resolve Merged Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'production')
    outputs:
      should_deploy: ${{ steps.context.outputs.should_deploy }}
      deployment_name: ${{ steps.context.outputs.deployment_name }}
      ci_deployment_name: ${{ steps.context.outputs.ci_deployment_name }}
      target_ref: ${{ steps.context.outputs.target_ref }}
      ci_repository: ${{ steps.context.outputs.ci_repository }}
      deployment_url: ${{ steps.context.outputs.deployment_url }}
      merge_target: ${{ steps.context.outputs.merge_target }}
      helm_values_file: ${{ steps.context.outputs.helm_values_file }}
    steps:
      - name: Resolve merged deployment context
        id: context
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          TARGET_REF="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$TARGET_REF" ] || [ "$TARGET_REF" = "null" ]; then
            TARGET_REF="$BASE_REF"
          fi

          if [ "$BASE_REF" = "production" ]; then
            DEPLOYMENT_NAME="${{ env.DEPLOYMENT_PRODUCTION }}"
            DEPLOYMENT_URL="https://msgmate.io"
            HELM_VALUES_FILE="development/helm/backend/values.${{ env.DEPLOYMENT_PRODUCTION }}.yaml"
          else
            DEPLOYMENT_NAME="${{ env.DEPLOYMENT_STAGING }}"
            DEPLOYMENT_URL="https://stage.msgmate.io"
            HELM_VALUES_FILE="development/helm/backend/values.${{ env.DEPLOYMENT_STAGING }}.yaml"
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "deployment_name=$DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "ci_deployment_name=${{ env.DEPLOYMENT_CI }}" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "ci_repository=$CI_REPOSITORY_DEFAULT" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "merge_target=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "helm_values_file=$HELM_VALUES_FILE" >> "$GITHUB_OUTPUT"

  open-production-promotion-pr:
    name: Open Production Promotion PR
    runs-on: ubuntu-latest
    needs: [resolve-merged-deployment]
    if: |
      needs.resolve-merged-deployment.outputs.should_deploy == 'true' &&
      needs.resolve-merged-deployment.outputs.merge_target == 'main'
    env:
      PR_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      REPOSITORY: ${{ github.repository }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Open or refresh main to production promotion PR
        env:
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED_PR_URL: ${{ github.event.pull_request.html_url }}
          PROMOTED_SHA: ${{ needs.resolve-merged-deployment.outputs.target_ref }}
          STAGING_DEPLOY_URL: ${{ needs.resolve-merged-deployment.outputs.deployment_url }}
        run: |
          set -euo pipefail
          compare_json="$(curl -fsSL \
            -H "Authorization: Bearer ${PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/compare/production...main")"
          ahead_by="$(jq -r '.ahead_by // 0' <<< "$compare_json")"
          if [ "$ahead_by" = "0" ]; then
            echo "main is not ahead of production; skipping production promotion PR."
            exit 0
          fi

          title="[Production deploy] Promote main → production — merging updates msgmate.io"
          body="$(cat <<EOF
          <!-- open-chat-production-promotion -->

          This pull request was opened automatically after a merge to \`main\`.

          **Merging this PR will trigger a production deployment to [msgmate.io](https://msgmate.io).**
          Deployment requires admin approval in the \`${{ env.DEPLOYMENT_PRODUCTION }}\` environment.

          | | |
          | --- | --- |
          | Helm values | \`development/helm/backend/values.${{ env.DEPLOYMENT_PRODUCTION }}.yaml\` |
          | Deployment environment | \`${{ env.DEPLOYMENT_PRODUCTION }}\` |
          | Staging preview | [${STAGING_DEPLOY_URL}](${STAGING_DEPLOY_URL}) |
          | Promoted commit | \`${PROMOTED_SHA}\` |
          | Source merge | [#${MERGED_PR_NUMBER}](${MERGED_PR_URL}) — ${MERGED_PR_TITLE} |

          Automated labels: \`ai-test-mock\`, \`ai-test-real\`, \`build\`, \`test\`, \`e2e\`, \`test-e2e\`, \`test-core-only\`, \`sandbox-test\` (or \`sandbox-test:<tag>\` to run a tagged subset), \`release-android\`, \`slow-android-build-test\` (very slow Android build test) — the full test suite (incl. post-deploy suites, which run in parallel since the staging deploy was already confirmed on the merge to \`main\`) must all pass before this PR can be merged. Merging gates on **PR Test Merge Requirement** and **Full Suite Gate**.
          EOF
          )"

          existing_pr_number="$(
            curl -fsSL \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls?state=open&head=${REPO_OWNER}:main&base=production&per_page=1" \
              | jq -r '.[0].number // ""'
          )"

          if [ -n "$existing_pr_number" ]; then
            echo "Closing stale production promotion PR #${existing_pr_number} before opening a fresh one."
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${existing_pr_number}" \
              -d '{"state":"closed"}'
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/issues/${existing_pr_number}/comments" \
              -d "$(jq -n --arg body 'Superseded by a newer merge to `main`. A fresh production promotion PR is being opened.' '{body: $body}')"
          fi

          echo "Creating production promotion PR from main to production."
          pr_number="$(
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${PR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls" \
              -d "$(jq -n \
                --arg title "$title" \
                --arg body "$body" \
                --arg head "main" \
                --arg base "production" \
                '{title: $title, body: $body, head: $head, base: $base}')" \
              | jq -r '.number'
          )"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${pr_number}/labels" \
            -d '{"labels":["ai-test-mock","ai-test-real","build","test","e2e","test-e2e","test-core-only","sandbox-test","release-android","slow-android-build-test"]}'

          echo "Production promotion PR: ${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${pr_number}"

  post-merged-deploy-approval-link:
    name: Post Merged Deploy Approval Link
    runs-on: ubuntu-latest
    needs: [resolve-merged-deployment]
    if: needs.resolve-merged-deployment.outputs.should_deploy == 'true'
    env:
      COMMENT_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
    steps:
      - name: Checkout source repository for templates
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-merged-deployment.outputs.target_ref }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Profile setup
        uses: ./.github/actions/profile-setup
        with:
          profile: full-ci
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Comment deployment approval link on merged PR
        env:
          BOT_USER: ${{ env.BOT_USER }}
          DEPLOYMENT_NAME: ${{ needs.resolve-merged-deployment.outputs.deployment_name }}
          DEPLOYMENT_URL: ${{ needs.resolve-merged-deployment.outputs.deployment_url }}
          HELM_VALUES_FILE: ${{ needs.resolve-merged-deployment.outputs.helm_values_file }}
          APPROVAL_RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TPL_DEPLOYMENT_NAME="$DEPLOYMENT_NAME"
          TPL_DEPLOYMENT_URL="$DEPLOYMENT_URL"
          TPL_HELM_VALUES_FILE="$HELM_VALUES_FILE"
          TPL_APPROVAL_RUN_URL="$APPROVAL_RUN_URL"
          export TPL_DEPLOYMENT_NAME TPL_DEPLOYMENT_URL TPL_HELM_VALUES_FILE TPL_APPROVAL_RUN_URL
          body="$(python3 development/scripts/render_comment_template.py development/ci/bot_message_templates/008-merged-deploy-approval-link.md)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          comment_id="$(
            curl -fsSL \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${MERGED_PR_NUMBER}/comments" \
              | jq -r --arg bot_user "$BOT_USER" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-merged-deploy-comment -->")))][0].id // ""'
          )"
          if [ -n "$comment_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -d "$payload"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${COMMENT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${MERGED_PR_NUMBER}/comments" \
              -d "$payload"
          fi

      - name: Create or update deployment approval issue
        env:
          ISSUE_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          DEPLOYMENT_NAME: ${{ needs.resolve-merged-deployment.outputs.deployment_name }}
          DEPLOYMENT_URL: ${{ needs.resolve-merged-deployment.outputs.deployment_url }}
          MERGED_PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_PR_URL: ${{ github.event.pull_request.html_url }}
          APPROVAL_RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          APPROVAL_REVIEW_URL: ${{ format('https://github.com/{0}/actions/runs/{1}?check_suite_focus=true', github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          marker="<!-- open-chat-merged-deploy-approval-issue run:${GITHUB_RUN_ID} -->"
          title="[Deploy approval] ${DEPLOYMENT_NAME} from merged PR #${MERGED_PR_NUMBER}"
          body="$(cat <<EOF
          ${marker}

          Deployment approval required for **${DEPLOYMENT_NAME}**.

          - Approval page: ${APPROVAL_REVIEW_URL}
          - Workflow run: ${APPROVAL_RUN_URL}
          - Source PR: #${MERGED_PR_NUMBER} (${MERGED_PR_URL})
          - Deployment URL: ${DEPLOYMENT_URL}

          This issue is closed automatically after approval or cancellation.
          EOF
          )"
          payload="$(jq -n --arg title "$title" --arg body "$body" '{title: $title, body: $body}')"

          issue_id="$({
            curl -fsSL \
              -H "Authorization: Bearer ${ISSUE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues?state=open&per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select(.pull_request | not) | select((.body // "") | contains($marker))][0].number // ""'
          })"

          if [ -n "$issue_id" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${ISSUE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${issue_id}" \
              -d "$payload" >/dev/null
            echo "Updated deployment approval issue #${issue_id}."
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ISSUE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$payload" >/dev/null
            echo "Created deployment approval issue."
          fi

  dispatch-merged-deployment:
    name: Dispatch Merged Deployment
    runs-on: ubuntu-latest
    needs: [resolve-merged-deployment, post-merged-deploy-approval-link, cancel-superseded-merged-deployment]
    if: |
      always() &&
      needs.resolve-merged-deployment.outputs.should_deploy == 'true' &&
      (needs.post-merged-deploy-approval-link.result == 'success' || needs.post-merged-deploy-approval-link.result == 'skipped')
    concurrency:
      group: merged-deploy-dispatch-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: true
    environment:
      name: ${{ needs.resolve-merged-deployment.outputs.deployment_name }}
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      CI_REF: ${{ vars.CI_REF || 'main' }}
      DISPATCH_RUN_ID: merged-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Cancel superseded CI deployment runs for this branch
        env:
          CI_REPO: ${{ needs.resolve-merged-deployment.outputs.ci_repository }}
          DEPLOYMENT_NAME: ${{ needs.resolve-merged-deployment.outputs.deployment_name }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${CI_REPO}/actions/workflows/test-api-deploy.yaml/runs?status=${status}&per_page=30")"
            jq -r --arg deployment "$DEPLOYMENT_NAME" --arg dispatch_id "$DISPATCH_RUN_ID" \
              '.workflow_runs[]
              | select((.display_title // "") | startswith("Deploy " + $deployment))
              | select((.display_title // "") | contains("PR#") | not)
              | select((.display_title // "") | endswith($dispatch_id) | not)
              | .id' <<< "$runs_json" | while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Cancelling superseded CI deployment run ${run_id} (${status})."
                curl -fsSL -X POST \
                  -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${CI_REPO}/actions/runs/${run_id}/cancel" \
                  >/dev/null || true
              fi
            done
          done

      - name: Reuse the PR-built image (skip the production rebuild)
        id: built_image
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${HEAD_SHA:0:12}"
          IMAGE_URL="ghcr.io/${IMAGE_REPO}:pr-${PR_NUMBER}-${SHORT_SHA}"
          # The PR CI already builds this image for tests; a squash merge has the
          # same tree, so deploy it instead of rebuilding the full production image.
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1 || true
          if docker manifest inspect "$IMAGE_URL" >/dev/null 2>&1; then
            echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
            echo "Reusing PR-built image: $IMAGE_URL"
          else
            echo "image_url=" >> "$GITHUB_OUTPUT"
            echo "No PR-built image at $IMAGE_URL; the deploy will build it."
          fi

      - name: Dispatch deployment workflow in CI repository
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg ref "$CI_REF" \
              --arg deploymentName "${{ needs.resolve-merged-deployment.outputs.deployment_name }}" \
              --arg targetRef "${{ needs.resolve-merged-deployment.outputs.target_ref }}" \
              --arg imageUrl "${{ steps.built_image.outputs.image_url }}" \
              --arg sourceRepository "${{ github.repository }}" \
              --arg botUser "$BOT_USER" \
              --arg dispatchRunId "$DISPATCH_RUN_ID" \
              '{
                ref: $ref,
                inputs: {
                  DEPLOYMENT_NAME: $deploymentName,
                  TARGET_REF: $targetRef,
                  BUILT_IMAGE_URL: $imageUrl,
                  SOURCE_REPOSITORY: $sourceRepository,
                  SOURCE_PR_NUMBER: "",
                  BOT_USER: $botUser,
                  DISPATCH_RUN_ID: $dispatchRunId
                }
              }'
          )"
          echo "Dispatching CI deploy with run id suffix: ${DISPATCH_RUN_ID}"
          status_code="$(curl -s -o /tmp/merged_ci_deploy_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ needs.resolve-merged-deployment.outputs.ci_repository }}/actions/workflows/test-api-deploy.yaml/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch merged CI deploy workflow (status $status_code)."
            cat /tmp/merged_ci_deploy_dispatch.json || true
            exit 1
          fi

      - name: Dispatch build and release workflow for merged deployment
        env:
          MERGE_TARGET: ${{ needs.resolve-merged-deployment.outputs.merge_target }}
        run: |
          set -euo pipefail
          if [ "$MERGE_TARGET" = "production" ]; then
            RELEASE_KIND="production"
          else
            RELEASE_KIND="staging"
          fi

          SOURCE_REPO="${{ github.repository }}"
          PRIMARY_REF="$MERGE_TARGET"
          SECONDARY_REF="$CI_REF"
          TERTIARY_REF="${{ github.event.repository.default_branch }}"

          check_build_workflow_inputs() {
            local ref_name="$1"
            local status_code
            status_code="$(curl -s -o /tmp/merged_build_workflow_content.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/contents/.github/workflows/build.yaml?ref=${ref_name}")"
            if [ "$status_code" != "200" ]; then
              return 1
            fi
            content="$(jq -r '.content' < /tmp/merged_build_workflow_content.json | tr -d '\n' | base64 -d)"
            grep -q 'workflow_dispatch:' <<< "$content" || return 1
            grep -q 'target_ref:' <<< "$content" || return 1
            grep -q 'release_kind:' <<< "$content" || return 1
            grep -q 'source_pr_number:' <<< "$content" || return 1
            grep -q 'source_branch:' <<< "$content" || return 1
            grep -q 'source_run_url:' <<< "$content" || return 1
            grep -q 'deploy_url:' <<< "$content" || return 1
            grep -q 'bot_user:' <<< "$content" || return 1
            grep -q 'prerelease:' <<< "$content" || return 1
            return 0
          }

          BUILD_DISPATCH_REF=""
          for candidate_ref in "$PRIMARY_REF" "$SECONDARY_REF" "$TERTIARY_REF"; do
            if [ -z "$candidate_ref" ]; then
              continue
            fi
            if [ "$candidate_ref" = "$BUILD_DISPATCH_REF" ]; then
              continue
            fi
            if check_build_workflow_inputs "$candidate_ref"; then
              BUILD_DISPATCH_REF="$candidate_ref"
              break
            fi
          done

          if [ -z "$BUILD_DISPATCH_REF" ]; then
            echo "::error::Could not find a dispatchable build.yaml ref. Tried '${PRIMARY_REF}', '${SECONDARY_REF}', '${TERTIARY_REF}'."
            exit 1
          fi

          payload="$(
            jq -n \
              --arg ref "$BUILD_DISPATCH_REF" \
              --arg targetRef "${{ needs.resolve-merged-deployment.outputs.target_ref }}" \
              --arg releaseKind "$RELEASE_KIND" \
              --arg sourcePrNumber "${{ github.event.pull_request.number }}" \
              --arg sourceBranch "${{ github.event.pull_request.base.ref }}" \
              --arg sourceRunUrl "${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}" \
              --arg deployUrl "${{ needs.resolve-merged-deployment.outputs.deployment_url }}" \
              --arg botUser "$BOT_USER" \
              '{
                ref: $ref,
                inputs: {
                  target_ref: $targetRef,
                  release_kind: $releaseKind,
                  source_pr_number: $sourcePrNumber,
                  source_branch: $sourceBranch,
                  source_run_url: $sourceRunUrl,
                  deploy_url: $deployUrl,
                  bot_user: $botUser,
                  prerelease: "true"
                }
              }'
          )"
          status_code="$(curl -s -o /tmp/merged_build_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yaml/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch merged build workflow (status $status_code)."
            cat /tmp/merged_build_dispatch.json || true
            exit 1
          fi

      - name: Dispatch python client tagging workflow for merged deployment
        env:
          MERGE_TARGET: ${{ needs.resolve-merged-deployment.outputs.merge_target }}
        run: |
          set -euo pipefail
          workflow_check_status="$(curl -s -o /tmp/python_tag_workflow_check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tag-python-client-release.yaml")"
          if [ "$workflow_check_status" = "404" ]; then
            echo "::notice::Workflow tag-python-client-release.yaml not available on default branch yet; skipping python client tag dispatch."
            exit 0
          fi
          if [ "$workflow_check_status" != "200" ]; then
            echo "::error::Failed to resolve python tag workflow (status $workflow_check_status)."
            cat /tmp/python_tag_workflow_check.json || true
            exit 1
          fi

          if [ "$MERGE_TARGET" = "production" ]; then
            RELEASE_KIND="production"
          else
            RELEASE_KIND="staging"
          fi

          SOURCE_REPO="${{ github.repository }}"
          PRIMARY_REF="$MERGE_TARGET"
          SECONDARY_REF="$CI_REF"
          TERTIARY_REF="${{ github.event.repository.default_branch }}"

          check_py_tag_workflow_inputs() {
            local ref_name="$1"
            local status_code
            status_code="$(curl -s -o /tmp/merged_py_tag_workflow_content.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/contents/.github/workflows/tag-python-client-release.yaml?ref=${ref_name}")"
            if [ "$status_code" != "200" ]; then
              return 1
            fi
            content="$(jq -r '.content' < /tmp/merged_py_tag_workflow_content.json | tr -d '\n' | base64 -d)"
            grep -q 'workflow_dispatch:' <<< "$content" || return 1
            grep -q 'release_kind:' <<< "$content" || return 1
            grep -q 'source_repository:' <<< "$content" || return 1
            grep -q 'source_pr_number:' <<< "$content" || return 1
            grep -q 'source_target_ref:' <<< "$content" || return 1
            grep -q 'source_branch:' <<< "$content" || return 1
            grep -q 'bot_user:' <<< "$content" || return 1
            return 0
          }

          PY_TAG_DISPATCH_REF=""
          for candidate_ref in "$PRIMARY_REF" "$SECONDARY_REF" "$TERTIARY_REF"; do
            if [ -z "$candidate_ref" ]; then
              continue
            fi
            if [ "$candidate_ref" = "$PY_TAG_DISPATCH_REF" ]; then
              continue
            fi
            if check_py_tag_workflow_inputs "$candidate_ref"; then
              PY_TAG_DISPATCH_REF="$candidate_ref"
              break
            fi
          done

          if [ -z "$PY_TAG_DISPATCH_REF" ]; then
            echo "::error::Could not find a dispatchable tag-python-client-release.yaml ref. Tried '${PRIMARY_REF}', '${SECONDARY_REF}', '${TERTIARY_REF}'."
            exit 1
          fi

          payload="$(
            jq -n \
              --arg ref "$PY_TAG_DISPATCH_REF" \
              --arg releaseKind "$RELEASE_KIND" \
              --arg sourceRepository "${{ github.repository }}" \
              --arg sourcePrNumber "${{ github.event.pull_request.number }}" \
              --arg sourceTargetRef "${{ needs.resolve-merged-deployment.outputs.target_ref }}" \
              --arg sourceBranch "${{ github.event.pull_request.base.ref }}" \
              --arg botUser "$BOT_USER" \
              '{
                ref: $ref,
                inputs: {
                  release_kind: $releaseKind,
                  source_repository: $sourceRepository,
                  source_pr_number: $sourcePrNumber,
                  source_target_ref: $sourceTargetRef,
                  source_branch: $sourceBranch,
                  bot_user: $botUser
                }
              }'
          )"
          status_code="$(curl -s -o /tmp/merged_py_tag_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tag-python-client-release.yaml/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch merged python tag workflow (status $status_code)."
            cat /tmp/merged_py_tag_dispatch.json || true
            exit 1
          fi

      - name: Wait for dispatched CI deployment workflow
        id: wait_ci_deploy
        timeout-minutes: 30
        env:
          DEPLOYMENT_NAME: ${{ needs.resolve-merged-deployment.outputs.deployment_name }}
          CI_WAIT_MAX_SECONDS: "1500"
        run: |
          set -euo pipefail
          trap 'echo "::notice::Cancelled — exiting CI wait loop."; exit 130' INT TERM

          interruptible_sleep() {
            local remaining="$1"
            while [ "$remaining" -gt 0 ]; do
              sleep 1
              remaining=$((remaining - 1))
            done
          }

          github_api_get() {
            curl -fsSL --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          ci_repo="${{ needs.resolve-merged-deployment.outputs.ci_repository }}"
          run_url=""
          expected_title_prefix="Deploy ${DEPLOYMENT_NAME}"
          poll_interval=15
          # Wall-clock bound that actually covers a 12-25 minute deploy: 1500s
          # (25 min) of polling, with the job capped 5 min above that.
          deadline=$(( $(date +%s) + CI_WAIT_MAX_SECONDS ))
          attempt=0

          while :; do
            attempt=$((attempt + 1))
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after ${CI_WAIT_MAX_SECONDS}s waiting for the dispatched CI deployment workflow."
              break
            fi

            if ! runs_json="$(github_api_get "https://api.github.com/repos/${ci_repo}/actions/workflows/test-api-deploy.yaml/runs?event=workflow_dispatch&per_page=30")"; then
              echo "Attempt ${attempt}: GitHub API request failed; retrying."
              interruptible_sleep "$poll_interval"
              continue
            fi

            run_line="$(jq -r --arg dispatch_id "$DISPATCH_RUN_ID" --arg deployment "$DEPLOYMENT_NAME" '
              [
                .workflow_runs[]
                | select((.display_title // .name // "") | endswith($dispatch_id))
                | select((.display_title // .name // "") | startswith("Deploy " + $deployment))
                | [.status, (.conclusion // ""), .html_url, (.display_title // .name // "")]
                | @tsv
              ][0] // ""
            ' <<< "$runs_json")"

            if [ -z "$run_line" ]; then
              echo "Attempt ${attempt}: waiting for CI workflow run ending with '${DISPATCH_RUN_ID}' (${expected_title_prefix}...)."
              if [ "$attempt" = "1" ] || [ $((attempt % 5)) -eq 0 ]; then
                echo "Recent CI workflow titles:"
                jq -r '.workflow_runs[:8][] | "- \(.display_title // .name // "unknown")"' <<< "$runs_json"
              fi
              interruptible_sleep "$poll_interval"
              continue
            fi

            IFS=$'\t' read -r run_status run_conclusion run_url run_title <<< "$run_line"
            echo "Attempt ${attempt}: matched CI run '${run_title}' status=$run_status conclusion=${run_conclusion:-none}"
            if [ "$run_status" != "completed" ]; then
              interruptible_sleep "$poll_interval"
              continue
            fi

            echo "ci_run_url=$run_url" >> "$GITHUB_OUTPUT"
            if [ "$run_conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$run_conclusion" = "cancelled" ]; then
              # A superseded dispatched deploy (cancel-in-progress in the CI
              # repo's per-deployment concurrency, e.g. after a rapid re-push) is
              # not a failure: a newer run owns that deploy. Treating it as a
              # hard failure turned the whole PR run red while the newer deploy
              # was still running.
              echo "Dispatched CI deployment workflow was superseded (cancelled); not a failure."
              exit 0
            fi
            echo "Dispatched CI deployment workflow failed with conclusion: $run_conclusion"
            exit 1
          done

          if [ -n "$run_url" ]; then
            echo "ci_run_url=$run_url" >> "$GITHUB_OUTPUT"
          fi
          exit 1

  dispatch-merged-ci-deployment:
    name: Dispatch Merged CI Deployment
    runs-on: ubuntu-latest
    needs: [resolve-merged-deployment, cancel-superseded-merged-deployment]
    if: |
      always() &&
      needs.resolve-merged-deployment.result == 'success' &&
      needs.resolve-merged-deployment.outputs.should_deploy == 'true' &&
      needs.resolve-merged-deployment.outputs.merge_target == 'main'
    concurrency:
      group: merged-deploy-dispatch-${{ needs.resolve-merged-deployment.outputs.ci_deployment_name }}
      cancel-in-progress: true
    environment:
      name: ${{ needs.resolve-merged-deployment.outputs.ci_deployment_name }}
    env:
      CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      CI_REF: ${{ vars.CI_REF || 'main' }}
      DISPATCH_RUN_ID: ci-merged-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Cancel superseded CI deployment runs for this branch
        env:
          CI_REPO: ${{ needs.resolve-merged-deployment.outputs.ci_repository }}
          DEPLOYMENT_NAME: ${{ env.DEPLOYMENT_CI }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${CI_REPO}/actions/workflows/test-api-deploy.yaml/runs?status=${status}&per_page=30")"
            jq -r --arg deployment "$DEPLOYMENT_NAME" --arg dispatch_id "$DISPATCH_RUN_ID" \
              '.workflow_runs[]
              | select((.display_title // "") | startswith("Deploy " + $deployment))
              | select((.display_title // "") | contains("PR#") | not)
              | select((.display_title // "") | endswith($dispatch_id) | not)
              | .id' <<< "$runs_json" | while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Cancelling superseded CI deployment run ${run_id} (${status})."
                curl -fsSL -X POST \
                  -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${CI_REPO}/actions/runs/${run_id}/cancel" \
                  >/dev/null || true
              fi
            done
          done

      - name: Dispatch deployment workflow in CI repository
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg ref "$CI_REF" \
              --arg deploymentName "${{ env.DEPLOYMENT_CI }}" \
              --arg targetRef "${{ needs.resolve-merged-deployment.outputs.target_ref }}" \
              --arg sourceRepository "${{ github.repository }}" \
              --arg botUser "$BOT_USER" \
              --arg dispatchRunId "$DISPATCH_RUN_ID" \
              '{
                ref: $ref,
                inputs: {
                  DEPLOYMENT_NAME: $deploymentName,
                  TARGET_REF: $targetRef,
                  SOURCE_REPOSITORY: $sourceRepository,
                  SOURCE_PR_NUMBER: "",
                  BOT_USER: $botUser,
                  DISPATCH_RUN_ID: $dispatchRunId
                }
              }'
          )"
          echo "Dispatching CI deploy with run id suffix: ${DISPATCH_RUN_ID}"
          status_code="$(curl -s -o /tmp/merged_ci_deploy_dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ needs.resolve-merged-deployment.outputs.ci_repository }}/actions/workflows/test-api-deploy.yaml/dispatches" \
            -d "$payload")"
          if [ "$status_code" != "204" ]; then
            echo "::error::Failed to dispatch merged CI deploy workflow (status $status_code)."
            cat /tmp/merged_ci_deploy_dispatch.json || true
            exit 1
          fi

      - name: Wait for dispatched CI deployment workflow
        id: wait_ci_deploy
        timeout-minutes: 30
        env:
          DEPLOYMENT_NAME: ${{ env.DEPLOYMENT_CI }}
          CI_WAIT_MAX_SECONDS: "1500"
        run: |
          set -euo pipefail
          trap 'echo "::notice::Cancelled — exiting CI wait loop."; exit 130' INT TERM

          interruptible_sleep() {
            local remaining="$1"
            while [ "$remaining" -gt 0 ]; do
              sleep 1
              remaining=$((remaining - 1))
            done
          }

          github_api_get() {
            curl -fsSL --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          ci_repo="${{ needs.resolve-merged-deployment.outputs.ci_repository }}"
          run_url=""
          expected_title_prefix="Deploy ${DEPLOYMENT_NAME}"
          poll_interval=15
          # Wall-clock bound that actually covers a 12-25 minute deploy: 1500s
          # (25 min) of polling, with the job capped 5 min above that.
          deadline=$(( $(date +%s) + CI_WAIT_MAX_SECONDS ))
          attempt=0

          while :; do
            attempt=$((attempt + 1))
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after ${CI_WAIT_MAX_SECONDS}s waiting for the dispatched CI deployment workflow."
              break
            fi

            if ! runs_json="$(github_api_get "https://api.github.com/repos/${ci_repo}/actions/workflows/test-api-deploy.yaml/runs?event=workflow_dispatch&per_page=30")"; then
              echo "Attempt ${attempt}: GitHub API request failed; retrying."
              interruptible_sleep "$poll_interval"
              continue
            fi

            run_line="$(jq -r --arg dispatch_id "$DISPATCH_RUN_ID" --arg deployment "$DEPLOYMENT_NAME" '
              [
                .workflow_runs[]
                | select((.display_title // .name // "") | endswith($dispatch_id))
                | select((.display_title // .name // "") | startswith("Deploy " + $deployment))
                | [.status, (.conclusion // ""), .html_url, (.display_title // .name // "")]
                | @tsv
              ][0] // ""
            ' <<< "$runs_json")"

            if [ -z "$run_line" ]; then
              echo "Attempt ${attempt}: waiting for CI workflow run ending with '${DISPATCH_RUN_ID}' (${expected_title_prefix}...)."
              if [ "$attempt" = "1" ] || [ $((attempt % 5)) -eq 0 ]; then
                echo "Recent CI workflow titles:"
                jq -r '.workflow_runs[:8][] | "- \(.display_title // .name // "unknown")"' <<< "$runs_json"
              fi
              interruptible_sleep "$poll_interval"
              continue
            fi

            IFS=$'\t' read -r run_status run_conclusion run_url run_title <<< "$run_line"
            echo "Attempt ${attempt}: matched CI run '${run_title}' status=$run_status conclusion=${run_conclusion:-none}"
            if [ "$run_status" != "completed" ]; then
              interruptible_sleep "$poll_interval"
              continue
            fi

            echo "ci_run_url=$run_url" >> "$GITHUB_OUTPUT"
            if [ "$run_conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$run_conclusion" = "cancelled" ]; then
              # A superseded dispatched deploy (cancel-in-progress in the CI
              # repo's per-deployment concurrency, e.g. after a rapid re-push) is
              # not a failure: a newer run owns that deploy. Treating it as a
              # hard failure turned the whole PR run red while the newer deploy
              # was still running.
              echo "Dispatched CI deployment workflow was superseded (cancelled); not a failure."
              exit 0
            fi
            echo "Dispatched CI deployment workflow failed with conclusion: $run_conclusion"
            exit 1
          done

          if [ -n "$run_url" ]; then
            echo "ci_run_url=$run_url" >> "$GITHUB_OUTPUT"
          fi
          exit 1

  close-merged-deploy-approval-issue:
    name: Close Merged Deploy Approval Issue
    runs-on: ubuntu-latest
    needs: [resolve-merged-deployment, post-merged-deploy-approval-link, dispatch-merged-deployment]
    if: |
      always() &&
      needs.resolve-merged-deployment.outputs.should_deploy == 'true' &&
      (needs.post-merged-deploy-approval-link.result == 'success' || needs.post-merged-deploy-approval-link.result == 'skipped')
    env:
      ISSUE_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      DISPATCH_RESULT: ${{ needs.dispatch-merged-deployment.result }}
    steps:
      - name: Close deployment approval issue for this run
        run: |
          set -euo pipefail
          marker="<!-- open-chat-merged-deploy-approval-issue run:${GITHUB_RUN_ID} -->"

          issue_number="$({
            curl -fsSL \
              -H "Authorization: Bearer ${ISSUE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues?state=open&per_page=100" \
              | jq -r --arg marker "$marker" '[.[] | select(.pull_request | not) | select((.body // "") | contains($marker))][0].number // ""'
          })"

          if [ -z "$issue_number" ]; then
            echo "No open deployment approval issue found for this run."
            exit 0
          fi

          case "$DISPATCH_RESULT" in
            success)
              closing_note="Deployment approval completed and dispatch finished successfully."
              ;;
            cancelled)
              closing_note="Deployment approval was cancelled or rejected; closing this request issue."
              ;;
            *)
              closing_note="Deployment request is no longer pending (result: ${DISPATCH_RESULT}); closing this issue."
              ;;
          esac

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ISSUE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${issue_number}/comments" \
            -d "$(jq -n --arg body "$closing_note" '{body: $body}')" >/dev/null

          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${ISSUE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${issue_number}" \
            -d '{"state":"closed"}' >/dev/null

          echo "Closed deployment approval issue #${issue_number}."
