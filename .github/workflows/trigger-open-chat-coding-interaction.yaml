name: Trigger Open-Chat Coding Interaction

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message to send to the bot interaction
        required: true
        default: ""
      bot:
        description: Open-Chat bot username to start the interaction with
        required: false
        default: coding-bot
      host:
        description: Open-Chat server URL
        required: false
        default: https://ci.msgmate.io

permissions:
  contents: read

jobs:
  trigger-interaction:
    name: Trigger Open-Chat Interaction
    runs-on: ubuntu-latest
    steps:
      - name: Install Open-Chat python client
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          pip install "git+https://x-access-token:${GH_TOKEN}@github.com/msgmate-io/open-chat-go-python-client.git"

      - name: Trigger interaction
        env:
          OPEN_CHAT_API_TOKEN: ${{ secrets.OPEN_CHAT_API_TOKEN }}
          OPEN_CHAT_HOST: ${{ github.event.inputs.host }}
          OPEN_CHAT_BOT: ${{ github.event.inputs.bot }}
          OPEN_CHAT_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail
          if [ -z "$OPEN_CHAT_MESSAGE" ]; then
            echo "::error::message input is required for dispatch."
            exit 1
          fi
          if [ -z "$OPEN_CHAT_API_TOKEN" ]; then
            echo "::error::OPEN_CHAT_API_TOKEN secret is not set in this repository."
            exit 1
          fi
          open_chat_client_python \
            --host "$OPEN_CHAT_HOST" \
            --api-token "$OPEN_CHAT_API_TOKEN" \
            --bot "$OPEN_CHAT_BOT" \
            --message "$OPEN_CHAT_MESSAGE"
