# ci#600: guard the integration-module CI itself and prove it on demand.
#
# The reusable `reusable-integration-module-ci.yaml` is only ever exercised from
# *another* repository, so without this wrapper a change to it (or to
# `development/scripts/integration_module_ci.sh`) would land unverified.
#
#   * `validate` - fast, label-free syntax gate on the script + workflow YAML,
#     triggered by pull requests touching either file.
#   * `smoke`    - manual (`workflow_dispatch`) end-to-end run of the reusable
#     against a real integration repo, used when rolling the CI out or when a
#     caller repo reports a failure. Never runs on PRs: it clones the workspace
#     and compiles an integration module.
name: Integration module CI

on:
  pull_request:
    paths:
      - .github/workflows/reusable-integration-module-ci.yaml
      - .github/workflows/integration-module-ci.yaml
      - development/scripts/integration_module_ci.sh
      - development/scripts/check_integration_decoupling.py
      - development/scripts/tests/test_integration_decoupling.sh
      # ci#423 step 4: the dependency-surface measurement and its baseline.
      - backend/scripts/integration_dep_surface.py
      # ci#423 step 4: the dependency-surface gate wrapper (baseline validation
      # always, measurement only when a Go workspace is materialized).
      - development/scripts/check_dep_surface_gate.sh
      - development/scripts/tests/test_integration_dep_surface_gate.sh
      - development/scripts/tests/test_integration_dep_surface.sh
      - development/scripts/check_host_surface.py
      - development/scripts/tests/test_host_surface.sh
      - integrations.host-surface.json
      - integrations.dep-surface.json
  workflow_dispatch:
    inputs:
      integration_repository:
        description: Integration repo to build
        required: false
        type: string
        default: msgmate-io/open-chat-go-msgmate-coder
      integration_ref:
        description: Integration ref to build (empty = default branch)
        required: false
        type: string
        default: ""
      workspace_path:
        description: Workspace-relative path the integration is built at
        required: false
        type: string
        default: clients/integrations/msgmate_coder_integration
      profile:
        description: Integration profile to materialize
        required: false
        type: string
        default: core-only
      run_tests:
        description: Run `go test ./...` in addition to build/vet/gofmt
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: validate the integration module CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The host-surface guard (ci#423) reads the integration-interface
      # submodule (`clients/go_integration_interface`), so check it out here;
      # the other steps in this job are submodule-free.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: bash syntax
        run: bash -n development/scripts/integration_module_ci.sh

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck development/scripts/integration_module_ci.sh

      - name: workflow yaml parses
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml

          for name in (
              ".github/workflows/reusable-integration-module-ci.yaml",
              ".github/workflows/integration-module-ci.yaml",
          ):
              doc = yaml.safe_load(pathlib.Path(name).read_text())
              assert doc.get("jobs"), f"{name}: no jobs"
              print(f"{name}: ok ({', '.join(doc['jobs'])})")
          PY

      # ci#423: the decoupling guard decides whether an integration is still
      # coupled to backend/...; its own outcomes are pinned hermetically.
      - name: decoupling guard self-test
        run: |
          python3 -m py_compile development/scripts/check_integration_decoupling.py
          bash development/scripts/tests/test_integration_decoupling.sh

      # ci#423 step 4: the dependency-surface delta (baseline) reporting decides
      # whether an integration regressed, so its outcomes are pinned
      # hermetically as well.
      - name: dependency-surface delta self-test
        run: |
          python3 -m py_compile backend/scripts/integration_dep_surface.py
          bash development/scripts/tests/test_integration_dep_surface.sh
          python3 -m py_compile development/scripts/check_host_surface.py
          bash development/scripts/tests/test_host_surface.sh
          python3 development/scripts/check_host_surface.py --baseline integrations.host-surface.json

      # The committed baseline is the record of which integrations are already
      # decoupled; validate it without a Go toolchain so a malformed or
      # wrongly-pinned baseline cannot silently neuter the gate.
      - name: dependency-surface baseline is valid
        run: |
          python3 backend/scripts/integration_dep_surface.py \
              --check-baseline integrations.dep-surface.json

      # ci#423 step 4: the PR gate itself. It is toolchain-free here (no GOWORK
      # in this job, so it validates the baseline and states that it only did
      # that) and its outcomes are pinned by the self-test next to it.
      - name: dependency-surface gate self-test
        run: |
          bash -n development/scripts/check_dep_surface_gate.sh
          bash development/scripts/tests/test_integration_dep_surface_gate.sh

      - name: dependency-surface gate (baseline validation only, no toolchain)
        run: |
          bash development/scripts/check_dep_surface_gate.sh --no-measure

  smoke:
    name: smoke build an integration module
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-integration-module-ci.yaml
    with:
      integration_repository: ${{ inputs.integration_repository }}
      integration_ref: ${{ inputs.integration_ref }}
      workspace_path: ${{ inputs.workspace_path }}
      profile: ${{ inputs.profile }}
      run_tests: ${{ inputs.run_tests }}
    secrets: inherit
