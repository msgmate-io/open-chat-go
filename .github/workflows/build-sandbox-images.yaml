name: Build Sandbox Images

# Builds and publishes a per-template development sandbox image used by the
# docker_sandbox integration (OCI_DOCKER_SANDBOX_<TEMPLATE>_IMAGE). The coding
# image is also produced by the sandbox benchmark/reusable workflows; this
# workflow is the canonical publisher for the Odoo template image that
# `integrations.docker_sandbox.odoo_sandbox_image` points at
# (ghcr.io/<repo>:sandbox-odoo-latest) and for the OpenCode-free `minimal`
# template image the native msgmate coder auto_sandbox uses
# (ghcr.io/<repo>:sandbox-minimal-latest, ci#465).
#
# Only manually dispatched (needs the private integration checkouts). Like every
# other operational change it must be run explicitly, with dry_run=true first to
# build without pushing.
#
# ci#807: the workflow publishes the sandbox *palette* per image. `template`
# selects a single image (or `all`), every selected template becomes its own
# matrix leg, so a publisher can build and push exactly one backend image
# without touching the others. PALETTE_TEMPLATES mirrors
# nativecoder.DefaultSandboxPalette (backend/nativecoder/sandboxpalette.go); a
# unit test keeps the two in sync.

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Sandbox template to build (all, minimal, coding, nix, android, vnc or odoo)"
        required: false
        default: all
      dry_run:
        description: Build without pushing (true) or push (false)
        required: false
        type: boolean
        default: true

concurrency:
  group: build-sandbox-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Mirror of nativecoder.DefaultSandboxPalette (ci#807);
  # backend/nativecoder/sandboxpalette_test.go fails if the two drift apart.
  PALETTE_TEMPLATES: "minimal coding nix android vnc odoo"

jobs:
  plan:
    name: Resolve sandbox palette leg
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.plan.outputs.templates }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Resolve the requested templates
        id: plan
        env:
          REQUESTED: ${{ inputs.template }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          PALETTE_TEMPLATES: ${{ env.PALETTE_TEMPLATES }}
        run: |
          set -euo pipefail
          REQUESTED="$(echo "${REQUESTED:-all}" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [ "${REQUESTED}" = "all" ] || [ -z "${REQUESTED}" ]; then
            SELECTED="${PALETTE_TEMPLATES}"
          else
            SELECTED=""
            for want in ${REQUESTED//,/ }; do
              want="$(echo "${want}" | xargs)"
              [ -z "${want}" ] && continue
              case " ${PALETTE_TEMPLATES} " in
                *" ${want} "*) ;;
                *) echo "::error::unknown sandbox template '${want}' (palette: ${PALETTE_TEMPLATES})"; exit 1 ;;
              esac
              SELECTED="${SELECTED} ${want}"
            done
          fi
          JSON="$(printf '%s\n' ${SELECTED} | sed '/^$/d' | sort | uniq | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "templates=${JSON}" >> "$GITHUB_OUTPUT"
          # Default to a no-push build unless the dispatcher explicitly asked to push.
          DRY_RUN="true"
          if [ "${DRY_RUN_INPUT}" = "false" ]; then DRY_RUN="false"; fi
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "sandbox palette legs: ${JSON} (dry_run=${DRY_RUN})"

  build:
    name: Build sandbox image (${{ matrix.template }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        template: ${{ fromJSON(needs.plan.outputs.templates) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Materialize integrations
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          BUILD_TOOLS="$(bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          "$BUILD_TOOLS" sync --frozen --profile full-ci

      - name: Resolve image tag from content hash
        id: image
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          set -euo pipefail
          SANDBOX_DIR="clients/integrations/docker_sandbox_integration/sandboxes/${TEMPLATE}"
          test -f "${SANDBOX_DIR}/Dockerfile" || { echo "::error::no Dockerfile for template ${TEMPLATE}"; exit 1; }
          HASH="$(find "${SANDBOX_DIR}" -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_url=ghcr.io/${IMAGE_REPO}:sandbox-${TEMPLATE}-${HASH}" >> "$GITHUB_OUTPUT"
          echo "latest_url=ghcr.io/${IMAGE_REPO}:sandbox-${TEMPLATE}-latest" >> "$GITHUB_OUTPUT"
          echo "sandbox ${TEMPLATE} image content hash: ${HASH}"

      - name: Login to GHCR
        if: needs.plan.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        if: needs.plan.outputs.dry_run == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push sandbox image
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          LATEST_URL: ${{ steps.image.outputs.latest_url }}
          TEMPLATE: ${{ matrix.template }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          SANDBOX_DIR="clients/integrations/docker_sandbox_integration/sandboxes/${TEMPLATE}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN: would build ${SANDBOX_DIR} -> ${IMAGE_URL} (+ ${LATEST_URL})"
            exit 0
          fi
          attempt=0
          until docker buildx build \
            --push \
            -f "${SANDBOX_DIR}/Dockerfile" \
            -t "${IMAGE_URL}" \
            -t "${LATEST_URL}" \
            "${SANDBOX_DIR}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::sandbox image build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "sandbox image build failed (attempt ${attempt}/3); retrying in 15s..." >&2
            sleep 15
          done

