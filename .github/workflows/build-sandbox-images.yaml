name: Build Sandbox Images

# Builds and publishes the per-variant development sandbox images used by the
# docker_sandbox integration (OCI_DOCKER_SANDBOX_<TEMPLATE>_IMAGE) and by the
# native msgmate coder auto_sandbox. Each variant maps to a directory under
# clients/integrations/docker_sandbox_integration/sandboxes/<variant>/ and is
# published individually as ghcr.io/<repo>:sandbox-<variant>-<hash> with a
# movable ghcr.io/<repo>:sandbox-<variant>-latest tag. The full palette of
# variants is authoritative in backend/nativecoder/sandboxpalette.go (ci#807).
#
# The Odoo template image that `integrations.docker_sandbox.odoo_sandbox_image`
# points at (ghcr.io/<repo>:sandbox-odoo-latest) and the OpenCode-free `minimal`
# template image the native msgmate coder auto_sandbox uses
# (ghcr.io/<repo>:sandbox-minimal-latest, ci#465) are produced here as well.
#
# Only manually dispatched (needs the private integration checkouts). Like every
# other operational change it must be run explicitly, with DRY_RUN=true first
# to build without pushing.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: Sandbox variants to build, comma separated, or "all" for the whole palette
        required: false
        default: all
      dry_run:
        description: Build without pushing (true) or push (false)
        required: false
        type: boolean
        default: true

concurrency:
  group: build-sandbox-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Keep in sync with backend/nativecoder/sandboxpalette.go (ci#807); the
# `resolve` job fails if a requested variant is not part of this set.
jobs:
  resolve:
    name: Resolve sandbox variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Build build matrix
        id: matrix
        env:
          REQUESTED: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          # Authoritative palette published by the native coder (ci#807).
          ALL="minimal coding frontend nix k8s odoo android vnc"
          REQUESTED="$(echo "${REQUESTED:-all}" | tr ',' ' ' | tr -s ' ')"
          if [ -z "${REQUESTED}" ] || [ "${REQUESTED}" = "all" ]; then
            REQUESTED="${ALL}"
          fi
          MATRIX="["
          FIRST=1
          for VARIANT in ${REQUESTED}; do
            SANDBOX_DIR="clients/integrations/docker_sandbox_integration/sandboxes/${VARIANT}"
            if [ ! -f "${SANDBOX_DIR}/Dockerfile" ]; then
              echo "::error::no Dockerfile for sandbox variant ${VARIANT} (${SANDBOX_DIR})"
              exit 1
            fi
            if [ "${FIRST}" -eq 0 ]; then
              MATRIX="${MATRIX},"
            fi
            MATRIX="${MATRIX}\"${VARIANT}\""
            FIRST=0
          done
          MATRIX="${MATRIX}]"
          echo "building sandbox variants: ${REQUESTED}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build sandbox image (${{ matrix.variant }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          submodules: recursive

      - name: Materialize integrations
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${{ secrets.BOT_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
          BUILD_TOOLS="$(bash "${GITHUB_WORKSPACE}/development/scripts/build_tools.sh")"
          "$BUILD_TOOLS" sync --frozen --profile full-ci

      - name: Resolve image tag from content hash
        id: image
        env:
          TEMPLATE: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          SANDBOX_DIR="clients/integrations/docker_sandbox_integration/sandboxes/${TEMPLATE}"
          test -f "${SANDBOX_DIR}/Dockerfile" || { echo "::error::no Dockerfile for template ${TEMPLATE}"; exit 1; }
          HASH="$(find "${SANDBOX_DIR}" -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
          IMAGE_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_url=ghcr.io/${IMAGE_REPO}:sandbox-${TEMPLATE}-${HASH}" >> "$GITHUB_OUTPUT"
          echo "latest_url=ghcr.io/${IMAGE_REPO}:sandbox-${TEMPLATE}-latest" >> "$GITHUB_OUTPUT"
          echo "sandbox ${TEMPLATE} image content hash: ${HASH}"

      - name: Login to GHCR
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_TOKEN || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        if: inputs.dry_run == false
        uses: docker/setup-buildx-action@v3

      - name: Build and push sandbox image
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          LATEST_URL: ${{ steps.image.outputs.latest_url }}
          TEMPLATE: ${{ matrix.variant }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SANDBOX_DIR="clients/integrations/docker_sandbox_integration/sandboxes/${TEMPLATE}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN: would build ${SANDBOX_DIR} -> ${IMAGE_URL} (+ ${LATEST_URL})"
            exit 0
          fi
          attempt=0
          until docker buildx build \
            --push \
            -f "${SANDBOX_DIR}/Dockerfile" \
            -t "${IMAGE_URL}" \
            -t "${LATEST_URL}" \
            "${SANDBOX_DIR}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::sandbox image build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "sandbox image build failed (attempt ${attempt}/3); retrying in 15s..." >&2
            sleep 15
          done
