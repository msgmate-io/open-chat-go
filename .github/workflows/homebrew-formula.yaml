name: Homebrew Formula Bump

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that holds the darwin assets (e.g. open-chat-0.0.620)
        required: true
      source_repository:
        description: Repository that hosts the release
        required: false
        default: msgmate-io/open-chat-go
      tap_repository:
        description: Homebrew tap repository to publish Formula/open-chat.rb into
        required: false
        default: msgmate-io/homebrew-tap
      bot_user:
        description: GitHub username that owns bot comments
        required: false
        default: cur1ousdude
      source_pr_number:
        description: Optional source PR number to annotate
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        description: Release tag that holds the darwin assets
        required: true
        type: string
      source_repository:
        description: Repository that hosts the release
        required: false
        type: string
        default: msgmate-io/open-chat-go
      tap_repository:
        description: Homebrew tap repository to publish Formula/open-chat.rb into
        required: false
        type: string
        default: msgmate-io/homebrew-tap
      bot_user:
        description: GitHub username that owns bot comments
        required: false
        type: string
        default: cur1ousdude
      source_pr_number:
        description: Optional source PR number to annotate
        required: false
        type: string
        default: ""
    secrets:
      BOT_TOKEN:
        required: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bump-homebrew:
    name: Bump open-chat Homebrew formula
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
          BOT_USER: ${{ inputs.bot_user }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::release_tag is required"
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "source_repository=${SOURCE_REPOSITORY:-msgmate-io/open-chat-go}" >> "$GITHUB_OUTPUT"
          echo "tap_repository=${TAP_REPOSITORY:-msgmate-io/homebrew-tap}" >> "$GITHUB_OUTPUT"
          echo "bot_user=${BOT_USER:-cur1ousdude}" >> "$GITHUB_OUTPUT"
          echo "source_pr_number=${SOURCE_PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Render and publish formula
        id: formula
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          SOURCE_REPOSITORY: ${{ steps.inputs.outputs.source_repository }}
          TAP_REPOSITORY: ${{ steps.inputs.outputs.tap_repository }}
        run: |
          set -euo pipefail
          set +e
          output="$(development/homebrew/render_formula.sh \
            --tag "${RELEASE_TAG}" \
            --repo "${SOURCE_REPOSITORY}" \
            --tap-repo "${TAP_REPOSITORY}" \
            --tap-path Formula/open-chat.rb \
            --message "open-chat ${RELEASE_TAG}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::Failed to render/publish Homebrew formula for ${RELEASE_TAG}"
            exit "${status}"
          fi
          version="$(printf '%s\n' "${output}" | sed -n 's/^  version:[[:space:]]*//p' | head -n1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Homebrew formula bump"
            echo ""
            echo "- Release: \`${{ steps.inputs.outputs.release_tag }}\`"
            echo "- Source: \`${{ steps.inputs.outputs.source_repository }}\`"
            echo "- Tap: \`${{ steps.inputs.outputs.tap_repository }}\`"
            echo "- Formula version: \`${{ steps.formula.outputs.version || 'unknown' }}\`"
            echo ""
            echo "Install on macOS 13+ (arm64/Intel):"
            echo ""
            echo '```sh'
            echo "brew install msgmate-io/tap/open-chat"
            echo "brew services start open-chat"
            echo "open-chat status"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate source PR
        if: ${{ steps.inputs.outputs.source_pr_number != '' }}
        env:
          SOURCE_REPOSITORY: ${{ steps.inputs.outputs.source_repository }}
          SOURCE_PR_NUMBER: ${{ steps.inputs.outputs.source_pr_number }}
          BOT_USER: ${{ steps.inputs.outputs.bot_user }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          TAP_REPOSITORY: ${{ steps.inputs.outputs.tap_repository }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          Homebrew formula updated from \`${RELEASE_TAG}\` (open-chat ${VERSION:-unknown}).

          \`\`\`sh
          brew install ${TAP_REPOSITORY%/*}/tap/open-chat
          brew services start open-chat
          open-chat status
          \`\`\`

          <!-- open-chat-homebrew-formula -->
          EOF
          )"
          payload="$(jq -n --arg body "$body" '{body: $body}')"

          comment_id="$({
            curl -fsSL \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/${SOURCE_PR_NUMBER}/comments" \
              | jq -r --arg bot_user "${BOT_USER}" '[.[] | select(.user.login == $bot_user and (.body | contains("<!-- open-chat-homebrew-formula -->")))][0].id // ""'
          })"

          if [ -n "${comment_id}" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/comments/${comment_id}" \
              -d "${payload}" >/dev/null
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/issues/${SOURCE_PR_NUMBER}/comments" \
              -d "${payload}" >/dev/null
          fi