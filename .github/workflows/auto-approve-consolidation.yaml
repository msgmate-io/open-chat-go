name: Auto-approve consolidation PRs

# ci#538: let a green `chore/consolidate-*` PR merge autonomously.
#
# A consolidation PR is the single batch-verification PR against `main` and is
# always authored by the automation identity (`cur1ousdude`), which cannot
# approve its own PR.
#
# ci#833 (dev trunk): consolidation PRs (`chore/consolidate-*`) now target the
# `dev` integration trunk with `test,e2e` only and must never deploy; the
# `main <- dev` promotion PR (head `dev`, base `main`, labels
# `test,e2e,deploy,sandbox-test`) is the release hop whose merge deploys
# ci.msgmate.io. This workflow therefore accepts exactly two PR shapes:
#   * `chore/consolidate-*` -> `dev`  (integration, no deployment), and
#   * `dev`                 -> `main` (promotion, the only deploying hop),
# plus the historical `chore/consolidate-*` -> `main` shape. Both `dev`
# ("Dev (Integration) Merge Protection", required check only) and `main` block
# the merge until the required `Run PR CI Tests and Deployments` check is green;
# the verified-green precondition below is unchanged. This workflow posts the one required approving review on
# behalf of a *distinct* reviewer identity once the required PR CI run has
# finished successfully, and then merges the PR.
#
# Scope is deliberately narrow: only `chore/consolidate-*` PRs in this
# repository, only when the PR is open, not a draft, targeting `main`, and only
# after the required PR CI run concluded success.
#
# ci#538 merge half (this revision): approving alone was not enough, because the
# `main` ruleset ("Main (Staging) Merge Protection", 1 required approving review,
# no bypass actors) also blocks the merge itself and `workflow_run` only fires
# from the default branch, so every green consolidation PR still waited for a
# human click. The job therefore also *merges*, but only after it has verified
# from the API that every check on the PR finished green and that the required
# `Run PR CI Tests and Deployments` check concluded `success`. When the approval
# could be posted, the merge is a normal merge (the ruleset's own gates still
# apply). When no usable reviewer identity is configured, the merge is retried
# with `--admin`, i.e. the ruleset is bypassed by the credential that is allowed
# to bypass it — the green verification above (not branch protection) is then
# the gate, so the PR is never merged with failing or pending checks.
#
# ci#538 follow-up hardening (kept):
#   * a configured-but-unusable `CONSOLIDATE_APPROVER_TOKEN` is reported as the
#     admin configuration bug it is (`gh api user` preflight; the API error text
#     is no longer mistaken for a PR number);
#   * PR references are validated as numbers before they are used;
#   * the review step is idempotent: a PR that already carries an approving
#     review from the acting identity is left alone and counts as success,
#     instead of a duplicate-review failure (GitHub answers `422` when the same
#     reviewer submits a second review, which happened on every re-run of a
#     green PR);
#   * the merge step is idempotent: an already merged PR counts as success, and a
#     PR that is merely `BEHIND` gets its branch updated (which re-triggers CI
#     and this workflow) instead of failing.
#
# ci#1066: the approval half cannot be produced at all until a write-access
# approver identity is configured (`CONSOLIDATE_APPROVER_TOKEN`) or the `main`
# ruleset gains a bypass actor: a `github.token` approval is not "a review from a
# reviewer with write access", and the promotion PR's author cannot approve its
# own PR. Choosing approval-vs-bypass is a maintainer security decision, so the
# preflight *classifies* the blocker instead of guessing (the classification is
# symmetric with ci#1067: every credential state that cannot post an approval is
# named and reported as "awaiting a maintainer merge", so a red auto-approve run
# keeps meaning "a real regression"):
#   * token rejected (HTTP 401)            -> `token_rejected`, reported/awaiting;
#   * token accepted but without write access (`repos.permissions.push` false)
#                                          -> `token_unprivileged`, reported/awaiting;
#   * token missing                        -> warn, let the review call decide.
# A `dev` -> `main` promotion PR that is green and only lacks the approval gets a
# `::notice::Awaiting maintainer merge (ci#1066)` plus *one* idempotent comment
# explaining how to re-enable the automated hop.
#
# Required admin step (one of, see DEVELOPMENT.md):
#   * Preferred: create a dedicated reviewer identity (GitHub App or a
#     fine-grained PAT with `pull_requests: write`) and store its token as the
#     repository secret `CONSOLIDATE_APPROVER_TOKEN`. This keeps the reviewer
#     distinct from the PR author and lets the merge proceed without a ruleset
#     bypass. Give the same identity bypass permission on the `main` ruleset (or
#     an admin role) if it should also drive the `--admin` fallback.
#   * Or: enable repository setting *Actions > General > "Allow GitHub Actions to
#     create and approve pull requests"* so the fallback `github.token`
#     (identity `github-actions[bot]`) may approve.
#   * Or: add a ruleset bypass actor for the consolidation automation, so the
#     `--admin` fallback works with `github.token`.
# If none is configured, the run warns, approves/merges with whatever permission
# it has (the `--admin` attempt then fails and the PR stays open), and a human
# still has to approve and merge.

on:
  workflow_run:
    workflows:
      - "Run PR CI Tests and Deployments"
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to approve and merge (manual escape hatch)"
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: auto-approve-consolidation-${{ github.event.workflow_run.head_branch || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve and merge green consolidation PR
    runs-on: ubuntu-latest
    # ci#833: the candidate PRs are resolved from the triggering commit (see the
    # resolver step) and re-validated in the merge step, so the run-level gate is
    # `same-repository pull_request run that concluded successfully`. It covers
    # `chore/consolidate-*` -> `dev`/`main` and the `dev` -> `main` promotion PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Resolve candidate PRs
        id: prs
        env:
          GH_TOKEN: ${{ secrets.CONSOLIDATE_APPROVER_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # The dispatch input reaches this shell; never interpolate it into
            # the script (ci#538 review). Require a plain number and pass it
            # through the environment instead.
            case "$PR_NUMBER_INPUT" in
              ''|*[!0-9]*)
                echo "::error::pr_number must be a positive integer."
                exit 1
                ;;
            esac
            echo "prs=${PR_NUMBER_INPUT}" >> "$GITHUB_OUTPUT"
            echo "Resolved manual PR #${PR_NUMBER_INPUT}."
            exit 0
          fi

          head_sha="${{ github.event.workflow_run.head_sha }}"
          # PRs whose head is this commit, restricted to the two sanctioned
          # shapes in this repository (ci#833):
          #   * chore/consolidate-* -> dev   (integration consolidation, no deploy)
          #   * chore/consolidate-* -> main  (historical shape, still supported)
          #   * dev                 -> main  (release promotion, deploys ci.msgmate.io)
          #
          # ci#538: pull the payload into a variable and run jq separately instead
          # of `gh api --jq`. On an API failure (eg a bad token) `--jq` used to
          # write the *error* JSON to stdout, which then became the "PR number"
          # list. Capture the exit status and fail loudly instead.
          # ci#830: the `GET /repos/{repo}/commits/{sha}/pulls` endpoint
          # intermittently answers HTTP 200 with an empty or truncated body for
          # this repository (reproduced 2 of 3 calls: ~1.2 kB of headers, no
          # JSON). That surfaced here as "unexpected end of JSON input" followed
          # by a misleading "API/credentials" failure, which blocked an
          # otherwise green consolidation PR and starved `auto-approve`. Retry
          # the call a bounded number of times, then fall back to listing the
          # open consolidation PRs and matching the triggering head commit.
          pulls_json=""
          for attempt in 1 2 3; do
            candidate="$(gh api --paginate \
                 "repos/${{ github.repository }}/commits/${head_sha}/pulls" \
                 2>/dev/null)" || candidate=""
            # An empty array is a legitimate answer (the head commit is not a
            # PR head yet); a truncated/empty body, an error object or `null`
            # means the call was flaky. `gh api --paginate` emits one JSON
            # document per page, so slurp the documents and flatten them with
            # `add`: a single-page answer is unchanged, a multi-page answer
            # (`[...][...]`, which is not one valid JSON document) becomes one
            # array, and anything that is not a non-empty list of arrays is
            # rejected and retried.
            if normalized="$(printf '%s' "$candidate" |
                 jq -ces 'if length > 0 and all(type == "array") then add else empty end' \
                 2>/dev/null)"; then
              pulls_json="$normalized"
              break
            fi
            echo "::warning::Listing the PRs for ${head_sha} (attempt ${attempt}/3) returned no usable payload (ci#830)."
            sleep "$((attempt * 5))"
          done

          if [ -z "$pulls_json" ]; then
            echo "::warning::Falling back to the pull listing to resolve the PR for ${head_sha}."
            fallback_json="$(gh pr list --repo "${{ github.repository }}" \
              --state open --base main --limit 100 \
              --json number,headRefName,headRefOid 2>/dev/null || true)"
            pulls_json="$(jq -c --arg sha "$head_sha" --arg repo "${{ github.repository }}" \
              '[ .[]?
                 | select(.headRefOid == $sha)
                 | select(.headRefName | startswith("chore/consolidate-"))
                 | { number: .number,
                     base: { ref: "main" },
                     head: { ref: .headRefName, repo: { full_name: $repo } } } ]' \
              <<< "${fallback_json:-[]}" 2>/dev/null || true)"
            if [ -z "$pulls_json" ]; then
              echo "::error::Failed to list the PRs for ${head_sha} (API/credentials)."
              exit 1
            fi
          fi
          if ! numbers_raw="$(
            printf '%s' "$pulls_json" \
              | jq -r '.[] | select(.head.repo.full_name == "${{ github.repository }}")
                            | select(
                                ((.base.ref == "main" or .base.ref == "dev")
                                 and (.head.ref | startswith("chore/consolidate-")))
                                or (.base.ref == "main" and .head.ref == "dev")
                              )
                            | .number'
          )"; then
            echo "::error::Could not parse the PR listing for ${head_sha}."
            exit 1
          fi

          numbers=()
          while IFS= read -r number; do
            [ -z "$number" ] && continue
            case "$number" in
              ''|*[!0-9]*)
                echo "::error::Unexpected non-numeric PR reference: ${number}"
                exit 1
                ;;
            esac
            numbers+=("$number")
          done <<< "$numbers_raw"

          if [ "${#numbers[@]}" -eq 0 ]; then
            echo "No consolidation PR found for ${head_sha}; nothing to approve."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          joined="$(IFS=,; echo "${numbers[*]}")"
          echo "prs=${joined}" >> "$GITHUB_OUTPUT"
          echo "Consolidation PRs for ${head_sha}: ${joined}"

      # ci#1066: the `main` review requirement can be *masked* rather than
      # satisfied. While `Main (Staging) Merge Protection` is disabled the
      # promotion PR merges unattended, so a green hop proves nothing about the
      # write-access approval the ruleset demands once it is re-enabled. This
      # step classifies the live protection state before anything merges and
      # names which of the three remediation paths (approver token / bypass
      # actor / re-enable the ruleset) is still missing. Reporting only: it never
      # fails the run (a red auto-approve run must keep meaning "regression").
      - name: Preflight main merge protection (ci#1066)
        id: protection
        if: ${{ steps.prs.outputs.prs != '' }}
        env:
          GH_TOKEN: ${{ secrets.CONSOLIDATE_APPROVER_TOKEN || github.token }}
          HAS_APPROVER_TOKEN: ${{ secrets.CONSOLIDATE_APPROVER_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          : > "$tmpdir/rulesets.jsonl"
          : > "$tmpdir/details.jsonl"

          # The rules actually enforced on `refs/heads/main` right now. An empty
          # array means the review requirement is not enforced at all, which is
          # exactly the ci#1066 masking state - not a fix.
          rules_state="ok"
          rules_json=""
          if raw="$(gh api "repos/${REPO}/rules/branches/main" 2>/dev/null)"; then
            if ! rules_json="$(printf '%s' "$raw" |
                 jq -ce 'if type == "array" then . else empty end' 2>/dev/null)"; then
              rules_state="unreadable"
              rules_json=""
            fi
          else
            rules_state="unreadable"
            rules_json=""
          fi

          # Enforcement + bypass actors live on the ruleset resource, not in the
          # effective-rules answer, so resolve the branch-targeted rulesets.
          if raw="$(gh api "repos/${REPO}/rulesets" 2>/dev/null)"; then
            printf '%s' "$raw" |
              jq -c '.[]? | select((.target // "branch") == "branch") | {id: .id}' \
                >> "$tmpdir/rulesets.jsonl" 2>/dev/null || true
          fi
          for id in $(jq -r '.id' < "$tmpdir/rulesets.jsonl" 2>/dev/null); do
            case "$id" in ''|*[!0-9]*) continue ;; esac
            if detail="$(gh api "repos/${REPO}/rulesets/${id}" 2>/dev/null)"; then
              printf '%s' "$detail" | jq -c --argjson id "$id" '{
                id: $id,
                name: (.name // ""),
                enforcement: (.enforcement // "unknown"),
                bypass_actors: ((.bypass_actors // []) | length),
                review_count: ([ (.rules // [])[]?
                  | select(.type == "pull_request")
                  | (.parameters.required_approving_review_count // 0) ] | max // 0),
                covers_main: ([ (.conditions.ref_name.include // [])[]? | tostring ]
                  | any(test("refs/heads/(main|~DEFAULT_BRANCH)$")))
              }' >> "$tmpdir/details.jsonl" 2>/dev/null || true
            fi
          done

          details_json="$(jq -cs '.' "$tmpdir/details.jsonl" 2>/dev/null || echo '[]')"
          [ -n "$details_json" ] || details_json='[]'
          review_count="$(printf '%s' "$rules_json" |
            jq -r '[ .[]? | select(.type == "pull_request")
                     | (.parameters.required_approving_review_count // 0) ]
                   | max // 0' 2>/dev/null || echo 0)"
          case "$review_count" in ''|*[!0-9]*) review_count=0 ;; esac
          bypass_total="$(printf '%s' "$details_json" |
            jq -r '[ .[]? | select(.covers_main == true) | (.bypass_actors // 0) ]
                   | add // 0' 2>/dev/null || echo 0)"
          protection_line="$(printf '%s' "$details_json" |
            jq -r '[ .[]? | select(.covers_main == true)
                     | select((.name // "") | test("Main \\(Staging\\) Merge Protection")) ]
                   | if length > 0 then
                       (.[0] | .name + " (ruleset " + (.id | tostring) + ", enforcement "
                              + .enforcement + ", bypass actors "
                              + (.bypass_actors | tostring) + ")")
                     else "no active branch ruleset for refs/heads/main" end' \
            2>/dev/null || echo "unknown")"

          if [ "$rules_state" != "ok" ]; then
            protection_state="protection_unknown"
            echo "::warning::Could not read the merge protection for \`main\` (rules API); the live review requirement is unknown in this run (ci#1066)."
          elif [ "$review_count" -ge 1 ]; then
            protection_state="review_required_enforced"
            echo "::notice::\`main\` enforces ${review_count} approving review(s): the promotion hop needs a write-access approver identity (CONSOLIDATE_APPROVER_TOKEN) or a ruleset bypass actor, otherwise it awaits a maintainer merge (ci#1066)."
          else
            protection_state="review_required_masked"
            echo "::warning::\`main\` enforces no approving review - the 'Main (Staging) Merge Protection' ruleset is not active. A green promotion PR therefore merges unattended *because the gate is off*, which masks ci#1066 instead of satisfying it. Re-enable the ruleset only after issuing CONSOLIDATE_APPROVER_TOKEN for a write-access identity or registering a bypass actor for the automation identity."
          fi

          {
            echo ""
            echo "### Main merge protection (ci#1066)"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| State | \`${protection_state}\` |"
            echo "| Required approving reviews on \`main\` | ${review_count} |"
            echo "| Governing ruleset | ${protection_line} |"
            echo "| Bypass actors on the \`main\` ruleset(s) | ${bypass_total} |"
            echo "| \`CONSOLIDATE_APPROVER_TOKEN\` configured | ${HAS_APPROVER_TOKEN:-false} |"
            echo ""
            if [ "$protection_state" = "review_required_masked" ]; then
              echo "The unattended hop works only because the review requirement is **not enforced**. With the ruleset re-enabled, the hop needs one of: an approver token for a write-access identity, a bypass actor for the automation identity, or a maintainer merge."
              echo ""
            fi
          } >> "$summary" 2>/dev/null || true
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "state=${protection_state}" >> "$GITHUB_OUTPUT"
            echo "review_count=${review_count}" >> "$GITHUB_OUTPUT"
          fi
          echo "Main merge protection: ${protection_state} (required approving reviews: ${review_count}; ${protection_line})."
          exit 0

      - name: Approve and merge
        if: ${{ steps.prs.outputs.prs != '' }}
        env:
          GH_TOKEN: ${{ secrets.CONSOLIDATE_APPROVER_TOKEN || github.token }}
          HAS_APPROVER_TOKEN: ${{ secrets.CONSOLIDATE_APPROVER_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
          PRS: ${{ steps.prs.outputs.prs }}
          RUN_URL: ${{ github.event.workflow_run.html_url || 'manual dispatch' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          REPO="$REPOSITORY"

          # ci#1067: the two credential outcomes are distinguished and *named*,
          # so a red auto-approve run always means "something is broken" and
          # never "a human has to click approve".
          #   token_rejected - CONSOLIDATE_APPROVER_TOKEN is configured but the
          #                    API refuses it (HTTP 401 / no resolvable `/user`):
          #                    a maintainer must re-issue the reviewer identity
          #                    token (ci#1066). The run states it, reports the
          #                    PRs as awaiting a maintainer merge and exits 0
          #                    *before* the PR loop - every `gh pr view` would
          #                    fail with the same 401 and be misreported as an
          #                    unreadable PR.
          #   token_missing  - no approver token and no resolvable fallback
          #                    identity: warn, keep going and let the review call
          #                    be the authoritative check.
          #   token_unprivileged - ci#1066: the token resolves to an identity but
          #                    that identity has no write access to this
          #                    repository (`repos.permissions.push` false), so its
          #                    approval can never satisfy the `main` ruleset
          #                    ("1 approving review by reviewers with write
          #                    access"). Same treatment as `token_rejected`: name
          #                    it, report the PRs as awaiting a maintainer merge
          #                    and exit 0 before the PR loop.
          credential_state=""
          approver_ready="false"
          reviewer="$(gh api user --jq '.login' 2>/dev/null || true)"
          if [ -z "$reviewer" ] || [ "$reviewer" = "null" ]; then
            reviewer=""
            if [ "$HAS_APPROVER_TOKEN" = "true" ]; then
              credential_state="token_rejected"
            else
              credential_state="token_missing"
              echo "::warning::No CONSOLIDATE_APPROVER_TOKEN configured and no resolvable fallback identity; falling back to github.token. This only works when Actions are allowed to approve PRs or the ruleset has a bypass actor for it."
            fi
          elif [ "$HAS_APPROVER_TOKEN" = "true" ]; then
            # ci#1066: a resolvable identity is not enough - the `main` ruleset
            # only accepts an approval from a reviewer *with write access*.
            can_write="$(gh api "repos/${REPO}" --jq '.permissions.push // false' 2>/dev/null || true)"
            case "$can_write" in
              true)
                approver_ready="true"
                echo "Approver identity '${reviewer}' has write access to ${REPO}."
                ;;
              '')
                # Some installation tokens cannot report repository permissions;
                # the review call is the authoritative check for them (ci#538).
                approver_ready="true"
                echo "::warning::Could not verify whether '${reviewer}' has write access to ${REPO}; the review call is the authoritative check."
                ;;
              *)
                credential_state="token_unprivileged"
                ;;
            esac
          fi

          # ci#1067: green PRs that only lack the write-access approval are
          # collected here and reported in the job summary instead of failing
          # the run.
          awaiting=()
          add_awaiting() {
            awaiting+=("PR #$1 - $2")
            echo "::notice::PR #$1 is green but needs a maintainer merge ($2)."
          }
          write_summary() {
            [ "${#awaiting[@]}" -gt 0 ] || return 0
            [ -n "${GITHUB_STEP_SUMMARY:-}" ] || return 0
            {
              echo "### Auto-approve: ${#awaiting[@]} green PR(s) awaiting a maintainer merge"
              echo
              for entry in ${awaiting[@]+"${awaiting[@]}"}; do
                echo "- ${entry}"
              done
              echo
              echo "The required checks are green. No approval could be posted by the automation"
              echo "identity, so a reviewer with write access has to approve and merge - or a"
              echo "maintainer has to fix the reviewer identity (ci#1066). This run is green: a red"
              echo "auto-approve run means a real regression."
              echo
              echo "Run: ${RUN_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # ci#1066: both unusable-credential states are reported the same way -
          # the identity cannot post an approval the `main` ruleset accepts, so
          # the PR(s) are named as awaiting a maintainer merge and the run stays
          # green. Only the actionable text differs.
          case "$credential_state" in
            token_rejected)
              echo "CONSOLIDATE_APPROVER_TOKEN is set but rejected by the API (HTTP 401 / no resolvable /user): no approval can be posted until the reviewer identity token is re-issued (ci#1066)."
              echo "::notice::CONSOLIDATE_APPROVER_TOKEN was rejected by the API; the PR(s) are left to a maintainer merge. Re-issue the reviewer identity token (ci#1066)."
              reason="token rejected"
              ;;
            token_unprivileged)
              echo "CONSOLIDATE_APPROVER_TOKEN is accepted as '${reviewer}' but that identity has no write access to ${REPO} (repos.permissions.push is false), so its approval cannot satisfy the '1 approving review by reviewers with write access' ruleset (ci#1066)."
              echo "::notice::CONSOLIDATE_APPROVER_TOKEN belongs to '${reviewer}', which has no write access to ${REPO}; its approval cannot satisfy the main ruleset, so the PR(s) are left to a maintainer merge. Re-issue the token for a write-access identity (ci#1066)."
              reason="approver lacks write access"
              ;;
            *)
              reason=""
              ;;
          esac
          if [ -n "$reason" ]; then
            IFS=',' read -ra blocked_numbers <<< "$PRS"
            for number in ${blocked_numbers[@]+"${blocked_numbers[@]}"}; do
              case "$number" in
                ''|*[!0-9]*) continue ;;
              esac
              add_awaiting "$number" "$reason"
            done
            write_summary
            echo "Skipping the PR loop: the acting identity cannot post an approval the ruleset accepts, so every merge attempt would fail the same way and be misreported as an unreadable PR."
            exit 0
          fi
          echo "Acting as '${reviewer:-unknown}' (credential: ${credential_state:-usable}, write-access approver identity: ${approver_ready})."

          failures=0

          # ci#538: merge only what is provably green. The checks are read from
          # the API (not from the triggering run) so a re-run of this workflow
          # cannot merge a PR whose checks later failed.
          #
          # ci#847: GitHub keeps a *newest-per-context* semantics for branch
          # protection: when a run is superseded (a re-run, or a push that
          # cancels the in-flight run), the superseded instance is reported as
          # CANCELLED next to the green replacement. Reading the raw rollup made
          # this gate veto a fully green consolidation PR forever, because the
          # dead CANCELLED instance was still in the list. Collapse the rollup
          # onto the newest instance per (context, app) *before* deciding, the
          # same way the Go required-check resolver does (see
          # backend/nativecoder/requiredchecks.go). The newest instance is
          # ordered by the later of completed_at/started_at (a skipped run can
          # complete *before* it starts), then by the workflow-run id parsed out
          # of details_url.
          JQ_NEWEST_CHECKS='
            def newest:
              [ .statusCheckRollup[]?
                | . + { _name: (.name // .context // "unknown"),
                        _app: ((.app.id // 0) | tostring),
                        _rank: ((.detailsUrl // "")
                                | if test("actions/runs/[0-9]+")
                                  then (capture("actions/runs/(?<id>[0-9]+)").id | tonumber)
                                  else 0 end),
                        _ts: (([.completedAt, .startedAt, .createdAt, .updatedAt]
                                | map(select(. != null and . != "")) | max) // "") } ]
              | group_by([._name, ._app])
              | map(max_by([._ts, ._rank]));'

          failing_or_pending() {
            jq -r "$JQ_NEWEST_CHECKS"'
              [ newest[]
                | select(
                    ((.status // "") | test("^(QUEUED|IN_PROGRESS|PENDING|WAITING|REQUESTED)$"))
                    or ((.conclusion // "") | test("^(FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE|STALE)$"))
                    or ((.state // "") | test("^(FAILURE|ERROR|PENDING)$"))
                  )
                | (.name // .context // "unknown") ] | join(", ")'
          }
          required_ci_green() {
            jq -r "$JQ_NEWEST_CHECKS"'
              [ newest[]
                | select((.name // .context // "") == "Run PR CI Tests and Deployments")
                | select((.conclusion // .state // "") == "SUCCESS") ] | length'
          }

          # ci#1067: a ruleset refusal ("At least 1 approving review is required
          # by reviewers with write access", GraphQL "Repository rule
          # violations found") is classified and reported instead of being
          # retried: retrying a refusal cannot change it, and the PR is green -
          # only a write-access approval is missing.
          approval_rule_violation() {
            local output="$1"
            printf '%s' "$output" \
              | grep -qiE 'approving review|review is required by reviewers with write access'
          }

          attempt_merge() {
            local admin_flag="$1"
            local try output
            for try in 1 2 3; do
              # shellcheck disable=SC2086
              if output="$(gh pr merge "$number" --repo "$REPO" --merge $admin_flag 2>&1)"; then
                return 0
              fi
              printf '%s\n' "$output"
              # ci#1067: a ruleset refusal cannot be changed by retrying; hand
              # the PR to a maintainer instead of sleeping and re-trying.
              if approval_rule_violation "$output"; then
                echo "::warning::PR #${number} is blocked by the review rule only (write-access approval required); not retrying the merge."
                return 2
              fi
              echo "Merge attempt ${try} failed; re-checking state."
              sleep 10
              state="$(gh pr view "$number" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo '')"
              [ "$state" = "MERGED" ] && return 0
            done
            return 1
          }

          IFS=',' read -ra numbers <<< "$PRS"
          for number in "${numbers[@]}"; do
            case "$number" in
              ''|*[!0-9]*)
                echo "::error::Unexpected non-numeric PR reference: ${number}"
                failures=$((failures + 1))
                continue
                ;;
            esac
            echo "::group::PR #${number}"

            pr_json="$(gh pr view "$number" --repo "$REPO" \
              --json state,isDraft,baseRefName,headRefName,author,mergeable,mergeStateStatus,reviewDecision,reviews,statusCheckRollup \
              2>/dev/null || true)"
            if [ -z "$pr_json" ]; then
              echo "::error::Could not read PR #${number}."
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            state="$(jq -r '.state' <<< "$pr_json")"
            if [ "$state" = "MERGED" ]; then
              echo "PR #${number} is already merged; nothing to do."
              echo "::endgroup::"
              continue
            fi
            if [ "$state" != "OPEN" ]; then
              echo "::warning::PR #${number} is ${state}; skipping."
              echo "::endgroup::"
              continue
            fi
            if [ "$(jq -r '.isDraft' <<< "$pr_json")" = "true" ]; then
              echo "::warning::PR #${number} is a draft; skipping."
              echo "::endgroup::"
              continue
            fi
            # Defence in depth: the resolver already restricted the candidates,
            # but the merge decision must not depend on that alone.
            base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
            head_ref="$(jq -r '.headRefName' <<< "$pr_json")"
            allowed_shape=false
            if [[ "$head_ref" == chore/consolidate-* ]] && \
               { [ "$base_ref" = "main" ] || [ "$base_ref" = "dev" ]; }; then
              allowed_shape=true
              # ci#833: a consolidation PR against dev is the integration hop and
              # must never carry a deployment label; the promotion PR deploys.
              if [ "$base_ref" = "dev" ]; then
                stray_labels="$(gh pr view "$number" --repo "$REPO" --json labels \
                  --jq '[.labels[].name | select(. == "deploy" or . == "sandbox-test")] | join(", ")' \
                  2>/dev/null || echo '')"
                if [ -n "$stray_labels" ]; then
                  echo "::warning::PR #${number} targets dev but carries deployment label(s) ${stray_labels}; not merging a dev consolidation that would deploy."
                  echo "::endgroup::"
                  continue
                fi
              fi
            elif [ "$base_ref" = "main" ] && [ "$head_ref" = "dev" ]; then
              # ci#833: the release promotion hop; this merge deploys ci.msgmate.io.
              allowed_shape=true
            fi
            if [ "$allowed_shape" != "true" ]; then
              echo "::warning::PR #${number} (${head_ref} -> ${base_ref}) is not an accepted consolidation/promotion shape; skipping."
              echo "::endgroup::"
              continue
            fi

            author="$(jq -r '.author.login // ""' <<< "$pr_json")"

            bad_checks="$(failing_or_pending <<< "$pr_json")"
            if [ -n "$bad_checks" ]; then
              echo "::warning::PR #${number} is not green (${bad_checks}); not merging."
              echo "::endgroup::"
              continue
            fi
            if [ "$(required_ci_green <<< "$pr_json")" -lt 1 ]; then
              echo "::warning::PR #${number} has no successful 'Run PR CI Tests and Deployments' check; not merging."
              echo "::endgroup::"
              continue
            fi

            merge_state="$(jq -r '.mergeStateStatus // ""' <<< "$pr_json")"
            if [ "$merge_state" = "BEHIND" ]; then
              # Strict required status checks demand an up-to-date branch. Update
              # it and let the resulting CI run re-enter this workflow.
              echo "PR #${number} is behind main; updating the branch and stopping here."
              if gh api --method PUT "repos/${REPO}/pulls/${number}/update-branch" >/dev/null; then
                echo "Branch of PR #${number} updated."
              else
                echo "::error::Could not update the branch of PR #${number}."
                failures=$((failures + 1))
              fi
              echo "::endgroup::"
              continue
            fi
            if [ "$merge_state" = "DIRTY" ]; then
              echo "::error::PR #${number} has conflicts with main; a human must resolve them."
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            # Review step (idempotent, non-fatal): a self-authored PR cannot be
            # approved by its author, and a missing/duplicate review is not an
            # error as long as the merge succeeded afterwards.
            approved="false"
            # ci#1067: why a *green* PR may still need a human, reported in the
            # job summary instead of failing the run.
            blocked_reason="review not accepted"
            if [ -n "$reviewer" ] && [ "$reviewer" = "$author" ]; then
              echo "PR #${number} is authored by '${reviewer}'; cannot self-approve, relying on the ruleset bypass for the merge."
              blocked_reason="self-authored"
            else
              existing_approvers="$(jq -r '.reviews[]? | select(.state == "APPROVED") | .author.login' <<< "$pr_json" 2>/dev/null || true)"
              if [ -n "$reviewer" ] && grep -qxF "$reviewer" <<< "$existing_approvers"; then
                echo "PR #${number} is already approved by '${reviewer}'."
                approved="true"
              elif gh pr review "$number" --repo "$REPO" --approve \
                     --body "Auto-approved: the required PR CI run (${RUN_URL}) succeeded and this is a consolidation PR (ci#538)." 2>/dev/null; then
                echo "Approved PR #${number} as '${reviewer:-unknown}'."
                approved="true"
              else
                echo "::warning::Could not post an approving review on PR #${number} (missing reviewer identity or permission); trying the ruleset bypass for the merge."
                if [ "$credential_state" = "token_missing" ]; then
                  blocked_reason="token missing"
                else
                  blocked_reason="review post failed"
                fi
              fi
            fi

            # ci#1067: at most one merge attempt per path (plain, then
            # `--admin`), and a ruleset refusal ends the path immediately - an
            # `approval_rule_violation` is never retried with a 10s backoff.
            merged="false"
            rule_blocked="false"
            if [ "$approved" = "true" ]; then
              merge_rc=0
              attempt_merge "" || merge_rc=$?
              if [ "$merge_rc" -eq 0 ]; then
                merged="true"
                echo "Merged PR #${number}."
              elif [ "$merge_rc" -eq 2 ]; then
                rule_blocked="true"
              fi
            fi
            if [ "$merged" != "true" ]; then
              merge_rc=0
              attempt_merge "--admin" || merge_rc=$?
              if [ "$merge_rc" -eq 0 ]; then
                merged="true"
                echo "Merged PR #${number} with --admin (ruleset bypass); green checks were verified above."
              elif [ "$merge_rc" -eq 2 ]; then
                rule_blocked="true"
              fi
            fi
            if [ "$merged" != "true" ]; then
              if [ "$rule_blocked" = "true" ]; then
                # The PR is green; only the write-access approval is missing.
                # Hand it to a maintainer and keep the run green.
                # ci#1066: the `dev` -> `main` promotion hop is the one PR a
                # maintainer has to merge by hand in this state, so the status is
                # also stated *in the PR* (a notice plus exactly one comment) -
                # a job summary of a past run is not where a maintainer looks.
                # Idempotent: the comment is posted at most once per PR.
                if [ "$base_ref" = "main" ] && [ "$head_ref" = "dev" ]; then
                  echo "::notice::PR #${number} (${head_ref} -> ${base_ref}) is green and verified, but merging it needs an approving review from a write-access identity, which this automation cannot post (no CONSOLIDATE_APPROVER_TOKEN for a write-access identity and no working ruleset bypass actor for the acting identity). Awaiting maintainer merge (ci#1066)."
                  awaiting_note="Awaiting maintainer merge (ci#1066): every required check on this \`dev\` -> \`main\` promotion PR is green and was verified via the API, but the \`main\` ruleset requires an approving review from a reviewer with write access and this workflow acts without a write-access approver identity (\`CONSOLIDATE_APPROVER_TOKEN\` is unset, unusable or unprivileged, and no ruleset bypass actor is registered for it). A maintainer can merge this PR as-is; configuring the approver token for a write-access identity or a bypass actor re-enables the automated promotion hop."
                  existing_note="$(gh pr view "$number" --repo "$REPO" --json comments \
                    --jq '[.comments[]?.body | select(contains("Awaiting maintainer merge (ci#1066)"))] | length' \
                    2>/dev/null || echo 0)"
                  if [ "${existing_note:-0}" = "0" ]; then
                    gh pr comment "$number" --repo "$REPO" --body "$awaiting_note" >/dev/null 2>&1 \
                      || echo "::warning::Could not post the awaiting-maintainer-merge note on PR #${number}."
                  else
                    echo "PR #${number} already carries the awaiting-maintainer-merge note; not repeating it."
                  fi
                fi
                echo "PR #${number} is green; only a write-access approval is missing (rule: review required). Leaving it to a maintainer merge."
                add_awaiting "$number" "$blocked_reason"
              else
                echo "::error::Could not merge PR #${number} (no usable approval and no ruleset bypass for the acting identity)."
                failures=$((failures + 1))
              fi
              echo "::endgroup::"
              continue
            fi

            gh pr comment "$number" --repo "$REPO" \
              --body "Autonomously merged by the consolidation workflow (ci#538): required CI green, checks verified via the API. CI run: ${RUN_URL}" \
              >/dev/null 2>&1 || echo "::warning::Merged PR #${number} but could not post the audit comment."
            echo "::endgroup::"
          done
          # ci#1067: green PRs that only lack a write-access approval are
          # reported here; a red run then means a real regression.
          write_summary
          if [ "${#awaiting[@]}" -gt 0 ]; then
            echo "${#awaiting[@]} green PR(s) awaiting a maintainer merge (ci#1067); see the job summary."
          fi
          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} PR(s) could not be auto-approved/merged."
            exit 1
          fi
