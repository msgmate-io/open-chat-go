# Thin caller: the reusable implementation lives in
# reusable-open-chat-issue-plan.yaml (usable as-is by other repositories).
name: Open-Chat Issue Plan

on:
  issues:
    types:
      - assigned

permissions:
  contents: read
  issues: write

jobs:
  open-chat-issue-plan:
    name: Open-Chat Issue Plan
    uses: ./.github/workflows/reusable-open-chat-issue-plan.yaml
    with:
      bot_user: ${{ vars.OPEN_CHAT_BOT_GITHUB_USER || 'cur1ousdude' }}
      allowed_author: ${{ vars.OPEN_CHAT_ALLOWED_AUTHOR || 'tbscode' }}
      host: ${{ vars.OPEN_CHAT_HOST || 'https://ci.msgmate.io' }}
      plan_bot: ${{ vars.OPEN_CHAT_PLAN_BOT || 'issue-plan-bot' }}
    secrets:
      OPEN_CHAT_API_TOKEN: ${{ secrets.OPEN_CHAT_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
