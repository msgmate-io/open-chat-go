name: Dispatch Full Build and Release

# After a merge to `main` or `production`, kick off the private full-profile
# build + release that lives in the private CI repository
# (`msgmate-io/open-chat-go-ci`, workflow `build-full-release.yaml`).
#
# This public workflow references the private workflow generically only: it
# names no private integrations and publishes no `-full` assets itself. The
# build detail, assets, image tags and resulting GitHub Release stay private.
#
# Mirrors the `dispatch-private-sandbox-tests` job in
# `run-pr-ci-tests-and-deployments.yaml` (POST to the CI repo's workflow
# dispatch endpoint with the bot token).

on:
  push:
    branches:
      - main
      - production

concurrency:
  group: dispatch-full-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI_REPOSITORY: ${{ vars.CI_REPOSITORY || 'msgmate-io/open-chat-go-ci' }}
  CI_REF: ${{ vars.CI_REF || 'main' }}

jobs:
  dispatch-full-release:
    name: Dispatch private full build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full build and release workflow
        env:
          CI_DISPATCH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          TARGET_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${TARGET_REF}" = "production" ]; then
            RELEASE_KIND="production"
            PRERELEASE="false"
          else
            RELEASE_KIND="main"
            PRERELEASE="true"
          fi
          payload="$(
            jq -n \
              --arg ref "$CI_REF" \
              --arg targetRef "$TARGET_REF" \
              --arg releaseKind "$RELEASE_KIND" \
              --arg sourceSha "$SOURCE_SHA" \
              --arg prerelease "$PRERELEASE" \
              '{
                ref: $ref,
                inputs: {
                  target_ref: $targetRef,
                  release_kind: $releaseKind,
                  source_sha: $sourceSha,
                  prerelease: $prerelease
                }
              }'
          )"
          if ! curl -fsSL -X POST \
            -H "Authorization: Bearer ${CI_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CI_REPOSITORY}/actions/workflows/build-full-release.yaml/dispatches" \
            -d "$payload"; then
            echo "::warning::Could not dispatch the full build (is build-full-release.yaml on ${CI_REF}?)."
            exit 0
          fi
          echo "Dispatched the full build+release in ${CI_REPOSITORY} (kind=${RELEASE_KIND}, ref=${TARGET_REF})."
