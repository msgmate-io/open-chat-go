# ci#1061: the identity provider behind https://msgmate.io.
# Rendered by development/identity-provider/render_keycloak_manifests.py -
# edit the renderer, never this file, and re-run it with --write.
apiVersion: v1
kind: Namespace
metadata:
  name: identity-provider
  labels:
    app.kubernetes.io/part-of: open-chat-identity-provider
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: identity-provider
automountServiceAccountToken: false
---
# Keycloak is the OIDC issuer for stage.msgmate.io: the discovery document at
# https://id.stage.msgmate.io/realms/main/.well-known/openid-configuration has to
# name exactly that issuer, because the backend compares it to the ID token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: open-chat-identity-provider
    app.kubernetes.io/instance: staging
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          imagePullPolicy: IfNotPresent
          # --import-realm applies the committed realm template on start; an
          # existing realm is left alone, so this is a no-op after the first boot.
          args: ["start", "--import-realm"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            # The issuer: https://id.stage.msgmate.io/realms/main
            - name: KC_HOSTNAME
              value: "https://id.stage.msgmate.io"
            # A proxy that rewrites Host would change the issuer and every login
            # would fail an issuer/audience check, so the host is fixed.
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            # Sticky sessions on the Ingress keep one login flow on one pod; the
            # local cache is what Keycloak supports without an Infinispan cluster.
            - name: KC_CACHE
              value: "local"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: host
            - name: KC_DB_URL_PORT
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: port
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: database
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            # Only needed for the first start / admin recovery; the operator
            # creates this Secret out of band.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The realm template from development/identity-provider/realm/, as a
            # ConfigMap the operator creates out of band.
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: data
              mountPath: /opt/keycloak/data
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: staging
  annotations:
    # One login flow spans several requests: keep a browser session on one pod
    # while KC_CACHE is local.
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # Keycloak reads the scheme from X-Forwarded-* (KC_PROXY_HEADERS).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - id.stage.msgmate.io
      secretName: keycloak-tls
  rules:
    - host: id.stage.msgmate.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
---
# The IdP only accepts traffic from the ingress controller, only talks to DNS and
# its database, and only exposes its health endpoints inside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: identity-provider
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
    - ports:
        - port: 9000
          protocol: TCP
  egress:
    - ports:
        - port: 5432
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
