services:
  backend:
    build:
      dockerfile: dev.dockerfile
      context: .
      args:
        INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-core-only}
    image: dev-backend
    depends_on:
      integration-sync:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      redis:
        condition: service_healthy
      # ci#878: optional PostgreSQL backend. `required: false` keeps the default
      # (SQLite) stack working when the `postgres` profile is not enabled, while
      # still gating startup on a healthy database when it is.
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "1984:1984"
    volumes:
      - ./backend:/backend
      - ./integrations.yaml:/integrations.yaml:ro
      - ./integrations.lock.json:/integrations.lock.json:ro
      - ./development/build-tools:/development/build-tools:ro
      # Mirrored private manifest/lock (and setup markers) written by
      # integration-sync; resolve needs it to know private profiles like full.
      - ./.integrations:/.integrations:ro
      - ./clients/go_tool_interface:/clients/go_tool_interface
      - ./clients/go_integration_interface:/clients/go_integration_interface
      - ./clients/integrations:/clients/integrations
      - /var/run/docker.sock:/var/run/docker.sock
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY}
      OPEN_CHAT_CONFIG: ${OPEN_CHAT_CONFIG:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IONOS_API_KEY: ${IONOS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_API_HOST: ${ANTHROPIC_API_HOST}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_API_HOST: ${LITELLM_API_HOST}
      MSGMATE_CLUSTER_API_KEY: ${MSGMATE_CLUSTER_API_KEY}
      MSGMATE_CLUSTER_HOST: ${MSGMATE_CLUSTER_HOST}
      INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-core-only}
      # integration-sync already materialized the profile; skip the setup pass
      # here (it would otherwise try to re-clone into the read-only mounts).
      OPENCHAT_NO_SETUP: "1"
      FRONTEND_PROXY: ${FRONTEND_PROXY:-http://frontend:3000}
      ROOT_CREDENTIALS: ${ROOT_CREDENTIALS:-admin:password}
      # Database backend. Defaults to the historical SQLite file; set
      # DB_BACKEND=postgres (and a postgres:// DSN in DB_PATH) to run the dev
      # stack against the profile-gated `postgres` service below (ci#878).
      DB_BACKEND: ${DB_BACKEND:-sqlite}
      DB_PATH: ${DB_PATH:-/tmp/data.db}
      CREATE_EXTRA_USER: ${CREATE_EXTRA_USER}
      CREATE_EXTRA_BOT: ${CREATE_EXTRA_BOT}
      ADD_BOT_FROM_CONFIG: ${ADD_BOT_FROM_CONFIG}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-1984}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BROWSER_TOKEN_TTL_SECONDS: ${BROWSER_TOKEN_TTL_SECONDS:-900}
      BROWSER_TOKEN_MAX_TTL_SECONDS: ${BROWSER_TOKEN_MAX_TTL_SECONDS:-3600}
    env_file:
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  integration-sync:
    build:
      dockerfile: development/build-tools/sync.dockerfile
      context: .
    image: dev-integration-sync
    # Runs as root only to repair artifacts left root-owned by older runs and
    # then drops privileges to the owner of the bind-mounted checkout, so the
    # generated integrations, .integrations cache and symlinks stay editable by
    # the developer and are not rejected by git as "dubious ownership".
    entrypoint: ["python3", "/workspace/development/scripts/integration_sync_entrypoint.py"]
    command: ["prepare"]
    environment:
      INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-core-only}
      # Writable HOME for git/ssh after the privilege drop (credentials are
      # injected via GIT_CONFIG_* by the manager).
      HOME: /tmp
      # Let the manager discover the developer's already-authenticated git
      # credentials for private profile repos (see openchat_integrations.credentials):
      # the host home is mounted read-only below and a forwarded SSH agent is
      # exposed here. GITHUB_TOKEN/GH_TOKEN (e.g. from .env via `gh auth token`)
      # take precedence when set.
      OPENCHAT_HOST_HOME: /host-home
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      SSH_AUTH_SOCK: /run/ssh-agent.sock
    volumes:
      - ./:/workspace
      # The host home is mounted read-only so the manager can read the host's
      # git/gh credentials (~/.gitconfig, ~/.git-credentials, ~/.config/gh,
      # ~/.ssh). Mounting the whole home avoids Docker creating empty
      # directories for credential files that a developer may not have.
      - ${HOME}:/host-home:ro
      # Forward the host SSH agent (a no-op /dev/null when SSH_AUTH_SOCK is unset).
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/ssh-agent.sock
    networks:
      - app-network
  frontend:
    build:
      dockerfile: dev.dockerfile
      context: ./frontend/
    image: dev-frontend
    depends_on:
      integration-sync:
        condition: service_completed_successfully
    command: sh -c "if [ ! -x node_modules/.bin/vike ]; then npm ci | cat; fi && npm run dev | cat"
    environment:
      VITE_ENABLE_ADMIN_MODEL_DEFAULT_SYNC: ${VITE_ENABLE_ADMIN_MODEL_DEFAULT_SYNC:-1}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      # The integration page/package symlinks under frontend/ are created
      # relative to the repo root, so Vite needs the checkouts at the matching
      # absolute path (/clients/integrations) to resolve them. Writable because
      # Vike emits per-page build artifacts next to the integration configs.
      - ./clients/integrations:/clients/integrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  storybook:
    profiles: [ "storybook" ]
    image: dev-frontend
    build:
      dockerfile: dev.dockerfile
      context: ./frontend/
    command: sh -c "npm install | cat && npm run storybook --workspace=@open-chat-go/ui -- --host 0.0.0.0 --no-open --ci | cat"
    environment:
      # Hosted under /storybook so Vite assets don't collide with the app frontend.
      STORYBOOK_BASE_PATH: storybook
      STORYBOOK_DISABLE_VITEST: "1"
    ports:
      - "6006:6006"
    volumes:
      - ./frontend:/frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    # ci#722 (coder-sandbox readiness gate, ci#666/#638): keep the redis
    # queue/state endpoint in the pool while a contended host is busy. An
    # explicit budget tolerates >= 60s of sustained failure (5s x 12) with a
    # timeout above the 1s kubelet/compose default, and the CPU limit/reservation
    # mirror the ci#722 deployment patch
    # (`development/redis-readiness/ci-722-redis-probes.patch.json`).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
        reservations:
          cpus: "0.1"
    networks:
      - app-network

  # ci#878: optional PostgreSQL service for local development/testing of the
  # PostgreSQL backend. It is disabled by default (the `postgres` profile is not
  # in COMPOSE_PROFILES) so a plain `docker compose up` keeps using SQLite.
  #
  # Enable it together with the backend override:
  #
  #   docker compose -f docker-compose.yaml -f docker-compose.postgres.yaml \
  #     --profile postgres up
  #
  # (or `COMPOSE_PROFILES=postgres COMPOSE_FILE=docker-compose.yaml:docker-compose.postgres.yaml docker compose up`).
  # The override points the backend at this service; the connection default is
  # postgres://openchat:openchat@postgres:5432/openchat?sslmode=disable.
  postgres:
    profiles: [ "postgres" ]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openchat}
      POSTGRES_DB: ${POSTGRES_DB:-openchat}
      # Keep the cluster in a subdirectory so a bind-mounted/named volume that
      # already has a lost+found (or other stray files) is still usable.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 5433 on the host so it does not clash with a host PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Mirror the ci#722 redis budget philosophy: give the probe room for a cold
    # start + first-boot initdb instead of flapping the backend's dependency.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchat} -d ${POSTGRES_DB:-openchat}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  go_mod_cache:
  go_build_cache:
  postgres_data:
