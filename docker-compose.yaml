services:
  backend:
    build:
      dockerfile: dev.dockerfile
      context: .
      args:
        INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-default}
    image: dev-backend
    depends_on:
      frontend:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "1984:1984"
    volumes:
      - ./backend:/backend
      - ./clients/go_tool_interface:/clients/go_tool_interface
      - ./clients/go_integration_interface:/clients/go_integration_interface
      - ./clients/integrations:/clients/integrations
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_API_HOST: ${ANTHROPIC_API_HOST}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_API_HOST: ${LITELLM_API_HOST}
      INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-default}
      FRONTEND_PROXY: ${FRONTEND_PROXY:-http://frontend:3000}
      ROOT_CREDENTIALS: ${ROOT_CREDENTIALS:-admin:password}
      DB_PATH: ${DB_PATH:-/tmp/data.db}
      CREATE_EXTRA_USER: ${CREATE_EXTRA_USER:-littleworld:Test123!}
      CREATE_EXTRA_BOT: ${CREATE_EXTRA_BOT}
      ADD_BOT_FROM_CONFIG: ${ADD_BOT_FROM_CONFIG}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-1984}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      app-network:
      open-chat-lw-shared:
        aliases:
          - open-chat-go-backend
  frontend:
    build:
      dockerfile: dev.dockerfile
      context: ./frontend/
    image: dev-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  storybook:
    profiles: [ "storybook" ]
    image: dev-frontend
    build:
      dockerfile: dev.dockerfile
      context: ./frontend/
    command: sh -c "npm install | cat && npm run storybook --workspace=@open-chat-go/ui -- --host 0.0.0.0 --no-open --ci | cat"
    environment:
      # Hosted under /storybook so Vite assets don't collide with the app frontend.
      STORYBOOK_BASE_PATH: storybook
      STORYBOOK_DISABLE_VITEST: "1"
    ports:
      - "6006:6006"
    volumes:
      - ./frontend:/frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  open-chat-lw-shared:
    name: open-chat-lw-shared
    driver: bridge

volumes:
  go_mod_cache:
  go_build_cache:
