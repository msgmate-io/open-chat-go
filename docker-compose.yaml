services:
  backend:
    build:
      dockerfile: dev.dockerfile
      context: .
      args:
        INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-core-only}
    image: dev-backend
    depends_on:
      integration-sync:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "1984:1984"
    volumes:
      - ./backend:/backend
      - ./integrations.yaml:/integrations.yaml:ro
      - ./integrations.lock.json:/integrations.lock.json:ro
      - ./development/build-tools:/development/build-tools:ro
      # Mirrored private manifest/lock (and setup markers) written by
      # integration-sync; resolve needs it to know private profiles like full.
      - ./.integrations:/.integrations:ro
      - ./clients/go_tool_interface:/clients/go_tool_interface
      - ./clients/go_integration_interface:/clients/go_integration_interface
      - ./clients/integrations:/clients/integrations
      - /var/run/docker.sock:/var/run/docker.sock
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY}
      OPEN_CHAT_CONFIG: ${OPEN_CHAT_CONFIG:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IONOS_API_KEY: ${IONOS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_API_HOST: ${ANTHROPIC_API_HOST}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_API_HOST: ${LITELLM_API_HOST}
      MSGMATE_CLUSTER_API_KEY: ${MSGMATE_CLUSTER_API_KEY}
      MSGMATE_CLUSTER_HOST: ${MSGMATE_CLUSTER_HOST}
      INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-core-only}
      # integration-sync already materialized the profile; skip the setup pass
      # here (it would otherwise try to re-clone into the read-only mounts).
      OPENCHAT_NO_SETUP: "1"
      FRONTEND_PROXY: ${FRONTEND_PROXY:-http://frontend:3000}
      ROOT_CREDENTIALS: ${ROOT_CREDENTIALS:-admin:password}
      DB_PATH: ${DB_PATH:-/tmp/data.db}
      CREATE_EXTRA_USER: ${CREATE_EXTRA_USER}
      CREATE_EXTRA_BOT: ${CREATE_EXTRA_BOT}
      ADD_BOT_FROM_CONFIG: ${ADD_BOT_FROM_CONFIG}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-1984}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BROWSER_TOKEN_TTL_SECONDS: ${BROWSER_TOKEN_TTL_SECONDS:-900}
      BROWSER_TOKEN_MAX_TTL_SECONDS: ${BROWSER_TOKEN_MAX_TTL_SECONDS:-3600}
    env_file:
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  integration-sync:
    build:
      dockerfile: development/build-tools/sync.dockerfile
      context: .
    image: dev-integration-sync
    environment:
      INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-core-only}
      # Let the manager discover the developer's already-authenticated git
      # credentials for private profile repos (see openchat_integrations.credentials):
      # the host home is mounted read-only below and a forwarded SSH agent is
      # exposed here. GITHUB_TOKEN/GH_TOKEN (e.g. from .env via `gh auth token`)
      # take precedence when set.
      OPENCHAT_HOST_HOME: /host-home
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      SSH_AUTH_SOCK: /run/ssh-agent.sock
    volumes:
      - ./:/workspace
      # The host home is mounted read-only so the manager can read the host's
      # git/gh credentials (~/.gitconfig, ~/.git-credentials, ~/.config/gh,
      # ~/.ssh). Mounting the whole home avoids Docker creating empty
      # directories for credential files that a developer may not have.
      - ${HOME}:/host-home:ro
      # Forward the host SSH agent (a no-op /dev/null when SSH_AUTH_SOCK is unset).
      - ${SSH_AUTH_SOCK:-/dev/null}:/run/ssh-agent.sock
    networks:
      - app-network
  frontend:
    build:
      dockerfile: dev.dockerfile
      context: ./frontend/
    image: dev-frontend
    depends_on:
      integration-sync:
        condition: service_completed_successfully
    command: sh -c "if [ ! -x node_modules/.bin/vike ]; then npm ci | cat; fi && npm run dev | cat"
    environment:
      VITE_ENABLE_ADMIN_MODEL_DEFAULT_SYNC: ${VITE_ENABLE_ADMIN_MODEL_DEFAULT_SYNC:-1}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      # The integration page/package symlinks under frontend/ are created
      # relative to the repo root, so Vite needs the checkouts at the matching
      # absolute path (/clients/integrations) to resolve them. Writable because
      # Vike emits per-page build artifacts next to the integration configs.
      - ./clients/integrations:/clients/integrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  storybook:
    profiles: [ "storybook" ]
    image: dev-frontend
    build:
      dockerfile: dev.dockerfile
      context: ./frontend/
    command: sh -c "npm install | cat && npm run storybook --workspace=@open-chat-go/ui -- --host 0.0.0.0 --no-open --ci | cat"
    environment:
      # Hosted under /storybook so Vite assets don't collide with the app frontend.
      STORYBOOK_BASE_PATH: storybook
      STORYBOOK_DISABLE_VITEST: "1"
    ports:
      - "6006:6006"
    volumes:
      - ./frontend:/frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  go_mod_cache:
  go_build_cache:
