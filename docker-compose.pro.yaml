services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-alpine
      args:
        INTEGRATION_PROFILE: ${INTEGRATION_PROFILE:-default}
    ports:
      - 1984:1984
    environment:
      DB_BACKEND: ${DB_BACKEND:-postgres}
      DB_PATH: ${DB_PATH:-postgresql://postgres:dbpass@db:5432/dbname}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-1984}
      FRONTEND_PROXY: ${FRONTEND_PROXY}
      ROOT_CREDENTIALS: ${ROOT_CREDENTIALS:-admin:password}
      CREATE_EXTRA_USER: ${CREATE_EXTRA_USER:-littleworld:Test123!}
      CREATE_EXTRA_BOT: ${CREATE_EXTRA_BOT}
      ADD_BOT_FROM_CONFIG: ${ADD_BOT_FROM_CONFIG}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_API_HOST: ${ANTHROPIC_API_HOST}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_API_HOST: ${LITELLM_API_HOST}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BROWSER_TOKEN_TTL_SECONDS: ${BROWSER_TOKEN_TTL_SECONDS:-900}
      BROWSER_TOKEN_MAX_TTL_SECONDS: ${BROWSER_TOKEN_MAX_TTL_SECONDS:-3600}
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dbpass
      - POSTGRES_DB=dbname
    ports:
      - "8084:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
