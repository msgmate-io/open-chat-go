        - { source: integrations/opencode/projects/add, asset: projects/add/index.html }
        - { source: integrations/opencode/projects/project-uuid-placeholder/edit, asset: projects/project_uuid/edit/index.html }

  ssh:
    module: github.com/msgmate-io/ssh-integration
