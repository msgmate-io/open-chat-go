        - { source: integrations/kubernetes/clusters/add, asset: clusters/add/index.html }
        - { source: integrations/kubernetes/clusters/cluster-uuid-placeholder/edit, asset: clusters/cluster_uuid/edit/index.html }

  opencode:
    module: github.com/msgmate-io/opencode-integration
    import: github.com/msgmate-io/opencode-integration
