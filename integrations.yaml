# Open-Chat integration manifest.
#
# This file is the single source of truth for which integrations exist, where
# their source lives, how they are selected per profile, and what they
# contribute to the Go build and the frontend build.
#
# Integration source is fetched on demand by
# `openchat-integrations sync` into `path` (gitignored). No git
# submodules are required for integrations anymore.
#
# Sources:
#   git       - shallow clone/fetch `repo` at `ref` into `path`
#   local     - use an existing checkout at `path` (developer override)
#   submodule - legacy: `git submodule update --init <path>`
#
# Local overrides for development can be placed in `integrations.local.yaml`
# (gitignored), e.g.:
#   overrides:
#     git:
#       source: local
#       path: ../my-git-integration-fork
#
# `depends_on` lists other integrations a module imports; `sync` fetches the
# transitive closure so the Go workspace can resolve every import.
#
# `frontend.pages` maps prerendered Vike output to the integration's embedded
# assets. Phase 2 moves ownership of this list into each integration repo via
# `integration.frontend.json`; until then the parent manifest is authoritative.
version: 1

# Profile selected when INTEGRATION_PROFILE is unset.
default_profile: core-only

# Where remote checkouts are cached between syncs (relative to repo root).
cache_dir: .integrations

# Profiles are ordered sets of integration ids. "*" means every integration.
profiles:
  core-only:
    - mcp
    - rest_api_tool
    - go_client
  default:
    - mcp
    - rest_api_tool
    - go_client
    - matrix
    - docker_sandbox
    - git
    - kubernetes
  full:
    - "*"

integrations:
  mcp:
    module: github.com/msgmate-io/mcp-integration
    import: github.com/msgmate-io/mcp-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-mcp-integration
    ref: main
    path: clients/integrations/mcp_integration
    private: false
    depends_on:
      - rest_api_tool
    frontend:
      name: mcp

  rest_api_tool:
    module: github.com/msgmate-io/rest-api-tool-integration
    import: github.com/msgmate-io/rest-api-tool-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-rest-api-tool-integration
    ref: main
    path: clients/integrations/rest_api_tool_integration
    private: false
    frontend:
      name: rest_api_tool

  go_client:
    module: github.com/msgmate-io/go-client-integration
    import: github.com/msgmate-io/go-client-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-golang-client
    ref: main
    path: clients/integrations/go_client_integration
    private: false

  matrix:
    module: github.com/msgmate-io/matrix-integration
    import: github.com/msgmate-io/matrix-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-matrix-integration
    ref: main
    path: clients/integrations/matrix_integration
    private: true
    tags:
      - goolm
    depends_on:
      - go_client
      - rest_api_tool

  docker_sandbox:
    module: github.com/msgmate-io/docker-sandbox-integration
    import: github.com/msgmate-io/docker-sandbox-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-docker-sandbox-integration
    ref: main
    path: clients/integrations/docker_sandbox_integration
    private: true
    depends_on:
      - go_client
      - opencode
      - rest_api_tool
    frontend:
      name: docker_sandbox

  git:
    module: github.com/msgmate-io/git-integration
    import: github.com/msgmate-io/git-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-git-integration
    ref: main
    path: clients/integrations/git_integration
    private: true
    tags:
      - gitintegration
    bootstrap: git
    depends_on:
      - go_client
      - opencode
      - rest_api_tool
    frontend:
      name: git

  kubernetes:
    module: github.com/msgmate-io/kubernetes-integration
    import: github.com/msgmate-io/kubernetes-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-kubernetes-integration
    ref: main
    path: clients/integrations/kubernetes_integration
    private: true
    tags:
      - kubernetesintegration
    bootstrap: kubernetes
    frontend:
      name: kubernetes

  opencode:
    module: github.com/msgmate-io/opencode-integration
    import: github.com/msgmate-io/opencode-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-opencode-integration
    ref: main
    path: clients/integrations/opencode_integration
    private: true
    tags:
      - opencodeintegration
    bootstrap: opencode
    depends_on:
      - go_client
      - rest_api_tool
    frontend:
      name: opencode

  ssh:
    module: github.com/msgmate-io/ssh-integration
    import: github.com/msgmate-io/ssh-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-ssh-integration.git
    ref: main
    path: clients/integrations/ssh_integration
    private: true
    tags:
      - sshintegration
    bootstrap: ssh
    depends_on:
      - go_client
    frontend:
      name: ssh

  voice:
    module: github.com/msgmate-io/voice-integration
    import: github.com/msgmate-io/voice-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-voice-integration
    ref: main
    path: clients/integrations/voice_integration
    private: true
    depends_on:
      - go_client
    frontend:
      name: voice

  emails:
    module: github.com/msgmate-io/email-integration
    import: github.com/msgmate-io/email-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-email-integration
    ref: main
    path: clients/integrations/email_integration
    private: true
    frontend:
      name: emails

  admin:
    module: github.com/msgmate-io/admin-db-managemnt-integration
    import: github.com/msgmate-io/admin-db-managemnt-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-admin-db-management-integration
    ref: main
    path: clients/integrations/admin_db_managemnt_integration
    private: true
    frontend:
      name: admin

  account_management:
    module: github.com/msgmate-io/account-management-integration
    import: github.com/msgmate-io/account-management-integration
    source: git
    repo: https://github.com/msgmate-io/open-chat-go-account-management-integration.git
    ref: main
    path: clients/integrations/account_management
    private: true
    depends_on:
      - rest_api_tool
    frontend:
      name: account_management
