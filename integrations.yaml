    source: git
    repo: https://github.com/msgmate-io/open-chat-go-ssh-integration.git
    ref: main
    path: clients/integrations/ssh_integration
    private: true
    tags:
      - sshintegration
    bootstrap: ssh
    depends_on:
      - go_client
    frontend:
      name: ssh
      pages:
        - { source: integrations/ssh/servers, asset: servers/index.html }
        - { source: integrations/ssh/servers/add, asset: servers/add/index.html }
        - { source: integrations/ssh/servers/server-uuid-placeholder/details, asset: servers/server_uuid/details/index.html }
        - { source: integrations/ssh/servers/server-uuid-placeholder/edit, asset: servers/server_uuid/edit/index.html }
        - { source: integrations/ssh/servers/server-uuid-placeholder/shell, asset: servers/server_uuid/shell/index.html }
        - { source: integrations/ssh/keys, asset: keys/index.html }
        - { source: integrations/ssh/keys/add, asset: keys/add/index.html }
        - { source: integrations/ssh/keys/key-uuid-placeholder/details, asset: keys/key_uuid/details/index.html }
        - { source: integrations/ssh/keys/key-uuid-placeholder/edit, asset: keys/key_uuid/edit/index.html }

  voice:
