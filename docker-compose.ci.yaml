services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/msgmate-io/open-chat-go:ci-image-not-set}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-1984}:1984"
    environment:
      ROOT_CREDENTIALS: "admin:password"
      HOST: "0.0.0.0"
      PORT: 1984
      REDIS_URL: "redis://redis:6379/0"
      LITELLM_API_HOST: ${LITELLM_API_HOST}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      MSGMATE_CLUSTER_API_KEY: ${MSGMATE_CLUSTER_API_KEY}
      MSGMATE_CLUSTER_HOST: ${MSGMATE_CLUSTER_HOST}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_API_HOST: ${ANTHROPIC_API_HOST}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      IONOS_API_KEY: ${IONOS_API_KEY:-}
      OPEN_CHAT_CONFIG: ${OPEN_CHAT_CONFIG:-}
      # ci#645: keep the CI logs readable; set LOG_LEVEL=debug for full tracing.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Native-bot migration (ci#584 / umbrella ci#585). NATIVE_CODER_CUTOVER
      # stages the opencode retirement (fallback | native | retired) and
      # MSGMATECODER_NATIVE_ROLLBACK_WINDOW lists the families whose rollback
      # window is open. Both are read per request, so flipping (or rolling back)
      # is an env change on this deployment - set them through
      # publish-open-chat-config.yaml (DRY_RUN=true first).
      NATIVE_CODER_CUTOVER: ${NATIVE_CODER_CUTOVER:-}
      MSGMATECODER_NATIVE_ROLLBACK_WINDOW: ${MSGMATECODER_NATIVE_ROLLBACK_WINDOW:-}
      OPENCODE_PERMISSION_MODE: ${OPENCODE_PERMISSION_MODE:-}
      # Deterministic benchmark runs + stall detection for headless runs.
      OPENCODE_TEMPERATURE: ${OPENCODE_TEMPERATURE:-}
      OPENCODE_NO_PROGRESS_TIMEOUT_SECONDS: ${OPENCODE_NO_PROGRESS_TIMEOUT_SECONDS:-}
      OPENCODE_IDLE_TIMEOUT_SECONDS: ${OPENCODE_IDLE_TIMEOUT_SECONDS:-}
      OPENCODE_PERMISSION_IDLE_TIMEOUT_SECONDS: ${OPENCODE_PERMISSION_IDLE_TIMEOUT_SECONDS:-}
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    # ci#722 (coder-sandbox readiness gate, ci#666/#638): the queue/state
    # endpoint must never be evicted merely because a contended node is busy.
    # An explicit, contention-tolerant budget (sustained failure tolerated
    # >= 60s: interval 5s x retries 12) and a timeout above the 1s/3s default
    # keep a healthy redis in the pool under load, and the CPU/memory budget
    # below gives redis a scheduling guarantee behind the agent workloads -
    # the same contract the live Deployment is patched with
    # (`development/redis-readiness/ci-722-redis-probes.patch.json`).
    #
    # The budget uses the non-swarm keys (`cpus`/`mem_limit`) that
    # `docker compose up` actually honours and that the sandbox overlay
    # (`docker-compose.sandbox.yaml` in the private CI repo) also pins with
    # the SAME env-overridable values. Expressing the *limit* as
    # deploy.resources.limits here instead makes compose reject the merged
    # project ("can't set distinct values on 'mem_limit' and
    # 'deploy.resources.limits.memory'"), which kept the sandbox stack from
    # starting (r56 regression, ci#785). The scheduling *reservation* stays
    # under deploy.resources.reservations, which has no top-level counterpart
    # and therefore merges cleanly.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    cpus: "${REDIS_CPUS:-0.5}"
    mem_limit: "${REDIS_MEM_LIMIT:-512m}"
    deploy:
      resources:
        reservations:
          cpus: "${REDIS_CPU_RESERVATION:-0.1}"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
