services:
  dev-sandbox:
    build: .
    privileged: true
    volumes:
      - .:/workspace:cached
      - opencode-config:/root/.opencode
      - gh-config:/root/.config/gh
      - docker-data:/var/lib/docker
    environment:
      - TERM=xterm-256color
    profiles:
      - dev

volumes:
  opencode-config:
  gh-config:
  docker-data: